    const r = this.match.stage.respawn;
    this.x = r.x; this.y = r.y;
    const anyInput = inp.left || inp.right || inp.down || inp.upP || inp.attackP || inp.specialP || inp.shieldP;
    if ((this.stateTimer > 20 && anyInput) || this.stateTimer > 240) {
      this.state = 'air'; this.vy = 0;
    }
  }

  checkBlastZones() {
    const b = this.match.stage.blast;
    const cy = this.y - this.def.height / 2;
    if (this.x < b.left || this.x > b.right || cy > b.bottom || cy < b.top) this.match.onKO(this);
  }

  // ---------------------------------------------------------------- PHYSICS
  physics() {
    // Knockback slowly fades (it's separate from normal movement).
    const ls = Math.hypot(this.kbx, this.kby);
    if (ls > 0) {
      const ns = Math.max(0, ls - KB_DECAY);
      this.kbx *= ns / ls; this.kby *= ns / ls;
    }
    if (!this.grounded) {
      // While launched hard, gravity waits until the launch slows down.
      const launching = this.state === 'hitstun' && ls > 7;
      if (!this.noGravity && !launching) {
        const maxFall = this.fastFalling ? this.def.fastFall : this.def.maxFall;
        this.vy = Math.min(this.vy + this.def.gravity, maxFall);
      }
    } else {
      this.vy = 0;
      if (this.kby > 0) this.kby = 0;
      this.kbx *= 0.9;                               // sliding along the floor
    }
    this.moveAndCollide();
  }

  moveAndCollide() {
    const st = this.match.stage;
    const dx = this.vx + this.kbx, dy = this.vy + this.kby;
    const prevX = this.x, prevY = this.y;
    const h = this.curHeight();

    // 1. horizontal movement, then push out of solid walls
    this.x += dx;
    for (const p of st.platforms) {
      if (!p.solid) continue;
      if (this.y > p.y + 1 && this.y - h < p.y + p.h && this.x + this.halfW > p.x && this.x - this.halfW < p.x + p.w) {
        this.x = prevX <= p.x + p.w / 2 ? p.x - this.halfW : p.x + p.w + this.halfW;
        this.vx = 0;
        this.kbx = this.state === 'hitstun' ? -this.kbx * 0.4 : 0;    // bounce off walls when launched
      }
    }

    // 2. still standing on something?
    if (this.grounded) {
      const p = this.platform;
      if (!p || this.x < p.x - 4 || this.x > p.x + p.w + 4) {
        this.grounded = false; this.platform = null;     // walked off the edge
        this.leaveGround();
      } else { this.y = p.y; return; }
    }

    // 3. vertical movement
    this.y += dy;
    if (dy >= 0) {                                        // falling: land on platforms
      for (const p of st.platforms) {
        if (!p.solid && this.dropTimer > 0) continue;
        if (this.x < p.x - 4 || this.x > p.x + p.w + 4) continue;
        if (prevY <= p.y + 0.5 && this.y >= p.y) {
          if (this.state === 'hitstun' && dy > 9) {      // launched into the floor: bounce!
            this.y = p.y;
            this.vy = 0; this.kby = -dy * 0.45;
            spawnDust(this.x, p.y, 8);
            this.match.shake(4);
            break;
          }
          this.y = p.y; this.vy = 0; this.kby = 0;
          this.grounded = true; this.platform = p;
          this.land();
          break;
        }
      }
    } else {                                              // rising: bonk heads on solid ceilings
      for (const p of st.platforms) {
        if (!p.solid) continue;
        if (this.x + this.halfW <= p.x || this.x - this.halfW >= p.x + p.w) continue;
        if (prevY - h >= p.y + p.h - 0.5 && this.y - h < p.y + p.h) {
          this.y = p.y + p.h + h; this.vy = 0; this.kby = Math.abs(this.kby) * 0.4;
        }
      }
    }
  }

  // Called once when touching down on a platform.
  land() {
    this.airJumps = this.def.airJumps;
    this.fastFalling = false; this.usedSideSpecial = false; this.usedAirDodge = false;
    switch (this.state) {
      case 'air':
        this.state = 'landing'; this.stateTimer = 3;
        spawnDust(this.x, this.y, 5); Sound.play('land');
        break;
      case 'helpless':
        this.state = 'landing'; this.stateTimer = 14;
        spawnDust(this.x, this.y, 8); Sound.play('land');
        break;
      case 'attack':
        if (this.move.aerial) {                            // aerials have landing lag
          this.state = 'landing'; this.stateTimer = this.move.landingLag || 6;
          this.move = null; this.moveName = '';
          spawnDust(this.x, this.y, 5);
        } else if (this.move.landCancel && this.moveFrame > this.move.startup + 2) {
          this.state = 'landing'; this.stateTimer = 12;
          this.move = null; this.moveName = '';
        }
        break;
      case 'dodge':
        if (this.dodgeType === 'air') { this.state = 'landing'; this.stateTimer = 8; }
        break;
    }
  }

  // Called when walking (or being pushed) off a platform edge.
  leaveGround() {
    if (['idle', 'walk', 'crouch', 'landing', 'shield', 'jumpsquat'].includes(this.state)) this.state = 'air';
  }

  // Pushes the fighter out of solid platforms (used after teleporting).
  resolveStageOverlap() {
    const h = this.def.height;
    for (const p of this.match.stage.platforms) {
      if (!p.solid) continue;
      const box = { x: this.x - this.halfW, y: this.y - h, w: this.def.width, h };
      if (!rectsOverlap(box, p)) continue;
      const pushUp = this.y - p.y, pushDown = p.y + p.h - (this.y - h);
      const pushLeft = this.x + this.halfW - p.x, pushRight = p.x + p.w - (this.x - this.halfW);
      const min = Math.min(pushUp, pushDown, pushLeft, pushRight);
      if (min === pushUp) this.y = p.y - 0.5;
      else if (min === pushDown) this.y = p.y + p.h + h;
      else if (min === pushLeft) this.x = p.x - this.halfW;
      else this.x = p.x + p.w + this.halfW;
    }
  }

  emitAura() {
    if (this.invisible || this.animTime % 6 !== 0) return;
    emitElement(this.def.element, this.palette.fx, this.x + rand(-this.halfW, this.halfW),
      this.y - rand(0, this.def.height), 1, 0.6, { sizeMul: 0.6 });
  }

  // ----------------------------------------------------------------- DRAWING
  getPose() {
    const t = this.animTime;
    switch (this.state) {
      case 'idle': case 'respawn': return POSES.idle(t);
      case 'walk': return POSES.walk(t, clamp(Math.abs(this.vx) / this.def.walkSpeed, 0.2, 1));
      case 'crouch': case 'jumpsquat': case 'landing': return POSES.crouch(t);
      case 'air': return this.vy < 0 ? POSES.jump(t) : POSES.fall(t);
      case 'helpless': return POSES.helpless(t);
      case 'hitstun': case 'trapped': case 'grabbed': {
        const p = POSES.hurt(t);
        if (Math.hypot(this.kbx, this.kby) > 9) p.rot = t * 0.35;      // tumble when launched
        return p;
      }
      case 'shield': return POSES.guard(t);
      case 'dodge': {
        const p = POSES.dodge(t);
        if (this.dodgeType === 'roll') p.rot = this.dodgeDir * this.facing * (this.stateTimer / 28) * Math.PI * 2;
        return p;
      }
      case 'ledge': return POSES.hang(t);
      case 'ledgeclimb': return POSES.climb(t);
      case 'shieldbreak': return POSES.dizzy(t);
      case 'attack': {
        const m = this.move, f = this.moveFrame;
        const base = this.grounded ? POSES.idle(t) : POSES.jump(t);
        if (m.getPose) { const custom = m.getPose(this, f, base); if (custom) return custom; }
        return standardAttackPose(m, m.pose, f, base);
      }
    }
    return POSES.idle(t);
  }

  draw(c) {
    if (this.state === 'dead' || this.state === 'out') return;
    const pal = this.palette, def = this.def;
    if (this.state === 'respawn') drawRespawnPlatform(c, this.x, this.y, pal, this.stateTimer);
    if (this.state === 'attack' && this.move.drawBehind) this.move.drawBehind(c, this);
    if (this.invisible) return;

    let alpha = 1;
    if (this.invuln > 0 && Math.floor(this.animTime / 4) % 2 === 0) alpha = 0.4;   // flashing while invincible
    if (this.intangible && this.state === 'dodge') alpha = 0.5;
    const shakeX = this.hitlag > 0 && this.state === 'hitstun' ? rand(-3, 3) : 0;
    const flash = this.state === 'hitstun' && this.hitlag > 0;
    const strike = this.state === 'attack' && this.activeHitboxes().length > 0;
    drawFighter(c, def, flash ? FLASH_PALETTE : pal, this.x + shakeX, this.y, this.facing, this.getPose(), {
      alpha, time: this.animTime, wings: this.state === 'attack' && this.moveData.wings,
      charge: this.state === 'attack' ? this.moveData.charge : 0, glow: strike,
    });
    if (this.state === 'attack' && this.move.draw) this.move.draw(c, this);

    const cx = this.x, cy = this.y - def.height / 2;
    if (this.state === 'shield') {                     // shield bubble shrinks with its health
      const r = def.height * 0.62 * (0.35 + 0.65 * this.shieldHP / MAX_SHIELD);
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
      g.addColorStop(0, rgba(pal.glow, 0.05)); g.addColorStop(1, rgba(pal.glow, 0.55));
      c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = rgba(pal.light, 0.8); c.lineWidth = 2; c.stroke();
      c.restore();
    }
    if (this.state === 'trapped') {                    // Tide's bubble
      const r = def.height * 0.65;
      c.save();
      c.fillStyle = 'rgba(150,230,255,0.22)'; c.strokeStyle = 'rgba(220,250,255,0.85)'; c.lineWidth = 3;
      c.beginPath(); c.arc(cx, cy, r + Math.sin(this.animTime * 0.3) * 3, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.arc(cx - r * 0.4, cy - r * 0.45, r * 0.15, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    if (this.state === 'shieldbreak') {                // dizzy stars
      for (let i = 0; i < 3; i++) {
        const a = this.animTime * 0.12 + i * 2.1;
        drawText(c, '★', cx + Math.cos(a) * 26, this.y - def.height - 12 + Math.sin(a) * 6, { size: 16, color: '#ffe066' });
      }
    }
    if (this.slowTimer > 0) {                          // slowed by Lumen's flash
      c.save(); c.globalAlpha = 0.6; c.strokeStyle = '#fff2b0'; c.lineWidth = 2; c.setLineDash([4, 6]);
      c.beginPath(); c.arc(cx, cy, def.height * 0.6, this.animTime * 0.05, this.animTime * 0.05 + Math.PI * 2); c.stroke();
      c.restore();
    }
    // player marker above the head
    const my = this.y - def.height - 30;
    c.fillStyle = PLAYER_COLORS[this.index];
    c.beginPath(); c.moveTo(cx - 8, my); c.lineTo(cx + 8, my); c.lineTo(cx, my + 9); c.closePath(); c.fill();
    drawText(c, 'P' + (this.index + 1), cx, my - 10, { size: 13, color: PLAYER_COLORS[this.index], stroke: 3, strokeColor: '#000' });
  }
}


/* =======================================================================
   9. PROJECTILES
   -----------------------------------------------------------------------
   A projectile is a moving hitbox that belongs to a fighter (its owner).
   Each "kind" has its own update (how it moves) and draw (how it looks).
   ======================================================================= */

class Projectile {
  constructor(owner, o) {
    this.owner = owner;
    this.match = owner.match;
    this.kind = o.kind;
    this.dir = owner.facing;
    this.x = owner.x + (o.x || 0) * owner.facing;
    this.y = owner.y + (o.y || 0);
    this.vx = (o.vx || 0) * owner.facing;
    this.vy = o.vy || 0;
    this.w = o.w; this.h = o.h;
    this.life = o.life; this.maxLife = o.life;
    // the same hit fields as a hitbox
    this.dmg = o.dmg; this.bkb = o.bkb; this.kbs = o.kbs; this.angle = o.angle;
    this.radial = !!o.radial; this.effect = o.effect;
    this.pierce = !!o.pierce;                       // keeps going after hitting
    this.rehit = o.rehit || 0;
    this.reflectable = o.reflectable !== false;
    this.clash = o.clash !== false;                 // cancels out other projectiles
    this.hitSet = new Map();
    this.dead = false; this.age = 0;
    this.data = o.data || {};
    this.colors = owner.palette.fx;
    this.palette = owner.palette;
    this.element = owner.def.element;
  }
  rect() { return { x: this.x - this.w / 2, y: this.y - this.h / 2, w: this.w, h: this.h }; }

  update() {
    this.age++;
    const kind = PROJECTILE_KINDS[this.kind];
    if (kind.update) kind.update(this);
    this.x += this.vx; this.y += this.vy;
    if (--this.life <= 0) this.dead = true;
    if (kind.stopOnSolid) {                          // fizzle when hitting the main platform
      for (const p of this.match.stage.platforms) {
        if (p.solid && rectsOverlap(this.rect(), p)) { this.burst(); break; }
      }
    }
    const b = this.match.stage.blast;
    if (this.x < b.left || this.x > b.right || this.y < b.top || this.y > b.bottom) this.dead = true;
  }

  burst() {
    this.dead = true;
    emitElement(this.element, this.colors, this.x, this.y, 14, 4);
  }

  // Lumen's mirror: turn around, change owner, hit harder.
  reflect(by) {
    this.owner = by;
    this.vx = -this.vx * 1.15; this.vy = -this.vy * 0.5;
    if (Math.abs(this.vx) < 2) this.vx = by.facing * 4;
    this.dir = Math.sign(this.vx) || by.facing;
    this.dmg *= 1.3;
    this.life = Math.max(this.life, 60);
    this.hitSet.clear();
    this.colors = by.palette.fx;
    Sound.play('reflect');
    emitElement('light', by.palette.fx, this.x, this.y, 12, 4);
  }

  draw(c) { PROJECTILE_KINDS[this.kind].draw(c, this); }
}

const PROJECTILE_KINDS = {
  fireball: {
    stopOnSolid: true,
    update(p) {
      p.vy = Math.sin(p.age * 0.25) * 0.6;
      if (p.age % 2 === 0) emitElement('fire', p.colors, p.x - p.vx, p.y, 2, 1.2);
    },
    draw(c, p) {
      const r = p.w / 2;
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 2);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, p.colors[1]); g.addColorStop(0.6, rgba(p.colors[2], 0.6)); g.addColorStop(1, rgba(p.colors[3], 0));
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, r * 2, 0, Math.PI * 2); c.fill();
      c.restore();
    },
  },
  bubble: {
    stopOnSolid: true,
    update(p) {
      p.vx *= 0.978;
      p.vy = Math.sin(p.age * 0.12) * 0.5 - 0.1;
      if (p.age % 6 === 0) emitElement('water', p.colors, p.x, p.y + p.h / 2, 1, 0.5);
    },
    draw(c, p) {
      const r = p.w / 2 + Math.sin(p.age * 0.3) * 2;
      c.save();
      c.fillStyle = rgba(p.colors[2], 0.25); c.strokeStyle = rgba(p.colors[1], 0.9); c.lineWidth = 2.5;
      c.beginPath(); c.arc(p.x, p.y, r, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,0.8)';
      c.beginPath(); c.arc(p.x - r * 0.35, p.y - r * 0.4, r * 0.18, 0, Math.PI * 2); c.fill();
      c.restore();
    },
  },
  bolt: {
    stopOnSolid: true,
    update(p) { if (p.age % 2 === 0) emitElement('thunder', p.colors, p.x, p.y, 2, 3); },
    draw(c, p) {
      const r = p.w / 2;
      c.save(); c.globalCompositeOperation = 'lighter';
      const g = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 1.8);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.3, p.colors[2]); g.addColorStop(1, rgba(p.colors[3], 0));
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, r * 1.8, 0, Math.PI * 2); c.fill();
      c.strokeStyle = p.colors[1]; c.lineWidth = 2;
      for (let i = 0; i < 3; i++) {                   // crackling arcs around the ball
        c.beginPath(); c.moveTo(p.x, p.y);
        let a = Math.random() * Math.PI * 2;
        for (let k = 1; k <= 3; k++) { a += rand(-0.6, 0.6); c.lineTo(p.x + Math.cos(a) * r * 0.6 * k, p.y + Math.sin(a) * r * 0.6 * k); }
        c.stroke();
      }
      c.restore();
    },
  },
  orb: {   // slowly homes in on the owner's opponent
    update(p) {
      const t = p.owner.opponent;
      if (t && t.state !== 'dead' && t.state !== 'out') {
        const want = Math.atan2(t.y - t.def.height / 2 - p.y, t.x - p.x);
        const cur = Math.atan2(p.vy, p.vx);
        let diff = want - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const a = cur + clamp(diff, -0.04, 0.04);    // turn a little bit each frame
        p.vx = Math.cos(a) * p.data.speed; p.vy = Math.sin(a) * p.data.speed;
      }
      if (p.age % 3 === 0) emitElement('dark', p.colors, p.x, p.y, 1, 0.8);
    },
    draw(c, p) {
      const r = p.w / 2;
      c.save();
      const g = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, r * 1.6);
      g.addColorStop(0, p.colors[3]); g.addColorStop(0.4, p.colors[2]); g.addColorStop(0.8, rgba(p.colors[1], 0.4)); g.addColorStop(1, rgba(p.colors[1], 0));
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, r * 1.6, 0, Math.PI * 2); c.fill();
      c.strokeStyle = rgba(p.colors[0], 0.8); c.lineWidth = 2;
      for (let i = 0; i < 2; i++) {
        c.beginPath(); c.arc(p.x, p.y, r * 0.9, p.age * 0.1 + i * Math.PI, p.age * 0.1 + i * Math.PI + 1.6); c.stroke();
      }
      c.fillStyle = '#000'; c.beginPath(); c.arc(p.x, p.y, r * 0.35, 0, Math.PI * 2); c.fill();
      c.restore();
    },
  },
  flame: {   // Pyro's burning trail: stays in place for a while
    update(p) { if (p.age % 4 === 0) emitElement('fire', p.colors, p.x + rand(-10, 10), p.y + 8, 1, 1); },
    draw(c, p) {
      const k = p.life / p.maxLife;
      c.save(); c.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 3; i++) {
        const fx0 = p.x - 10 + i * 10, fh = (18 + Math.sin(p.age * 0.4 + i * 2) * 6) * k;
        const g = c.createLinearGradient(0, p.y + 14, 0, p.y + 14 - fh * 1.6);
        g.addColorStop(0, rgba(p.colors[2], 0.9)); g.addColorStop(1, rgba(p.colors[0], 0));
        c.fillStyle = g;
        c.beginPath(); c.moveTo(fx0 - 7, p.y + 14);
        c.quadraticCurveTo(fx0 - 4, p.y + 14 - fh, fx0, p.y + 14 - fh * 1.6);
        c.quadraticCurveTo(fx0 + 4, p.y + 14 - fh, fx0 + 7, p.y + 14); c.fill();
      }
      c.restore();
    },
  },
  pit: {     // Umbra's void pit: pulls enemies in, then implodes
    noContact: true,                                  // it doesn't hit by touching
    update(p) {
      p.vx = 0; p.vy = 0;
      const radius = 210;
      for (const f of p.match.fighters) {
        if (f === p.owner || !f.canBeHit() || f.state === 'ledge' || f.state === 'grabbed') continue;
        const dx = p.x - f.x, dy = p.y - (f.y - f.def.height / 2);
        const d = Math.hypot(dx, dy);
        if (d < radius) {
          const pull = 2.2 * (1 - d / radius) + 0.4;
          f.x += Math.sign(dx) * Math.min(Math.abs(dx), pull);
          if (!f.grounded) f.y += Math.sign(dy) * Math.min(Math.abs(dy), pull * 0.6);
          if (p.age % 20 === 0) {                     // small damage over time
            f.percent = Math.min(999, f.percent + 1);
            p.owner.stats.damageDealt += 1;
            f.hudShake = 6;
          }
        }
      }
      if (p.life === 1) {                             // last frame: implode!
        for (const f of p.match.fighters) {
          if (f === p.owner || !f.canBeHit()) continue;
          if (Math.hypot(p.x - f.x, p.y - (f.y - f.def.height / 2)) < 140) {
            p.match.resolveHit(p.owner, f, p, { srcX: p.x, srcY: p.y, projectile: true });
          }
        }
        emitElement('dark', p.colors, p.x, p.y, 40, 7);
        p.match.addEffect({ type: 'ring', x: p.x, y: p.y, r0: 130, r1: 10, life: 14, color: p.palette.glow });
        p.match.shake(6);
        Sound.play('dark');
      }
      if (p.age % 2 === 0) {                          // particles spiral inward
        const a = rand(0, Math.PI * 2), r = rand(80, 180);
        spawnParticle({ x: p.x + Math.cos(a) * r, y: p.y + Math.sin(a) * r * 0.4, vx: -Math.cos(a) * r / 20, vy: -Math.sin(a) * r * 0.4 / 20,
          life: 20, size: rand(3, 6), color: p.colors[Math.floor(rand(0, 4))], shape: 'smoke', drag: 1 });
      }
    },
    draw(c, p) {
      const grow = Math.min(1, p.age / 12);
      const rx = 90 * grow, ry = 26 * grow;
      c.save();
      const g = c.createRadialGradient(p.x, p.y, 1, p.x, p.y, rx);
      g.addColorStop(0, '#000000'); g.addColorStop(0.6, rgba(p.colors[2], 0.85)); g.addColorStop(1, rgba(p.colors[1], 0));
      c.fillStyle = g; c.beginPath(); c.ellipse(p.x, p.y, rx, ry, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = rgba(p.colors[0], 0.7); c.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = -p.age * 0.15 + i * 2.1;
        c.beginPath(); c.ellipse(p.x, p.y, rx * (0.4 + i * 0.2), ry * (0.4 + i * 0.2), 0, a, a + 2); c.stroke();
      }
      c.restore();
    },
  },
};

/* =======================================================================
   10. MATCH CLASS  - one fight from countdown to the final KO
   ======================================================================= */

class Match {
  constructor(sel) {
    this.sel = sel;
    this.stage = STAGES[sel.stage] || STAGES[0];
    const sameFighter = sel.p1 === sel.p2;           // mirror match: P2 gets the alternate colours
    this.fighters = [new Fighter(this, 0, sel.p1, false), new Fighter(this, 1, sel.p2, sameFighter)];
    this.stage.spawns.forEach((s, i) => this.fighters[i].spawnAt(s.x, s.y, i === 0 ? 1 : -1));
    this.projectiles = [];
    this.effects = [];                               // visual-only things: rings, beams, KO blasts
    this.texts = [];                                 // floating damage numbers
    this.cam = { x: 640, y: 380, zoom: 1 };
    this.shakeAmount = 0;
    this.flash = 0;
    this.phase = 'countdown';                        // countdown -> fight -> ending
    this.timer = 0;
    this.fightBanner = 0;
    this.endTimer = 0;
    this.slowAcc = 0;
    this.paused = false;
    this.pauseMenu = new Menu([
      { label: 'RESUME', x: 470, y: 300, w: 340, h: 56, action: () => { this.paused = false; } },
      { label: 'RESTART', x: 470, y: 372, w: 340, h: 56, action: () => Game.setScreen('fight') },
      { label: 'QUIT TO CHARACTER SELECT', x: 470, y: 444, w: 340, h: 56, action: () => Game.setScreen('charSelect') },
    ]);
    particles.length = 0;
    this.updateCamera(true);
  }

  shake(amount) { this.shakeAmount = Math.max(this.shakeAmount, amount); }
  addEffect(e) { e.maxLife = e.life; this.effects.push(e); }
  viewTop() { return this.cam.y - H / 2 / this.cam.zoom; }

  // ------------------------------------------------------------- UPDATE
  update() {
    if (Input.wasPressed('Escape') && this.phase !== 'ending') {
      this.paused = !this.paused;
      this.pauseMenu.index = 0;
      Sound.play('pause');
      return;
    }
    if (this.paused) { this.pauseMenu.update(); return; }

    this.timer++;
    if (this.phase === 'countdown') {
      if (this.timer === 1 || this.timer === 61 || this.timer === 121) Sound.play('beep');
      if (this.timer >= 180) { this.phase = 'fight'; this.fightBanner = 50; Sound.play('go'); }
    }
    if (this.fightBanner > 0) this.fightBanner--;
    if (this.phase === 'ending') {
      this.endTimer++;
      if (this.endTimer >= 170) { this.finish(); return; }
      if (this.endTimer < 80) {                      // dramatic slow motion after the last KO
        this.slowAcc += 0.35;
        if (this.slowAcc < 1) return;
        this.slowAcc -= 1;
      }
    }

    for (const f of this.fighters) f.update();
    this.updateProjectiles();
    this.resolveHits();
    this.pushApart();
    for (const e of this.effects) e.life--;
    this.effects = this.effects.filter(e => e.life > 0);
    for (const t of this.texts) { t.y += t.vy; t.vy *= 0.92; t.life--; }
    this.texts = this.texts.filter(t => t.life > 0);
    updateParticles();
    this.updateCamera(false);
    this.shakeAmount = this.shakeAmount > 0.3 ? this.shakeAmount * 0.85 : 0;
    this.flash *= 0.85;
  }

  // ------------------------------------------------------ HIT DETECTION
  // Check every active hitbox against the other fighter's hurtbox.
  resolveHits() {
    for (const a of this.fighters) {
      if (a.state !== 'attack' || a.hitlag > 0) continue;
      const boxes = a.activeHitboxes();
      if (!boxes.length) continue;
      for (const t of this.fighters) {
        if (t === a || !t.canBeHit()) continue;
        const hurt = t.hurtbox();
        for (const { hb, rect } of boxes) {
          // a move only hits each target once (per hitbox group), unless it has "rehit"
          const key = t.index + ':' + (hb.group || 0);
          const last = a.hitSet.get(key);
          if (last !== undefined && !(hb.rehit && a.moveFrame - last >= hb.rehit)) continue;
          if (!rectsOverlap(rect, hurt)) continue;
          a.hitSet.set(key, a.moveFrame);
          this.resolveHit(a, t, hb, { srcX: a.x, srcY: a.y - a.def.height / 2, dir: a.facing, rect });
          break;
        }
      }
    }
  }

  // Decide what happens when a hit connects: counter, shield, or a real hit.
  resolveHit(a, t, hb, opts = {}) {
    if (t.isCountering()) {
      this.triggerCounter(t, a, hb.dmg || 0);
      if (!opts.projectile) a.hitlag = 16;
      return 'counter';
    }
    if (t.state === 'shield' && hb.effect !== 'grab') { this.shieldHit(a, t, hb, opts); return 'shield'; }
    this.applyHit(a, t, hb, opts);
    return 'hit';
  }

  // Tide's counter: ignore the hit and splash back harder.
  triggerCounter(t, a, dmg) {
    t.counterDmg = Math.max(8, dmg * 1.3);
    t.facing = a.x >= t.x ? 1 : -1;
    t.startMove('dspecialSplash');
    t.invuln = Math.max(t.invuln, 14);
    Sound.play('counter');
    this.addEffect({ type: 'ring', x: t.x, y: t.y - t.def.height / 2, r0: 60, r1: 10, life: 12, color: '#ffffff' });
  }

  shieldHit(a, t, hb, opts) {
    const dmg = hb.dmg || 0;
    t.shieldHP -= dmg * 1.1 + 1;
    t.shieldStun = Math.floor(dmg * 0.5) + 3;
    const dir = t.x >= (opts.srcX !== undefined ? opts.srcX : a.x) ? 1 : -1;
    t.vx = dir * Math.min(7, 1.5 + dmg * 0.35);     // slide back a little
    const lag = Math.min(10, 2 + Math.floor(dmg * 0.3));
    t.hitlag = lag;
    if (!opts.projectile) a.hitlag = lag;
    Sound.play('shieldHit');
    emitElement('light', ['#ffffff', t.palette.glow], t.x - dir * 20, t.y - t.def.height / 2, 8, 4);
    if (t.shieldHP <= 0) t.breakShield();
  }

  // THE CORE OF THE GAME: apply damage and knockback.
  applyHit(a, t, hb, opts = {}) {
    const dmg = hb.counterDmg ? a.counterDmg : (hb.dmg || 0);
    t.percent = Math.min(999, t.percent + dmg);
    if (a !== t) a.stats.damageDealt += dmg;
    t.lastHitBy = a;
    t.hudShake = 14;
    const h = t.def.height;
    // where to show sparks: the middle of the overlap
    let hx = t.x, hy = t.y - h / 2;
    if (opts.rect) { hx = clamp(t.x, opts.rect.x, opts.rect.x + opts.rect.w); hy = clamp(t.y - h / 2, opts.rect.y, opts.rect.y + opts.rect.h); }
    else if (opts.srcX !== undefined) { hx = (t.x + opts.srcX) / 2; hy = (hy + opts.srcY) / 2; }
    if (dmg > 0) this.texts.push({ x: hx, y: hy - 16, vy: -2.4, life: 45, text: (dmg % 1 ? dmg.toFixed(1) : dmg) + '%', color: a.palette.light });

    // special effects that replace knockback
    if (hb.effect === 'grab') {
      t.getGrabbed(a);
      a.grabbing = t;
      a.startMove('sspecialPull');
      Sound.play('dark');
      return;
    }
    if (hb.effect === 'trap') {
      t.getTrapped();
      Sound.play('water');
      emitElement('water', a.palette.fx, t.x, t.y - h / 2, 16, 4);
      return;
    }

    // --- knockback formula ---
    // knockback = base + (percent * scaling * damage / 10) * (100 / (weight + 100))
    const kb = hb.bkb + (t.percent * hb.kbs * dmg / 10) * (100 / (t.def.weight + 100));
    const srcX = opts.srcX !== undefined ? opts.srcX : a.x;
    let dir = opts.dir !== undefined ? opts.dir : a.facing;
    if (hb.radial) dir = t.x >= srcX ? 1 : -1;         // push away from the centre
    const ang = hb.angle * Math.PI / 180;
    let kx = Math.cos(ang) * dir * kb;
    let ky = -Math.sin(ang) * kb;                       // screen y points down, so flip
    if (t.grounded) {
      if (ky > 0) ky = -ky * 0.7;                       // spiked into the floor: bounce up
      if (kb < 4.5) ky = 0;                             // weak hits don't lift you off the ground
    }
    // cancel whatever the target was doing
    t.move = null; t.moveName = ''; t.ledge = null; t.grabbedBy = null;
    if (t.grabbing) t.grabbing = null;
    if (ky < -0.5) { t.grounded = false; t.platform = null; }
    t.kbx = kx; t.kby = ky; t.vx = 0; t.vy = 0;
    t.fastFalling = false;
    t.state = 'hitstun';
    t.hitstun = Math.max(6, Math.round(kb * HITSTUN_MULT));   // hitstun grows with knockback

    // hitlag: both fighters freeze for a moment so hits feel heavy
    const lag = Math.min(16, Math.floor(3 + dmg * 0.45));
    t.hitlag = lag;
    if (!opts.projectile) a.hitlag = lag;

    if (hb.effect === 'slow') t.slowTimer = 150;

    // juice!
    emitElement(a.def.element, a.palette.fx, hx, hy, Math.floor(8 + dmg * 1.5), 3 + kb * 0.25);
    spawnParticle({ x: hx, y: hy, life: 12, size: 8, grow: 20 + kb * 2, color: '#ffffff', shape: 'ring', drag: 1 });
    if (kb > 14) {
      this.shake(kb * 0.5);
      this.addEffect({ type: 'ring', x: hx, y: hy, r0: 10, r1: 60 + kb * 3, life: 14, color: a.palette.glow });
      Sound.play('hitHeavy');
    } else Sound.play('hit');
  }

  // Fighters standing on the ground gently push each other apart.
  pushApart() {
    const [a, b] = this.fighters;
    if (!a.grounded || !b.grounded || a.platform !== b.platform) return;
    if (a.intangible || b.intangible) return;
    const minDist = (a.halfW + b.halfW) * 0.7, dx = b.x - a.x;
    if (Math.abs(dx) < minDist) {
      const push = dx === 0 ? 1 : Math.sign(dx);
      a.x -= push * 1.2; b.x += push * 1.2;
    }
  }

  // --------------------------------------------------------- PROJECTILES
  updateProjectiles() {
    for (const p of this.projectiles) p.update();
    // two projectiles from different players cancel each other out
    for (let i = 0; i < this.projectiles.length; i++) {
      for (let j = i + 1; j < this.projectiles.length; j++) {
        const p = this.projectiles[i], q = this.projectiles[j];
        if (p.dead || q.dead || !p.clash || !q.clash || p.owner === q.owner) continue;
        if (rectsOverlap(p.rect(), q.rect())) { p.burst(); q.burst(); Sound.play('hit'); }
      }
    }
    for (const p of this.projectiles) {
      if (p.dead || PROJECTILE_KINDS[p.kind].noContact) continue;
      for (const t of this.fighters) {
        if (t === p.owner || p.dead) continue;
        const mirror = t.reflectorRect();
        if (mirror && p.reflectable && rectsOverlap(p.rect(), mirror)) { p.reflect(t); break; }
        if (!t.canBeHit() || !rectsOverlap(p.rect(), t.hurtbox())) continue;
        const last = p.hitSet.get(t);
        if (last !== undefined && !(p.rehit && p.age - last >= p.rehit)) continue;
        p.hitSet.set(t, p.age);
        this.resolveHit(p.owner, t, p, { srcX: p.x, srcY: p.y, dir: Math.sign(p.vx) || p.dir, projectile: true });
        if (!p.pierce) p.burst();
      }
    }
    this.projectiles = this.projectiles.filter(p => !p.dead);
  }

  // ------------------------------------------------------------------ KO
  onKO(f) {
    const b = this.stage.blast;
    // where on screen did it happen? (clamped to the screen edge)
    const wx = clamp(f.x, b.left, b.right), wy = clamp(f.y - f.def.height / 2, b.top, b.bottom);
    const sx = clamp((wx - this.cam.x) * this.cam.zoom + W / 2, 30, W - 30);
    const sy = clamp((wy - this.cam.y) * this.cam.zoom + H / 2, 30, H - 30);
    const ang = Math.atan2(H / 2 - sy, W / 2 - sx);   // the blast points back toward the centre
    this.addEffect({ type: 'ko', sx, sy, ang, life: 70, pal: f.palette, screen: true });
    // a burst of particles right at the edge too
    const px = (sx - W / 2) / this.cam.zoom + this.cam.x, py = (sy - H / 2) / this.cam.zoom + this.cam.y;
    emitElement(f.def.element, f.palette.fx, px, py, 70, 14, { angle: ang, spread: 0.9, lifeMul: 1.6, sizeMul: 1.5 });
    this.shake(20);
    this.flash = 0.25;
    Sound.play('ko');

    f.stocks--;
    f.stats.falls++;
    const killer = f.lastHitBy;
    if (killer && killer !== f) killer.stats.kos++;
    if (f.grabbing) f.grabbing = null;
    for (const p of this.projectiles) if (p.owner === f && p.kind === 'pit') p.dead = true;
    f.move = null; f.ledge = null;
    f.vx = f.vy = f.kbx = f.kby = 0;
    f.state = f.stocks > 0 ? 'dead' : 'out';
    f.stateTimer = 70;                               // wait a moment before respawning
    if (f.stocks <= 0 && this.phase !== 'ending') { this.phase = 'ending'; this.endTimer = 0; }
  }

  finish() {
    const alive = this.fighters.filter(f => f.stocks > 0);
    Game.lastResult = {
      winner: alive.length === 1 ? alive[0].index : -1,
      players: this.fighters.map(f => ({ id: f.id, palette: f.palette, name: f.def.name, stats: Object.assign({}, f.stats), stocks: f.stocks })),
    };
    Game.setScreen('results');
  }

  // --------------------------------------------------------------- CAMERA
  // Zoom and pan so both fighters always fit on screen.
  updateCamera(snap) {
    const live = this.fighters.filter(f => f.state !== 'dead' && f.state !== 'out');
    let minX = 440, maxX = 840, minY = 300, maxY = 520;         // always keep some of the stage in view
    for (const f of live) {
      minX = Math.min(minX, f.x); maxX = Math.max(maxX, f.x);
      minY = Math.min(minY, f.y - f.def.height); maxY = Math.max(maxY, f.y);
    }
    const bw = maxX - minX + 480, bh = maxY - minY + 420;
    const zoom = clamp(Math.min(W / bw, H / bh), 0.6, 1.25);
    let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2 + 50 / zoom;   // nudge down: the HUD covers the bottom
    const b = this.stage.blast, hw = W / 2 / zoom, hh = H / 2 / zoom;
    cx = b.right - b.left > hw * 2 ? clamp(cx, b.left + hw, b.right - hw) : (b.left + b.right) / 2;
    cy = b.bottom - b.top > hh * 2 ? clamp(cy, b.top + hh, b.bottom - hh) : (b.top + b.bottom) / 2;
    if (snap) { this.cam.x = cx; this.cam.y = cy; this.cam.zoom = zoom; }
    else {
      this.cam.x = lerp(this.cam.x, cx, 0.08);
      this.cam.y = lerp(this.cam.y, cy, 0.08);
      this.cam.zoom = lerp(this.cam.zoom, zoom, 0.05);
    }
  }

  // ------------------------------------------------------------- DRAWING
  draw(c) {
    const cam = this.cam;
    this.stage.drawBackground(c, cam, this.timer);

    c.save();                                         // world space starts here
    const sx = rand(-1, 1) * this.shakeAmount, sy = rand(-1, 1) * this.shakeAmount;
    c.translate(W / 2 + sx, H / 2 + sy);
    c.scale(cam.zoom, cam.zoom);
    c.translate(-cam.x, -cam.y);
    this.stage.drawStage(c, this.timer);
    for (const p of this.projectiles) if (p.kind === 'pit') p.draw(c);
    for (const e of this.effects) if (!e.screen && e.type === 'geyser') this.drawEffect(c, e);
    for (const f of this.fighters) f.draw(c);
    for (const p of this.projectiles) if (p.kind !== 'pit') p.draw(c);
    for (const e of this.effects) if (!e.screen && e.type !== 'geyser') this.drawEffect(c, e);
    drawParticles(c);
    for (const t of this.texts) {                     // floating damage numbers
      c.globalAlpha = Math.min(1, t.life / 15);
      const pop = 1 + Math.max(0, (t.life - 38) / 7) * 0.6;
      drawText(c, t.text, t.x, t.y, { size: Math.round(22 * pop), color: t.color, stroke: 4, strokeColor: '#1a0b2a', font: TITLE_FONT, weight: 'normal' });
    }
    c.globalAlpha = 1;
    if (DEBUG) this.drawDebug(c);
    c.restore();                                      // back to screen space

    for (const e of this.effects) if (e.screen) this.drawEffect(c, e);
    this.drawOffscreenIndicators(c);
    this.drawHUD(c);

    if (this.phase === 'countdown') {
      const n = 3 - Math.floor((this.timer - 1) / 60);
      const k = ((this.timer - 1) % 60) / 60;
      if (n >= 1) drawText(c, String(n), W / 2, H / 2 - 40, { size: Math.round(160 * (1.4 - k * 0.4)), font: TITLE_FONT, weight: 'normal',
        color: '#ffe27a', stroke: 10, strokeColor: '#2a0f40' });
    }
    if (this.fightBanner > 0) {
      c.globalAlpha = Math.min(1, this.fightBanner / 15);
      drawText(c, 'FIGHT!', W / 2, H / 2 - 40, { size: Math.round(150 + (50 - this.fightBanner) * 0.8), font: TITLE_FONT, weight: 'normal',
        color: '#ff7b3a', stroke: 10, strokeColor: '#2a0f40' });
      c.globalAlpha = 1;
    }
    if (this.phase === 'ending' && this.endTimer > 20) {
      c.globalAlpha = Math.min(1, (this.endTimer - 20) / 20);
      drawText(c, 'GAME!', W / 2, H / 2 - 40, { size: 150, font: TITLE_FONT, weight: 'normal', color: '#ffffff', stroke: 10, strokeColor: '#2a0f40' });
      c.globalAlpha = 1;
    }
    if (this.flash > 0.02) { c.fillStyle = 'rgba(255,255,255,' + this.flash + ')'; c.fillRect(0, 0, W, H); }
    if (this.paused) this.drawPause(c);
  }

  drawEffect(c, e) {
    const k = e.life / e.maxLife;                     // 1 at start, 0 at the end
    c.save();
    c.globalCompositeOperation = 'lighter';
    switch (e.type) {
      case 'ring':
        c.strokeStyle = rgba(e.color, k); c.lineWidth = 6 * k + 1;
        c.beginPath(); c.arc(e.x, e.y, Math.max(1, lerp(e.r0, e.r1, 1 - k)), 0, Math.PI * 2); c.stroke();
        break;
      case 'beam': {                                  // Lumen's laser
        const o = e.owner, y = o.y - 60, x0 = o.x + o.facing * 30, x1 = x0 + o.facing * 640;
        const w = 30 * k + 4;
        c.lineCap = 'round';
        c.strokeStyle = rgba(e.color, 0.45); c.lineWidth = w * 2;
        c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
        c.strokeStyle = rgba(e.color2, 0.9); c.lineWidth = w;
        c.stroke();
        c.strokeStyle = '#ffffff'; c.lineWidth = w * 0.35; c.stroke();
        break;
      }
      case 'bolt': case 'zap': {                      // jagged lightning
        const x1 = e.type === 'bolt' ? e.x : e.x1, y1 = e.type === 'bolt' ? e.y1 : e.y1;
        const x2 = e.type === 'bolt' ? e.x : e.x2, y2 = e.type === 'bolt' ? e.y2 : e.y2;
        const segs = e.type === 'bolt' ? 14 : 4;
        const pts = [];
        for (let i = 0; i <= segs; i++) {
          const t = i / segs, off = i === 0 || i === segs ? 0 : rand(-1, 1) * (e.type === 'bolt' ? 26 : 10);
          pts.push([lerp(x1, x2, t) + (e.type === 'bolt' ? off : 0), lerp(y1, y2, t) + (e.type === 'bolt' ? 0 : off)]);
        }
        const path = () => { c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (const p of pts) c.lineTo(p[0], p[1]); };
        c.lineJoin = 'round';
        path(); c.strokeStyle = rgba(e.color, 0.6 * k); c.lineWidth = (e.type === 'bolt' ? 22 : 10) * k + 2; c.stroke();
        path(); c.strokeStyle = rgba(e.color2, k); c.lineWidth = (e.type === 'bolt' ? 8 : 4) * k + 1; c.stroke();
        break;
      }
      case 'geyser': {                                // Tide's water column
        const hgt = 260 * Math.min(1, (1 - k) * 3);
        const g = c.createLinearGradient(0, e.y, 0, e.y - hgt);
        g.addColorStop(0, rgba(e.color, 0.7 * k)); g.addColorStop(1, rgba(e.color2, 0));
        c.fillStyle = g;
        c.fillRect(e.x - 26 - (1 - k) * 10, e.y - hgt, 52 + (1 - k) * 20, hgt);
        break;
      }
      case 'ko': {                                    // the big KO blast at the screen edge
        const grow = Math.min(1, (1 - k) * 4);
        const colors = [e.pal.glow, e.pal.light, e.pal.body, '#ffffff'];
        for (let i = 0; i < 7; i++) {
          const a = e.ang + (i - 3) * 0.16;
          const len = (500 + (i % 3) * 180) * grow, wid = (i === 3 ? 120 : 60) * k;
          const px = -Math.sin(a), py = Math.cos(a);
          const g = c.createLinearGradient(e.sx, e.sy, e.sx + Math.cos(a) * len, e.sy + Math.sin(a) * len);
          g.addColorStop(0, rgba(colors[i % 4], 0.95 * k)); g.addColorStop(1, rgba(colors[i % 4], 0));
          c.fillStyle = g;
          c.beginPath();
          c.moveTo(e.sx + px * wid, e.sy + py * wid);
          c.lineTo(e.sx + Math.cos(a) * len, e.sy + Math.sin(a) * len);
          c.lineTo(e.sx - px * wid, e.sy - py * wid);
          c.closePath(); c.fill();
        }
        const rg = c.createRadialGradient(e.sx, e.sy, 0, e.sx, e.sy, 160 * k + 20);
        rg.addColorStop(0, rgba('#ffffff', k)); rg.addColorStop(0.4, rgba(e.pal.glow, 0.8 * k)); rg.addColorStop(1, rgba(e.pal.glow, 0));
        c.fillStyle = rg; c.beginPath(); c.arc(e.sx, e.sy, 160 * k + 20, 0, Math.PI * 2); c.fill();
        c.strokeStyle = rgba(e.pal.light, k); c.lineWidth = 8 * k;
        c.beginPath(); c.arc(e.sx, e.sy, 40 + (1 - k) * 260, 0, Math.PI * 2); c.stroke();
        break;
      }
    }
    c.restore();
  }

  // Bubbles at the screen edge showing where an off-screen fighter is.
  drawOffscreenIndicators(c) {
    for (const f of this.fighters) {
      if (['dead', 'out'].includes(f.state)) continue;
      const sx = (f.x - this.cam.x) * this.cam.zoom + W / 2;
      const sy = (f.y - f.def.height / 2 - this.cam.y) * this.cam.zoom + H / 2;
      if (sx > 0 && sx < W && sy > 0 && sy < H) continue;
      const bx = clamp(sx, 50, W - 50), by = clamp(sy, 50, H - 170);
      const a = Math.atan2(sy - by, sx - bx);
      c.fillStyle = PLAYER_COLORS[f.index];
      c.beginPath();
      c.moveTo(bx + Math.cos(a) * 44, by + Math.sin(a) * 44);
      c.lineTo(bx + Math.cos(a + 0.5) * 30, by + Math.sin(a + 0.5) * 30);
      c.lineTo(bx + Math.cos(a - 0.5) * 30, by + Math.sin(a - 0.5) * 30);
      c.closePath(); c.fill();
      c.beginPath(); c.arc(bx, by, 32, 0, Math.PI * 2); c.fill();
      drawPortrait(c, f.id, f.palette, bx - 28, by - 28, 56, 56, f.animTime, { circle: true });
    }
  }

  drawHUD(c) {
    this.fighters.forEach((f, i) => {
      const cx = i === 0 ? 400 : 880, top = 606;
      const col = PLAYER_COLORS[i];
      c.save();
      roundRect(c, cx - 160, top, 320, 100, 16);
      c.fillStyle = 'rgba(12,8,28,0.78)'; c.fill();
      c.lineWidth = 3; c.strokeStyle = col; c.stroke();
      drawPortrait(c, f.id, f.palette, cx - 150, top + 12, 76, 76, this.timer, { circle: true });
      c.beginPath(); c.arc(cx - 112, top + 50, 38, 0, Math.PI * 2); c.lineWidth = 3; c.strokeStyle = col; c.stroke();
      drawText(c, 'P' + (i + 1), cx - 140, top + 12, { size: 14, color: col, stroke: 3 });
      drawText(c, f.def.name, cx - 64, top + 26, { size: 20, align: 'left', color: '#ffffff' });
      // stock icons
      for (let s = 0; s < START_STOCKS; s++) {
        const x = cx - 54 + s * 24, y = top + 74;
        c.beginPath(); c.arc(x, y, 8, 0, Math.PI * 2);
        if (s < f.stocks) { c.fillStyle = f.palette.body; c.fill(); c.strokeStyle = f.palette.light; c.lineWidth = 2; c.stroke(); }
        else { c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 2; c.stroke(); }
      }
      // damage % (shakes when hit, colour goes white -> yellow -> orange -> red)
      if (f.state === 'out') {
        drawText(c, 'OUT', cx + 92, top + 54, { size: 40, color: '#777', font: TITLE_FONT, weight: 'normal' });
      } else {
        const sh = f.hudShake > 0 ? rand(-1, 1) * f.hudShake * 0.4 : 0;
        const pct = Math.floor(f.percent);
        drawText(c, String(pct), cx + 112 + sh, top + 56 + sh, { size: 54, align: 'right', color: damageColor(f.percent),
          font: TITLE_FONT, weight: 'normal', stroke: 6, strokeColor: '#1a0b2a' });
        drawText(c, '%', cx + 136 + sh, top + 66 + sh, { size: 26, color: damageColor(f.percent), font: TITLE_FONT, weight: 'normal', stroke: 4, strokeColor: '#1a0b2a' });
      }
      c.restore();
    });
  }

  drawPause(c) {
    c.fillStyle = 'rgba(5,3,15,0.7)'; c.fillRect(0, 0, W, H);
    drawText(c, 'PAUSED', W / 2, 220, { size: 80, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    this.pauseMenu.draw(c);
    drawText(c, 'Esc to resume  ·  W/S or ↑/↓ to choose  ·  Enter / F / K to select', W / 2, 545, { size: 16, weight: 'normal', color: '#c9bde6' });
  }

  drawDebug(c) {
    const b = this.stage.blast;
    c.save();
    c.setLineDash([12, 8]); c.strokeStyle = '#ff3b3b'; c.lineWidth = 3;
    c.strokeRect(b.left, b.top, b.right - b.left, b.bottom - b.top);
    c.setLineDash([]);
    c.lineWidth = 2;
    for (const p of this.stage.platforms) { c.strokeStyle = p.solid ? '#3bff6e' : '#3bd5ff'; c.strokeRect(p.x, p.y, p.w, p.h); }
    for (const L of this.stage.ledges) { c.fillStyle = '#ffe23b'; c.fillRect(L.x - 4, L.y - 4, 8, 8); }
    for (const f of this.fighters) {
      if (['dead', 'out'].includes(f.state)) continue;
      const hb = f.hurtbox();
      c.fillStyle = f.intangible || f.invuln > 0 ? 'rgba(255,255,255,0.25)' : 'rgba(60,140,255,0.3)';
      c.fillRect(hb.x, hb.y, hb.w, hb.h);
      c.strokeStyle = f.intangible || f.invuln > 0 ? '#ffffff' : '#3c8cff'; c.strokeRect(hb.x, hb.y, hb.w, hb.h);
      for (const { rect } of f.activeHitboxes()) {
        c.fillStyle = 'rgba(255,40,40,0.4)'; c.fillRect(rect.x, rect.y, rect.w, rect.h);
        c.strokeStyle = '#ff2828'; c.strokeRect(rect.x, rect.y, rect.w, rect.h);
      }
      const m = f.reflectorRect();
      if (m) { c.strokeStyle = '#ffd700'; c.strokeRect(m.x, m.y, m.w, m.h); }
      const label = f.state + (f.moveName ? ':' + f.moveName + ' f' + f.moveFrame : '') + (f.hitstun > 0 && f.state === 'hitstun' ? ' hs' + f.hitstun : '');
      drawText(c, label, f.x, f.y + 16, { size: 12, color: '#ffffff', stroke: 3, weight: 'normal' });
    }
    for (const p of this.projectiles) {
      const r = p.rect();
      c.strokeStyle = '#ff9a2e'; c.strokeRect(r.x, r.y, r.w, r.h);
    }
    c.restore();
  }
}

// Damage % colour: white at 0%, yellow, orange, then red at high damage.
const DMG_STOPS = [[0, [255, 255, 255]], [35, [255, 238, 90]], [80, [255, 150, 30]], [130, [255, 45, 35]], [200, [170, 0, 20]]];
function damageColor(p) {
  for (let i = 1; i < DMG_STOPS.length; i++) {
    const [p1, c1] = DMG_STOPS[i];
    const [p0, c0] = DMG_STOPS[i - 1];
    if (p <= p1) {
      const t = (p - p0) / (p1 - p0);
      return 'rgb(' + Math.round(lerp(c0[0], c1[0], t)) + ',' + Math.round(lerp(c0[1], c1[1], t)) + ',' + Math.round(lerp(c0[2], c1[2], t)) + ')';
    }
  }
  return 'rgb(170,0,20)';
}


/* =======================================================================
   11. UI & SCREENS
   ======================================================================= */

// A menu of buttons that works with both the keyboard and the mouse.
class Menu {
  constructor(items, opts = {}) {
    this.items = items;                  // [{ label, x, y, w, h, action }]
    this.index = 0;
    this.horizontal = !!opts.horizontal;
  }
  update() {
    const n = this.items.length;
    const prev = this.horizontal ? menuPressed('left') : menuPressed('up');
    const next = this.horizontal ? menuPressed('right') : menuPressed('down');
    if (prev) { this.index = (this.index - 1 + n) % n; Sound.play('menuMove'); }
    if (next) { this.index = (this.index + 1) % n; Sound.play('menuMove'); }
    for (let i = 0; i < n; i++) {
      if (!pointInRect(Mouse, this.items[i])) continue;
      if (Mouse.moved && this.index !== i) { this.index = i; Sound.play('menuMove'); }
      if (Mouse.clicked) { this.index = i; this.activate(); return; }
    }
    if (menuPressed('confirm')) this.activate();
  }
  activate() { Sound.play('menuSelect'); this.items[this.index].action(); }
  draw(c) { this.items.forEach((it, i) => drawButton(c, it, i === this.index)); }
}

function drawButton(c, b, selected) {
  c.save();
  roundRect(c, b.x, b.y, b.w, b.h, 14);
  const g = c.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  g.addColorStop(0, selected ? '#ffb347' : '#3a2f5c');
  g.addColorStop(1, selected ? '#ff5e3a' : '#221a3a');
  c.fillStyle = g; c.fill();
  if (selected) { c.shadowColor = '#ffb347'; c.shadowBlur = 18 + Math.sin(Game.time * 0.15) * 8; }
  c.lineWidth = 3; c.strokeStyle = selected ? '#ffffff' : 'rgba(255,255,255,0.25)'; c.stroke();
  c.shadowBlur = 0;
  drawText(c, b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, { size: b.size || 24, color: selected ? '#2a0f1a' : '#e8e0ff' });
  c.restore();
}

// The mute button lives in the top-right corner of every screen.
const MUTE_BUTTON = { x: 1222, y: 14, w: 44, h: 44 };
function drawMuteButton(c) {
  const b = MUTE_BUTTON, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const hover = pointInRect(Mouse, b);
  c.save();
  c.fillStyle = hover ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.45)';
  c.beginPath(); c.arc(cx, cy, 22, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#ffffff';
  c.beginPath();                                     // speaker shape
  c.moveTo(cx - 11, cy - 5); c.lineTo(cx - 5, cy - 5); c.lineTo(cx + 2, cy - 11);
  c.lineTo(cx + 2, cy + 11); c.lineTo(cx - 5, cy + 5); c.lineTo(cx - 11, cy + 5);
  c.closePath(); c.fill();
  c.strokeStyle = '#ffffff'; c.lineWidth = 2.5; c.lineCap = 'round';
  if (Sound.muted) {
    c.strokeStyle = '#ff5b5b';
    c.beginPath(); c.moveTo(cx + 6, cy - 6); c.lineTo(cx + 14, cy + 6); c.moveTo(cx + 14, cy - 6); c.lineTo(cx + 6, cy + 6); c.stroke();
  } else {
    c.beginPath(); c.arc(cx + 3, cy, 6, -0.9, 0.9); c.stroke();
    c.beginPath(); c.arc(cx + 3, cy, 11, -0.9, 0.9); c.stroke();
  }
  c.restore();
}

// Shared animated background for the menu screens.
function updateMenuParticles() {
  if (Game.time % 2 === 0) {
    const el = ELEMENT_LIST[Math.floor(Math.random() * 5)];
    emitElement(el, ELEMENT_COLORS[el], rand(0, W), H + 10, 1, 1.2, { angle: -Math.PI / 2, spread: 0.4, vy: -1.4, lifeMul: 5, sizeMul: 1.4 });
  }
  updateParticles();
}
function drawMenuBackground(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0620'); g.addColorStop(0.6, '#1f0d3a'); g.addColorStop(1, '#3d1446');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // slowly rotating rings of elemental light
  c.save(); c.globalCompositeOperation = 'lighter';
  ELEMENT_LIST.forEach((el, i) => {
    const a = Game.time * 0.003 + i * (Math.PI * 2 / 5);
    const x = W / 2 + Math.cos(a) * 420, y = H / 2 + Math.sin(a) * 220;
    const rg = c.createRadialGradient(x, y, 0, x, y, 260);
    rg.addColorStop(0, rgba(ELEMENT_COLORS[el][2], 0.18)); rg.addColorStop(1, rgba(ELEMENT_COLORS[el][2], 0));
    c.fillStyle = rg; c.fillRect(x - 260, y - 260, 520, 520);
  });
  c.restore();
  drawParticles(c);
}

function drawTitle(c, y, size) {
  const t = Game.time;
  c.save();
  c.font = 'normal ' + size + 'px ' + TITLE_FONT;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const text = 'ELEMENTAL CLASH';
  const w = c.measureText(text).width;
  const off = Math.sin(t * 0.01) * 120;
  const g = c.createLinearGradient(W / 2 - w / 2 + off, 0, W / 2 + w / 2 + off, 0);
  ['#ff7b00', '#3fd8ff', '#ffd60a', '#fff2b0', '#b44dff'].forEach((col, i) => g.addColorStop(i / 4, col));
  c.lineJoin = 'round';
  c.lineWidth = 14; c.strokeStyle = '#140826'; c.strokeText(text, W / 2, y);
  c.shadowColor = '#ffb347'; c.shadowBlur = 30 + Math.sin(t * 0.05) * 10;
  c.fillStyle = g; c.fillText(text, W / 2, y);
  c.shadowBlur = 0;
  c.restore();
}

// Grid slots 0-4 are fighters, slot 5 is the BACK tile.
const CS = { boxW: 150, boxH: 150, gap: 20, top: 104 };
CS.left = W / 2 - (FIGHTER_ORDER.length * CS.boxW + (FIGHTER_ORDER.length - 1) * CS.gap) / 2;
const BACK_SLOT = FIGHTER_ORDER.length;
const backTileRect = () => ({ x: 40, y: 30, w: 130, h: 46 });
const slotRect = i => ({ x: CS.left + i * (CS.boxW + CS.gap), y: CS.top, w: CS.boxW, h: CS.boxH });
const readyRect = { x: 340, y: 470, w: 600, h: 90 };

SCREENS.charSelect = {
  enter() {
    this.cursor = [Math.max(0, FIGHTER_ORDER.indexOf(Game.sel.p1)), Math.max(0, FIGHTER_ORDER.indexOf(Game.sel.p2))];
    this.lastCol = this.cursor.slice();
    this.locked = [false, false];
    this.readyTimer = 0;
  },
  // Which fighter is player p looking at (Back tile shows the last fighter)?
  hovered(p) { return FIGHTER_ORDER[this.cursor[p] === BACK_SLOT ? this.lastCol[p] : this.cursor[p]]; },
  paletteFor(p) {
    const def = FIGHTERS[this.hovered(p)];
    return p === 1 && this.hovered(0) === this.hovered(1) ? def.altColors : def.colors;
  },
  goBack() { Sound.play('back'); Game.setScreen('home'); },
  lock(p) {
    this.locked[p] = true;
    Sound.play('lock');
    const def = FIGHTERS[this.hovered(p)];
    const r = slotRect(this.cursor[p]);
    emitElement(def.element, def.colors.fx, r.x + r.w / 2, r.y + r.h / 2, 40, 7);
  },
  update() {
    updateMenuParticles();
    if (Input.wasPressed('Escape')) { this.goBack(); return; }
    const n = FIGHTER_ORDER.length;
    for (let p = 0; p < 2; p++) {
      const k = CONTROLS[p];
      if (this.locked[p]) {
        if (Input.wasPressed(k.special)) { this.locked[p] = false; this.readyTimer = 0; Sound.play('back'); }
        continue;
      }
      const cur = this.cursor[p];
      if (cur !== BACK_SLOT) {
        if (Input.wasPressed(k.left)) { this.cursor[p] = (cur - 1 + n) % n; Sound.play('menuMove'); }
        if (Input.wasPressed(k.right)) { this.cursor[p] = (cur + 1) % n; Sound.play('menuMove'); }
        if (Input.wasPressed(k.up)) { this.lastCol[p] = this.cursor[p]; this.cursor[p] = BACK_SLOT; Sound.play('menuMove'); }
      } else if (Input.wasPressed(k.down) || Input.wasPressed(k.left) || Input.wasPressed(k.right)) {
        this.cursor[p] = this.lastCol[p]; Sound.play('menuMove');
      }
      if (this.cursor[p] !== BACK_SLOT) this.lastCol[p] = this.cursor[p];
      if (Input.wasPressed(k.attack)) {
        if (this.cursor[p] === BACK_SLOT) { this.goBack(); return; }
        this.lock(p);
      }
    }
    // mouse: click a portrait to lock in the first player who hasn't chosen yet
    if (Mouse.clicked) {
      if (pointInRect(Mouse, backTileRect())) { this.goBack(); return; }
      for (let i = 0; i < n; i++) {
        if (!pointInRect(Mouse, slotRect(i))) continue;
        const p = !this.locked[0] ? 0 : !this.locked[1] ? 1 : -1;
        if (p >= 0) { this.cursor[p] = i; this.lastCol[p] = i; this.lock(p); }
      }
    }
    if (this.locked[0] && this.locked[1]) {
      this.readyTimer++;
      const go = this.readyTimer > 10 && (Input.anyPressed(['Enter', 'NumpadEnter', 'Space', 'KeyF', 'KeyK']) || (Mouse.clicked && pointInRect(Mouse, readyRect)));
      if (go) {
        Game.sel.p1 = this.hovered(0);
        Game.sel.p2 = this.hovered(1);
        Sound.play('menuSelect');
        Game.setScreen('stageSelect');
      }
    }
  },
  draw(c) {
    drawMenuBackground(c);
    drawText(c, 'CHOOSE YOUR FIGHTERS', W / 2, 60, { size: 54, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    // back tile
    const br = backTileRect();
    const backHover = this.cursor.includes(BACK_SLOT) || pointInRect(Mouse, br);
    drawButton(c, Object.assign({ label: '◀ BACK', size: 20 }, br), backHover);
    if (this.cursor[0] === BACK_SLOT) drawText(c, 'P1', br.x + br.w + 18, br.y + 14, { size: 14, color: PLAYER_COLORS[0], stroke: 3 });
    if (this.cursor[1] === BACK_SLOT) drawText(c, 'P2', br.x + br.w + 18, br.y + 34, { size: 14, color: PLAYER_COLORS[1], stroke: 3 });

    // the grid of portraits
    FIGHTER_ORDER.forEach((id, i) => {
      const r = slotRect(i), def = FIGHTERS[id];
      const hover = pointInRect(Mouse, r);
      drawPortrait(c, id, def.colors, r.x, r.y, r.w, r.h, Game.time + i * 17);
      c.save();
      roundRect(c, r.x, r.y, r.w, r.h, 12);
      c.lineWidth = hover ? 4 : 2; c.strokeStyle = hover ? '#ffffff' : 'rgba(255,255,255,0.3)'; c.stroke();
      c.restore();
      c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(r.x + 4, r.y + r.h - 30, r.w - 8, 26);
      drawText(c, def.name, r.x + r.w / 2, r.y + r.h - 17, { size: 18, color: def.colors.light });
    });
    // the two player cursors
    for (let p = 0; p < 2; p++) {
      if (this.cursor[p] === BACK_SLOT) continue;
      const r = slotRect(this.cursor[p]), inset = p === 0 ? -6 : 3, col = PLAYER_COLORS[p];
      c.save();
      roundRect(c, r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2, 14);
      c.lineWidth = 5; c.strokeStyle = col;
      c.shadowColor = col; c.shadowBlur = 14 + Math.sin(Game.time * 0.2) * 6;
      c.stroke();
      c.restore();
      const tagX = p === 0 ? r.x + 4 : r.x + r.w - 40;
      roundRect(c, tagX, r.y - 16, 36, 24, 6); c.fillStyle = col; c.fill();
      drawText(c, 'P' + (p + 1), tagX + 18, r.y - 4, { size: 15, color: '#fff' });
      if (this.locked[p]) {
        c.fillStyle = rgba(col, 0.82);
        c.fillRect(r.x + 4, r.y + (p === 0 ? 46 : 82), r.w - 8, 28);
        drawText(c, 'P' + (p + 1) + ' READY', r.x + r.w / 2, r.y + (p === 0 ? 60 : 96), { size: 16, color: '#fff' });
      }
    }
    // the two preview panels
    for (let p = 0; p < 2; p++) this.drawPanel(c, p, p === 0 ? 30 : 650, 290);

    drawText(c, 'P1: A/D choose · F lock in · G cancel        P2: ←/→ choose · K lock in · L cancel        W / ↑ = Back  ·  Esc = Home',
      W / 2, 704, { size: 15, weight: 'normal', color: '#b7a8dc' });

    if (this.locked[0] && this.locked[1]) {           // both ready: big banner
      const r = readyRect;
      c.save();
      roundRect(c, r.x, r.y, r.w, r.h, 18);
      const g = c.createLinearGradient(r.x, 0, r.x + r.w, 0);
      g.addColorStop(0, PLAYER_COLORS[0]); g.addColorStop(1, PLAYER_COLORS[1]);
      c.fillStyle = g; c.shadowColor = '#fff'; c.shadowBlur = 20 + Math.sin(Game.time * 0.15) * 10; c.fill();
      c.restore();
      drawText(c, 'READY TO FIGHT!', W / 2, r.y + 34, { size: 40, font: TITLE_FONT, weight: 'normal', color: '#fff', stroke: 6, strokeColor: '#2a0f40' });
      drawText(c, 'Press F / K / Enter (or click) to continue', W / 2, r.y + 70, { size: 18, color: '#fff' });
    }
  },
  drawPanel(c, p, x, y) {
    const id = this.hovered(p), def = FIGHTERS[id], pal = this.paletteFor(p), col = PLAYER_COLORS[p];
    const w = 600, h = 400;
    c.save();
    roundRect(c, x, y, w, h, 18);
    const g = c.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, rgba(pal.glow, 0.28)); g.addColorStop(1, 'rgba(10,6,25,0.85)');
    c.fillStyle = g; c.fill();
    c.lineWidth = 3; c.strokeStyle = col; c.stroke();
    c.restore();
    drawText(c, 'PLAYER ' + (p + 1), x + 20, y + 24, { size: 16, align: 'left', color: col });
    // the fighter, animated (victory pose once locked in)
    const t = Game.time + p * 40;
    const pose = this.locked[p] ? POSES.victory(t) : POSES.idle(t);
    drawFighter(c, def, pal, x + 130, y + 340, 1, pose, { scale: 2.3, time: t, auraBoost: this.locked[p] ? 0.15 : 0 });
    if (this.locked[p] && Game.time % 3 === 0) emitElement(def.element, pal.fx, x + 130 + rand(-60, 60), y + 340 - rand(0, 200), 1, 1.5);
    // name, element and description
    drawText(c, def.name, x + 260, y + 70, { size: 52, align: 'left', font: TITLE_FONT, weight: 'normal', color: pal.light, stroke: 6, strokeColor: '#140826' });
    c.font = 'bold 16px ' + FONT;
    const tag = def.elementName.toUpperCase() + ' ELEMENT';
    const tw = c.measureText(tag).width + 24;
    roundRect(c, x + 262, y + 98, tw, 26, 13); c.fillStyle = pal.glow; c.fill();
    drawText(c, tag, x + 262 + tw / 2, y + 112, { size: 16, color: '#1a0b2a' });
    c.font = 'normal 17px ' + FONT;
    wrapText(c, def.desc, 310).forEach((line, i) => drawText(c, line, x + 262, y + 152 + i * 22, { size: 17, align: 'left', weight: 'normal', color: '#e8e0ff' }));
    // stat bars
    const statNames = [['SPEED', 'speed'], ['POWER', 'power'], ['WEIGHT', 'weight'], ['JUMP', 'jump']];
    statNames.forEach(([label, key], i) => {
      const sy = y + 240 + i * 34;
      drawText(c, label, x + 262, sy, { size: 15, align: 'left', color: '#b7a8dc' });
      for (let s = 0; s < 10; s++) {
        const filled = s < def.stats[key];
        c.fillStyle = filled ? pal.glow : 'rgba(255,255,255,0.12)';
        roundRect(c, x + 350 + s * 22, sy - 8, 18, 16, 4); c.fill();
      }
    });
    if (this.locked[p]) drawText(c, 'LOCKED IN!', x + w - 20, y + 24, { size: 18, align: 'right', color: '#7dff9a' });
  },
};

// ---------------------------------------------------------- STAGE SELECT
// Cards are built from STAGES, so new stages show up automatically.
SCREENS.stageSelect = {
  enter() {
    this.index = clamp(Game.sel.stage || 0, 0, STAGES.length - 1);
    const cardW = 440, gap = 40, total = STAGES.length * cardW + (STAGES.length - 1) * gap;
    this.cards = STAGES.map((s, i) => ({ x: W / 2 - total / 2 + i * (cardW + gap), y: 150, w: cardW, h: 260 }));
    this.backBtn = { label: '◀ BACK', x: 540, y: 620, w: 200, h: 56 };
  },
  start() { Game.sel.stage = this.index; Sound.play('menuSelect'); Game.setScreen('fight'); },
  back() { Sound.play('back'); Game.setScreen('charSelect'); },
  update() {
    updateMenuParticles();
    if (menuPressed('back')) { this.back(); return; }
    const n = STAGES.length;                        // index n = the Back button
    if (menuPressed('left') && this.index < n) { this.index = (this.index - 1 + n) % n; Sound.play('menuMove'); }
    if (menuPressed('right') && this.index < n) { this.index = (this.index + 1) % n; Sound.play('menuMove'); }
    if (menuPressed('down') && this.index < n) { this.lastIndex = this.index; this.index = n; Sound.play('menuMove'); }
    if (menuPressed('up') && this.index === n) { this.index = this.lastIndex || 0; Sound.play('menuMove'); }
    this.cards.forEach((r, i) => {
      if (!pointInRect(Mouse, r)) return;
      if (Mouse.moved) this.index = i;
      if (Mouse.clicked) { this.index = i; this.start(); }
    });
    if (Game.screen !== 'stageSelect') return;
    if (pointInRect(Mouse, this.backBtn)) { if (Mouse.moved) this.index = n; if (Mouse.clicked) { this.back(); return; } }
    if (menuPressed('confirm')) { if (this.index === n) this.back(); else this.start(); }
  },
  draw(c) {
    drawMenuBackground(c);
    drawText(c, 'SELECT A STAGE', W / 2, 70, { size: 58, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    STAGES.forEach((s, i) => {
      const r = this.cards[i], sel = i === this.index;
      renderStageView(c, s, r.x, r.y, r.w, r.h, Game.time);
      c.save();
      roundRect(c, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 14);
      c.lineWidth = sel ? 5 : 2; c.strokeStyle = sel ? '#ffb347' : 'rgba(255,255,255,0.3)';
      if (sel) { c.shadowColor = '#ffb347'; c.shadowBlur = 20; }
      c.stroke();
      c.restore();
      drawText(c, s.name.toUpperCase(), r.x + r.w / 2, r.y + r.h + 36, { size: 30, color: sel ? '#ffe27a' : '#ffffff', font: TITLE_FONT, weight: 'normal' });
      c.font = 'normal 17px ' + FONT;
      wrapText(c, s.desc, r.w).forEach((line, k) => drawText(c, line, r.x + r.w / 2, r.y + r.h + 70 + k * 22, { size: 17, weight: 'normal', color: '#d8c8ff' }));
    });
    const sf = Game.sel;
    drawText(c, FIGHTERS[sf.p1].name + '  vs  ' + FIGHTERS[sf.p2].name, W / 2, 124, { size: 22, color: '#ffffff' });
    drawButton(c, this.backBtn, this.index === STAGES.length);
    drawText(c, 'A/D or ←/→ to choose  ·  Enter / F / K or click to fight  ·  Esc = back', W / 2, 700, { size: 16, weight: 'normal', color: '#b7a8dc' });
  },
};

// ----------------------------------------------------------------- FIGHT
SCREENS.fight = {
  enter() { Game.match = new Match(Game.sel); },
  update() { Game.match.update(); },
  draw(c) { Game.match.draw(c); },
};

// --------------------------------------------------------------- RESULTS
SCREENS.results = {
  enter() {
    this.t = 0;
    this.menu = new Menu([
      { label: 'REMATCH', x: 300, y: 630, w: 220, h: 60, action: () => Game.setScreen('fight') },
      { label: 'CHARACTER SELECT', x: 540, y: 630, w: 280, h: 60, size: 22, action: () => Game.setScreen('charSelect') },
      { label: 'HOME', x: 840, y: 630, w: 160, h: 60, action: () => Game.setScreen('home') },
    ], { horizontal: true });
    Sound.play('victory');
  },
  update() {
    this.t++;
    const r = Game.lastResult;
    if (r.winner >= 0 && this.t % 2 === 0) {
      const w = r.players[r.winner];
      emitElement(FIGHTERS[w.id].element, w.palette.fx, 330 + rand(-110, 110), 580 - rand(0, 280), 2, 2);
    }
    updateParticles();
    if (this.t > 50) this.menu.update();           // short delay so mashing doesn't skip the results
  },
  draw(c) {
    const r = Game.lastResult;
    const win = r.winner >= 0 ? r.players[r.winner] : null;
    const glow = win ? win.palette.glow : '#8a6bff';
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, rgba(glow, 0.55)); g.addColorStop(0.5, '#140a2a'); g.addColorStop(1, '#05030c');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // light rays behind the winner
    c.save(); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) {
      const a = this.t * 0.004 + i * Math.PI / 6;
      c.fillStyle = rgba(glow, 0.07);
      c.beginPath(); c.moveTo(330, 420);
      c.lineTo(330 + Math.cos(a) * 900, 420 + Math.sin(a) * 900);
      c.lineTo(330 + Math.cos(a + 0.15) * 900, 420 + Math.sin(a + 0.15) * 900);
      c.closePath(); c.fill();
    }
    c.restore();
    drawParticles(c);
    if (win) {
      const def = FIGHTERS[win.id];
      drawFighter(c, def, win.palette, 330, 590, 1, POSES.victory(this.t), { scale: 3.1 * 88 / def.height, time: this.t, auraBoost: 0.2 });
      drawText(c, 'P' + (r.winner + 1) + ' WINS!', 330, 70, { size: 70, font: TITLE_FONT, weight: 'normal', color: PLAYER_COLORS[r.winner], stroke: 8, strokeColor: '#140826' });
      drawText(c, def.name, 330, 130, { size: 40, font: TITLE_FONT, weight: 'normal', color: win.palette.light, stroke: 6, strokeColor: '#140826' });
    } else {
      drawText(c, 'DRAW!', 330, 300, { size: 90, font: TITLE_FONT, weight: 'normal', color: '#ffffff', stroke: 8, strokeColor: '#140826' });
    }
    // stats table
    const tx = 680, ty = 110, tw = 540, th = 470;
    c.save();
    roundRect(c, tx, ty, tw, th, 18); c.fillStyle = 'rgba(8,5,20,0.8)'; c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 2; c.stroke();
    c.restore();
    drawText(c, 'MATCH STATS', tx + tw / 2, ty + 34, { size: 28, font: TITLE_FONT, weight: 'normal', color: '#ffe27a' });
    r.players.forEach((pl, i) => {
      const cx = tx + 310 + i * 150;
      if (i === r.winner) { c.fillStyle = rgba(PLAYER_COLORS[i], 0.18); c.fillRect(cx - 70, ty + 60, 140, th - 76); }
      drawPortrait(c, pl.id, pl.palette, cx - 40, ty + 70, 80, 80, this.t, { circle: true });
      c.beginPath(); c.arc(cx, ty + 110, 40, 0, Math.PI * 2); c.lineWidth = 3; c.strokeStyle = PLAYER_COLORS[i]; c.stroke();
      drawText(c, 'P' + (i + 1) + '  ' + pl.name, cx, ty + 176, { size: 18, color: PLAYER_COLORS[i] });
      const vals = [pl.stats.kos, Math.round(pl.stats.damageDealt) + '%', pl.stats.falls, pl.stocks];
      vals.forEach((v, k) => drawText(c, String(v), cx, ty + 236 + k * 58, { size: 34, font: TITLE_FONT, weight: 'normal' }));
    });
    ['KOs', 'Damage Dealt', 'Falls', 'Stocks Left'].forEach((label, k) =>
      drawText(c, label, tx + 30, ty + 236 + k * 58, { size: 20, align: 'left', color: '#d8c8ff' }));
    if (this.t > 50) this.menu.draw(c);
  },
};


/* =======================================================================
   12. MAIN LOOP  - fixed time step
   -----------------------------------------------------------------------
   The browser calls frame() about 60 times a second (or more on fast
   monitors). We add up the real time that passed and run update() once
   for every 1/60th of a second, so the game runs at the same speed on
   every computer. Drawing happens once per browser frame.
   ======================================================================= */

function update() {
  Game.time++;
  if (Input.wasPressed('Backquote')) DEBUG = !DEBUG;
  if (Input.wasPressed('KeyM')) Sound.toggleMute();
  if (Mouse.clicked && pointInRect(Mouse, MUTE_BUTTON)) { Sound.toggleMute(); Mouse.clicked = false; }
  SCREENS[Game.screen].update();
  Input.endFrame();
  Mouse.clicked = false;
  Mouse.moved = false;
}

let fps = 60, fpsFrames = 0, fpsTime = 0;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  SCREENS[Game.screen].draw(ctx);
  drawMuteButton(ctx);
  if (DEBUG) drawText(ctx, 'DEBUG  ·  ' + fps + ' FPS  ·  particles: ' + particles.length, 12, 20, { size: 14, align: 'left', color: '#7dff9a', stroke: 3 });
}

let lastTime = null, accumulator = 0;
function frame(now) {
  if (lastTime === null) lastTime = now;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 250) dt = 250;                // after a hiccup (tab switch), don't try to catch up forever
  accumulator += dt;
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 1000) { fps = fpsFrames; fpsFrames = 0; fpsTime = 0; }
  try {
    let steps = 0;
    while (accumulator >= STEP) {
      update();
      accumulator -= STEP;
      if (++steps >= 5) { accumulator = 0; break; }
    }
    render();
  } catch (err) {
    console.error(err);                  // log it, but keep the game running
  }
  requestAnimationFrame(frame);
}

Game.setScreen('home');
requestAnimationFrame(frame);
</script>
