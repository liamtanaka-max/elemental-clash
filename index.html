<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental Clash</title>
<style>
  /* The page is just a dark backdrop with the game canvas centred in it.
     JavaScript resizes the canvas (keeping 16:9) whenever the window changes. */
  html, body { margin: 0; height: 100%; background: #05030c; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #000; outline: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" tabindex="0"></canvas>
<!-- PeerJS connects two browsers directly (WebRTC) for online play.
     It is only needed for ONLINE - local play works even if it fails to load. -->
<script async src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
"use strict";
/* =======================================================================
   ELEMENTAL CLASH
   A 2-player platform fighter (same keyboard, or online with a room code). Damage is a percentage: the higher
   it gets, the further you fly. Knock your rival past the edge of the
   screen (a "blast zone") to take one of their stocks (lives).

   Everything (characters, stage, effects, sound) is made with code.
   No images or sound files are loaded.

   HOW THE CODE IS ORGANISED (search for the "=====" headers):
     1. Setup & helpers     - canvas, maths helpers
     2. Input               - keyboard + mouse
     3. Sound               - tiny Web Audio synthesiser
     4. Particles           - sparks, smoke, flames...
     5. Fighter data        - FIGHTERS  (add new fighters here!)
     6. Stage data          - STAGES    (add new stages here!)
     7. Poses & drawing     - how a fighter is drawn from shapes
     8. Fighter class       - movement, physics, attacks
     9. Projectiles         - fireballs, bubbles, orbs...
    10. Match class         - one fight: hits, camera, HUD, KOs
    11. UI & screens        - menus, character select, results...
    12. Online multiplayer  - rooms, codes and syncing two computers
    13. Main loop           - fixed 60 FPS time step
   ======================================================================= */


/* =======================================================================
   1. SETUP & HELPERS
   ======================================================================= */

const W = 1280, H = 720;      // the game always "thinks" in 1280x720 pixels
const STEP = 1000 / 60;       // one game update every 1/60th of a second
const START_STOCKS = 3;       // lives per player
const MAX_SHIELD = 60;        // shield health

// ---------------------------------------------------------------------
// TUNING: the numbers that decide how the game FEELS. Tweak away!
// (Per-fighter speeds, gravity and jump power live in FIGHTERS below.)
// ---------------------------------------------------------------------
const TUNING = {
  // movement
  groundAccelFrames: 6,     // frames to reach full run speed
  groundStopFrames: 4,      // frames to stop (also used when turning around)
  airAccelFrames: 10,       // frames to reach full air speed (higher = floatier steering)
  airStopFrames: 40,        // frames to drift to a stop in the air with no input
  fallGravityMult: 1.35,    // gravity is this much stronger while falling (snappier arc)
  jumpSquatFrames: 3,       // crouch before leaving the ground
  jumpCutMult: 0.65,        // releasing jump while rising multiplies upward speed (short hop)
  coyoteFrames: 6,          // you can still jump this long after walking off an edge
  jumpBufferFrames: 6,      // a jump pressed this early before landing still happens
  landingLag: 3,            // frames stuck after a normal landing
  helplessLandingLag: 14,   // landing lag after an up special
  substepPixels: 10,        // collision is checked every this many pixels moved
  // combat
  inputBufferFrames: 8,     // attacks pressed this early come out as soon as possible
  hitstopMin: 3,            // freeze frames on a weak hit...
  hitstopMax: 10,           // ...and on the strongest hit
  hitstopPerDamage: 0.35,   // extra freeze frames per % of damage
  kbDecay: 0.45,            // launch speed lost per frame after being hit
  hitstunMult: 2.0,         // frames of hitstun per point of knockback
  diMaxDegrees: 15,         // directional influence: how much holding a direction bends a launch
  shieldTapFrames: 8,       // releasing the shield within this many frames = spot dodge
  // charged attacks
  chargeHoldMs: 150,        // hold attack longer than this to start charging
  chargeMaxMs: 1000,        // a charge auto-releases after this long
  chargeMaxMult: 2.0,       // damage & knockback at full charge (1.0 at minimum)
};
const KB_DECAY = TUNING.kbDecay;
const HITSTUN_MULT = TUNING.hitstunMult;
const CHARGE_HOLD_FRAMES = Math.round(TUNING.chargeHoldMs / STEP);   // 150 ms = 9 frames
const CHARGE_MAX_FRAMES = Math.round(TUNING.chargeMaxMs / STEP);     // 1 s = 60 frames
const PLAYER_COLORS = ['#ff4b4b', '#4b9bff'];   // P1 red, P2 blue
const FONT = '"Trebuchet MS", "Segoe UI", Verdana, sans-serif';
const TITLE_FONT = 'Impact, "Arial Black", "Segoe UI Black", sans-serif';
let DEBUG = false;            // press ` (backtick) to show hitboxes
// true while online "rollback" quickly re-runs frames that were already shown
// (see section 12): those frames make no sounds or particles a second time.
let replaying = false;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Scale the canvas to fit the window while keeping the 16:9 shape.
// The drawing size stays 1280x720; only the size on screen changes.
function fitCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// --- Small maths helpers used everywhere ---
const clamp = (v, min, max) => (v < min ? min : v > max ? max : v);
const lerp = (a, b, t) => a + (b - a) * t;                 // blend from a to b
const rand = (min, max) => min + Math.random() * (max - min);
// Move a value toward a target by at most "step" (great for acceleration).
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
// Do two rectangles {x, y, w, h} overlap?
const rectsOverlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pointInRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
// Easing curves (t goes 0..1) make animations speed up / slow down smoothly.
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);                  // fast start, gentle stop
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;       // slow, fast, slow
const easeOutBack = t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);   // overshoots a bit

// Colour helper: rgba('#ff8800', 0.5) -> 'rgba(255,136,0,0.5)'
const _rgbCache = {};
function hexToRgb(hex) {
  if (!_rgbCache[hex]) {
    const n = parseInt(hex.slice(1), 16);
    _rgbCache[hex] = { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }
  return _rgbCache[hex];
}
function rgba(hex, a) {
  const c = hexToRgb(hex);
  return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + a + ')';
}

// Draws a rectangle with rounded corners (as a path - call fill/stroke after).
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// A tiny "seeded" random generator so background stars are the same every time.
function seededRandom(seed) {
  let s = seed;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

// Text helper so we don't repeat font/align/colour code everywhere.
function drawText(c, str, x, y, o = {}) {
  c.font = (o.weight || 'bold') + ' ' + (o.size || 20) + 'px ' + (o.font || FONT);
  c.textAlign = o.align || 'center';
  c.textBaseline = o.baseline || 'middle';
  if (o.stroke) {
    c.lineJoin = 'round';
    c.lineWidth = o.stroke;
    c.strokeStyle = o.strokeColor || '#000';
    c.strokeText(str, x, y);
  }
  c.fillStyle = o.color || '#fff';
  c.fillText(str, x, y);
}

// Splits a long sentence into lines that fit inside maxWidth.
function wrapText(c, str, maxWidth) {
  const words = str.split(' ');
  const lines = [];
  let line = '';
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (c.measureText(test).width > maxWidth && line) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}


/* =======================================================================
   2. INPUT  (keyboard + mouse)
   We remember which keys are held ("down") and which were pressed since
   the last game update ("pressed"). Keys are identified by e.code, which
   is the physical key, so it works on any keyboard layout.
   ======================================================================= */

const Input = {
  down: {},
  pressed: {},
  isDown(code) { return !!code && this.down[code] === true; },
  wasPressed(code) { return this.pressed[code] === true; },
  anyPressed(codes) { return codes.some(c => this.pressed[c] === true); },
  endFrame() { this.pressed = {}; },       // called after every update
};
// Mouse buttons go through the same system as keys, as 'Mouse0' (left),
// 'Mouse1' (middle) and 'Mouse2' (right), so they can be bound to anything.
const isMouseCode = code => typeof code === 'string' && code.startsWith('Mouse');

// ----- KEY BINDINGS -----
// Every action a player can bind. Directions never jump: only "jump" does.
const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'special', 'shield', 'grab'];
const ACTION_LABELS = { left: 'Left', right: 'Right', up: 'Up', down: 'Down', jump: 'Jump',
  attack: 'Attack', special: 'Special', shield: 'Shield / Dodge', grab: 'Grab' };
const DEFAULT_CONTROLS = [
  { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', jump: 'Space',
    attack: 'Mouse0', special: 'Mouse2', shield: 'ShiftLeft', grab: 'KeyE' },
  { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', jump: 'Enter',
    attack: 'Period', special: 'Slash', shield: 'ShiftRight', grab: 'Comma' },
];
const CONTROLS_STORAGE_KEY = 'elementalClash.controls.v2';

// Load saved bindings (localStorage can be blocked, so everything is in try/catch).
function loadControls() {
  const fresh = DEFAULT_CONTROLS.map(k => Object.assign({}, k));
  try {
    const saved = JSON.parse(localStorage.getItem(CONTROLS_STORAGE_KEY));
    if (Array.isArray(saved) && saved.length === 2) {
      const added = [];                              // actions that are new since the bindings were saved
      saved.forEach((k, p) => ACTIONS.forEach(a => {
        if (k && typeof k[a] === 'string' && k[a]) fresh[p][a] = k[a]; else added.push([p, a]);
      }));
      // a new action's default key might already be used by an old binding: leave it unbound then
      for (const [p, a] of added) {
        const taken = fresh.some((k, q) => ACTIONS.some(b => (q !== p || b !== a) && k[b] === fresh[p][a]));
        if (taken) fresh[p][a] = '';
      }
    }
  } catch (err) { /* no saved bindings: use the defaults */ }
  return fresh;
}
function saveControls() {
  try { localStorage.setItem(CONTROLS_STORAGE_KEY, JSON.stringify(CONTROLS)); } catch (err) { /* storage unavailable */ }
}
// CONTROLS[0] is Player 1's binding map, CONTROLS[1] is Player 2's.
// ALL game input reads from here, so rebinding takes effect immediately.
const CONTROLS = loadControls();

function resetControls(p) {
  Object.assign(CONTROLS[p], DEFAULT_CONTROLS[p]);
  saveControls();
}
// Bind "code" to player p's action. If another action already uses that
// key (for either player), the two bindings swap. Returns a message.
function rebind(p, action, code) {
  const old = CONTROLS[p][action];
  let msg = 'P' + (p + 1) + ' ' + ACTION_LABELS[action] + ' is now ' + keyName(code);
  for (let q = 0; q < 2; q++) {
    for (const a of ACTIONS) {
      if ((q !== p || a !== action) && CONTROLS[q][a] === code) {
        CONTROLS[q][a] = old;
        msg = 'Warning: ' + keyName(code) + ' was used by P' + (q + 1) + ' ' + ACTION_LABELS[a] +
          ' - swapped, so that is now ' + keyName(old);
      }
    }
  }
  CONTROLS[p][action] = code;
  saveControls();
  return msg;
}
const isBound = code => CONTROLS.some(k => ACTIONS.some(a => k[a] === code));

// Friendly names for keys and mouse buttons, shown in menus.
const KEY_NAMES = {
  Space: 'Space', Enter: 'Enter', NumpadEnter: 'Num Enter', ShiftLeft: 'L-Shift', ShiftRight: 'R-Shift',
  ControlLeft: 'L-Ctrl', ControlRight: 'R-Ctrl', AltLeft: 'L-Alt', AltRight: 'R-Alt',
  ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
  Period: '.', Comma: ',', Slash: '/', Semicolon: ';', Quote: "'", BracketLeft: '[', BracketRight: ']',
  Backslash: '\\', Minus: '-', Equal: '=', Backquote: '`', Tab: 'Tab', Backspace: 'Backspace', CapsLock: 'Caps Lock',
  Mouse0: 'Left Click', Mouse1: 'Middle Click', Mouse2: 'Right Click', Mouse3: 'Mouse Back', Mouse4: 'Mouse Fwd',
};
function keyName(code) {
  if (!code) return '-';
  if (KEY_NAMES[code]) return KEY_NAMES[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
  if (code.startsWith('Mouse')) return 'Mouse ' + (Number(code.slice(5)) + 1);
  return code;
}

// Keys that would otherwise scroll the page, press buttons, or open quick-find.
const BLOCKED_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Enter', 'NumpadEnter',
  'Slash', 'Quote', 'Backquote', 'Tab', 'Semicolon']);

window.addEventListener('keydown', e => {
  if (BLOCKED_KEYS.has(e.code) || isBound(e.code)) e.preventDefault();
  if (!e.repeat) Input.pressed[e.code] = true;   // holding a key doesn't re-press it
  Input.down[e.code] = true;
  Sound.unlock();                                 // browsers need a key/click before audio
});
window.addEventListener('keyup', e => { Input.down[e.code] = false; });
window.addEventListener('blur', () => { Input.down = {}; });  // let go of everything if the tab loses focus

// Turns the raw keyboard/mouse into a simple object for one player,
// using that player's binding map. "left" = held, "leftP" = pressed this frame.
function readPlayerInput(k) {
  const d = code => Input.isDown(code), p = code => Input.wasPressed(code);
  return {
    left: d(k.left), right: d(k.right), up: d(k.up), down: d(k.down), jump: d(k.jump),
    attack: d(k.attack), special: d(k.special), shield: d(k.shield), grab: d(k.grab),
    leftP: p(k.left), rightP: p(k.right), upP: p(k.up), downP: p(k.down), jumpP: p(k.jump),
    attackP: p(k.attack), specialP: p(k.special), shieldP: p(k.shield), grabP: p(k.grab),
  };
}
// An input object where nothing is pressed (used during the countdown).
const NO_INPUT = readPlayerInput({});
// -1 = left, 1 = right, 0 = neither (or both)
const dirOf = inp => (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
// Was any button pressed this frame? (used for mashing out of traps and grabs)
const mashed = inp => ACTIONS.some(a => inp[a + 'P']);

// Menus: arrows/WASD/Enter/Space always work, plus each player's own
// direction keys and (keyboard) attack key. Mouse clicks are handled by the menus.
const MENU_KEYS = {
  up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'],
  left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'],
  confirm: ['Enter', 'NumpadEnter', 'Space'],
  back: ['Escape', 'Backspace'],
};
function menuPressed(name) {
  if (Input.anyPressed(MENU_KEYS[name])) return true;
  const action = name === 'confirm' ? 'attack' : name;
  if (!ACTIONS.includes(action)) return false;
  return CONTROLS.some(k => !isMouseCode(k[action]) && Input.wasPressed(k[action]));
}

// Mouse position is converted from screen pixels to game pixels.
const Mouse = { x: -1, y: -1, moved: false, clicked: false };
function updateMouse(e) {
  const r = canvas.getBoundingClientRect();
  Mouse.x = (e.clientX - r.left) * W / r.width;
  Mouse.y = (e.clientY - r.top) * H / r.height;
}
canvas.addEventListener('mousemove', e => { updateMouse(e); Mouse.moved = true; });
window.addEventListener('mousedown', e => {
  updateMouse(e);
  const code = 'Mouse' + e.button;
  if (!Input.down[code]) Input.pressed[code] = true;
  Input.down[code] = true;
  if (e.button === 0) Mouse.clicked = true;       // left click also presses menu buttons
  if (e.target === canvas) { e.preventDefault(); canvas.focus(); }
  Sound.unlock();
});
window.addEventListener('mouseup', e => { Input.down['Mouse' + e.button] = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());   // right click is a game button


/* =======================================================================
   3. SOUND  - every sound is generated live with the Web Audio API.
   tone()  = a beep from an oscillator (sine, square, sawtooth...)
   noise() = filtered white noise (whooshes, hits, explosions)
   ======================================================================= */

const Sound = {
  ctx: null, master: null, noiseBuffer: null, muted: false,

  // Audio can only start after the player interacts with the page.
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.45;
      this.master.connect(this.ctx.destination);
      // 2 seconds of random samples = white noise we can reuse forever
      const len = this.ctx.sampleRate * 2;
      this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch (err) { this.ctx = null; }
  },

  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setValueAtTime(this.muted ? 0 : 0.45, this.ctx.currentTime);
  },

  tone(freq, dur, o = {}) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.01);   // quick fade in
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);         // then fade out
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.05);
  },

  noise(dur, o = {}) {
    if (!this.ctx || this.muted || !this.noiseBuffer) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const src = c.createBufferSource();
    src.buffer = this.noiseBuffer;
    const filter = c.createBiquadFilter();
    filter.type = o.type || 'lowpass';
    filter.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.slide) filter.frequency.exponentialRampToValueAtTime(Math.max(30, o.slide), t + dur);
    filter.Q.value = o.q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(o.vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filter); filter.connect(g); g.connect(this.master);
    src.start(t, Math.random() * 0.8); src.stop(t + dur + 0.05);
  },

  // A rising tone while a fighter charges an attack. It is stored on the
  // fighter so it can be stopped on release (or when they get hit).
  startCharge(f) {
    this.stopCharge(f);
    if (!this.ctx || this.muted || replaying) return;
    const c = this.ctx, t = c.currentTime, dur = TUNING.chargeMaxMs / 1000;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.linearRampToValueAtTime(760, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.3);           // safety net: it can never ring forever
    f.chargeSound = { osc, g };
  },
  stopCharge(f) {
    const s = f.chargeSound;
    if (!s) return;
    f.chargeSound = null;
    try {
      const t = this.ctx.currentTime;
      s.g.gain.cancelScheduledValues(t);
      s.g.gain.setValueAtTime(Math.max(0.0001, s.g.gain.value), t);
      s.g.gain.linearRampToValueAtTime(0, t + 0.05);
      s.osc.stop(t + 0.06);
    } catch (err) { /* already stopped */ }
  },

  // All the game's sounds, by name.
  play(name, strength = 1) {
    if (!this.ctx || this.muted || replaying) return;
    switch (name) {
      case 'menuMove':   this.tone(520, 0.05, { type: 'square', vol: 0.06 }); break;
      case 'menuSelect': this.tone(660, 0.08, { type: 'square', vol: 0.08 });
                         this.tone(990, 0.14, { type: 'square', vol: 0.08, delay: 0.07 }); break;
      case 'back':       this.tone(440, 0.12, { type: 'square', vol: 0.07, slide: 220 }); break;
      case 'lock':       this.tone(523, 0.1, { type: 'triangle', vol: 0.15 });
                         this.tone(784, 0.2, { type: 'triangle', vol: 0.15, delay: 0.06 }); break;
      case 'jump':       this.tone(280, 0.12, { type: 'triangle', vol: 0.12, slide: 560 }); break;
      case 'djump':      this.tone(400, 0.15, { type: 'triangle', vol: 0.12, slide: 900 }); break;
      case 'land':       this.noise(0.06, { vol: 0.07, freq: 500 }); break;
      case 'grab':       this.noise(0.08, { vol: 0.18, freq: 700, slide: 200 });
                         this.tone(200, 0.08, { type: 'triangle', vol: 0.12, slide: 120 }); break;
      case 'swing':      this.noise(0.09, { vol: 0.06 * strength, freq: 2600, slide: 900, type: 'bandpass', q: 2 }); break;
      case 'hit':        this.noise(0.12, { vol: 0.22, freq: 2000, slide: 300 });
                         this.tone(170, 0.1, { type: 'square', vol: 0.1, slide: 60 }); break;
      case 'hitHeavy':   this.noise(0.35, { vol: 0.38, freq: 1400, slide: 90 });
                         this.tone(120, 0.32, { type: 'sawtooth', vol: 0.2, slide: 35 }); break;
      case 'shieldHit':  this.tone(900, 0.08, { type: 'triangle', vol: 0.12, slide: 500 }); break;
      case 'shieldBreak':this.tone(900, 0.6, { type: 'sawtooth', vol: 0.16, slide: 80 });
                         this.noise(0.4, { vol: 0.25, freq: 3000, slide: 200 }); break;
      case 'ko':         this.noise(1.0, { vol: 0.5, freq: 3500, slide: 60 });
                         this.tone(220, 0.9, { type: 'sawtooth', vol: 0.22, slide: 30 });
                         this.tone(880, 0.5, { type: 'square', vol: 0.07, slide: 110, delay: 0.05 }); break;
      case 'beep':       this.tone(440, 0.18, { type: 'square', vol: 0.12 }); break;
      case 'go':         this.tone(880, 0.5, { type: 'square', vol: 0.12 });
                         this.tone(1320, 0.5, { type: 'square', vol: 0.08, delay: 0.02 }); break;

/* =======================================================================
   4. PARTICLES
   A particle is a tiny object with a position, velocity and lifetime.
   Each element has its own particle "style" (fire rises, water falls...).
   ======================================================================= */

const particles = [];
const particlePool = [];        // dead particles wait here to be reused (no garbage = no stutter)
const MAX_PARTICLES = 1400;     // hard cap so the game stays at 60 FPS

function spawnParticle(o) {
  if (replaying || particles.length >= MAX_PARTICLES) return;   // stay fast: never too many
  const p = particlePool.pop() || {};              // recycle an old particle if we have one
  const life = o.life || 30;
  p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.life = life; p.maxLife = life;
  p.size = o.size || 4; p.color = o.color || '#fff'; p.shape = o.shape || 'circle';
  p.gravity = o.gravity || 0; p.drag = o.drag === undefined ? 0.96 : o.drag;
  p.glow = !!o.glow; p.grow = o.grow || 0; p.rot = Math.random() * 6.28; p.vr = o.vr || rand(-0.2, 0.2);
  particles.push(p);
}

function updateParticles() {
  let alive = 0;
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.vx *= p.drag;
    p.vy = p.vy * p.drag + p.gravity;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.vr;
    p.life--;
    if (p.life > 0) particles[alive++] = p;     // keep living particles...
    else particlePool.push(p);                  // ...and put dead ones back in the pool
  }
  particles.length = alive;
}

function clearParticles() {
  for (const p of particles) particlePool.push(p);
  particles.length = 0;
}

function drawParticles(c) {
  for (const p of particles) {
    const t = p.life / p.maxLife;                  // 1 = just born, 0 = about to vanish
    c.globalCompositeOperation = p.glow ? 'lighter' : 'source-over';  // "lighter" makes glowing light
    c.globalAlpha = Math.min(1, t * 1.6);
    c.fillStyle = p.color;
    c.strokeStyle = p.color;
    switch (p.shape) {
      case 'spark':                                // a streak along its velocity
        c.lineWidth = p.size; c.lineCap = 'round';
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); c.stroke();
        break;
      case 'star': {                               // a 4-pointed twinkle
        const r = p.size * (0.5 + t) * 1.4;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.beginPath();
        for (let i = 0; i < 8; i++) {
          const rr = i % 2 === 0 ? r : r * 0.3, a = i * Math.PI / 4;
          c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        c.closePath(); c.fill(); c.restore();
        break;
      }
      case 'smoke':                                // grows and fades
        c.globalAlpha = t * 0.55;
        c.beginPath(); c.arc(p.x, p.y, p.size * (1 + (1 - t) * 1.5), 0, Math.PI * 2); c.fill();
        break;
      case 'ring':
        c.lineWidth = 3 * t;
        c.beginPath(); c.arc(p.x, p.y, p.size + (1 - t) * p.grow, 0, Math.PI * 2); c.stroke();
        break;
      case 'square':
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size); c.restore();
        break;
      default:                                     // 'circle' and 'drop' shrink as they die
        c.beginPath(); c.arc(p.x, p.y, Math.max(0.5, p.size * (p.shape === 'drop' ? 0.6 + 0.4 * t : 0.3 + 0.7 * t)), 0, Math.PI * 2); c.fill();
    }
  }
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}

// How each element's particles behave.
const ELEMENT_STYLE = {
  fire:    { shape: 'circle', gravity: -0.12, drag: 0.93, life: [16, 34], size: [3, 7],   glow: true },
  water:   { shape: 'drop',   gravity: 0.28,  drag: 0.98, life: [22, 40], size: [2, 5],   glow: false },
  thunder: { shape: 'spark',  gravity: 0,     drag: 0.84, life: [8, 18],  size: [1.5, 3], glow: true },
  light:   { shape: 'star',   gravity: -0.03, drag: 0.92, life: [22, 44], size: [2, 5],   glow: true },
  dark:    { shape: 'smoke',  gravity: -0.05, drag: 0.95, life: [26, 50], size: [5, 11],  glow: false },
};
// Colours used for the five elements on menus and the stage.
const ELEMENT_COLORS = {
  fire: ['#fff3a0', '#ffb627', '#ff6a00', '#e8290b'],
  water: ['#ffffff', '#bff4ff', '#5ad1ff', '#2f8cff'],
  thunder: ['#ffffff', '#fff36b', '#ffd60a', '#b44dff'],
  light: ['#ffffff', '#fff2b0', '#ffd75e', '#ffb300'],
  dark: ['#c08bff', '#8a2be2', '#5a0f8a', '#b0102a'],
};
const ELEMENT_LIST = ['fire', 'water', 'thunder', 'light', 'dark'];

// Spray "count" particles of an element at (x, y).
// opts.angle + opts.spread aim the spray; opts.vx/vy add a push.
function emitElement(element, colors, x, y, count, speed = 3, opts = {}) {
  const st = ELEMENT_STYLE[element] || ELEMENT_STYLE.fire;
  const jitter = opts.jitter === undefined ? 4 : opts.jitter;
  const spread = opts.spread === undefined ? 0.5 : opts.spread;
  for (let i = 0; i < count; i++) {
    const ang = opts.angle !== undefined ? opts.angle + rand(-spread, spread) : rand(0, Math.PI * 2);
    const sp = speed * rand(0.3, 1);
    spawnParticle({
      x: x + rand(-jitter, jitter), y: y + rand(-jitter, jitter),
      vx: Math.cos(ang) * sp + (opts.vx || 0), vy: Math.sin(ang) * sp + (opts.vy || 0),
      life: rand(st.life[0], st.life[1]) * (opts.lifeMul || 1),
      size: rand(st.size[0], st.size[1]) * (opts.sizeMul || 1),
      color: colors[Math.floor(Math.random() * colors.length)],
      shape: opts.shape || st.shape, gravity: st.gravity, drag: st.drag, glow: st.glow,
    });
  }
}

// Grey puffs of dust for landing, jumping and sliding.
function spawnDust(x, y, count = 6) {
  for (let i = 0; i < count; i++) {
    spawnParticle({ x: x + rand(-14, 14), y: y - 2, vx: rand(-2, 2), vy: rand(-1.2, -0.2),
      life: rand(15, 28), size: rand(3, 6), color: '#cfc6e6', shape: 'smoke', drag: 0.92 });
  }
}

/* =======================================================================
   5. FIGHTER DATA
   -----------------------------------------------------------------------
   Every fighter is one entry in FIGHTERS. To add a new fighter (Earth,
   Wind, Ice...), copy an entry, change the numbers and colours, add its
   id to FIGHTER_ORDER, and it appears on the character select screen.

   PHYSICS NUMBERS are in pixels per frame (60 frames = 1 second):
     walkSpeed, airSpeed    top speed on the ground / in the air
     (acceleration and friction are shared: see TUNING at the top)
     gravity, maxFall       falling acceleration and falling speed limit
     fastFall               falling speed after tapping down
     jumpPower              upward speed of a jump (double jump separate)
     weight                 heavier fighters fly less far (around 70-130)

   MOVES. Each move has:
     startup   frames before the hitbox appears (wind-up)
     active    frames the hitbox is out
     endlag    frames of recovery afterwards
     hitboxes  rectangles that hurt. x/y are offsets from the fighter's
               feet (x is mirrored when facing left, negative y = up).
               dmg    damage in %
               bkb    base knockback (launch even at 0%)
               kbs    knockback scaling (how much % increases launch)
               angle  launch angle in degrees: 0 = forward, 90 = up,
                      -90 = down (a "spike"), 145 = back and up
               radial true = push away from the attacker on either side
               start/end  override the active frames for this box
               rehit  can hit again after this many frames (multi-hits)
               group  hitboxes in different groups can both connect
     pose      which drawing pose to use (see ATTACK_POSES)
     onFrame(me, f, inp)  optional script run every frame (f = frame)
     landingLag (aerials) frames stuck after landing mid-attack
     helpless  (recoveries) after the move you can only drift until you land
   Required moves: jab1-3, ftilt, utilt, dtilt, nair, fair, bair, uair,
   dair, nspecial, sspecial, uspecial (a recovery!), dspecial,
   and three CHARGED attacks (hold attack): chargeSide, chargeUp, chargeDown.
   A charged attack's damage and knockback are multiplied by 1x-2x
   depending on how long it was charged (see TUNING.chargeMaxMult).
     trail  true = leave afterimages while doing the move
   ======================================================================= */

// Little helpers that move scripts use. "me" is the fighter doing the move.
function fx(me, count, speed, ox = 0, oy = -40, opts = {}) {       // element particles near me
  emitElement(me.def.element, me.palette.fx, me.x + ox * me.facing, me.y + oy, count, speed, opts);
}
function spawnProjectile(me, o) {                                   // x, y, vx are relative to facing
  const p = new Projectile(me, o);
  me.match.projectiles.push(p);
  return p;
}
function countProjectiles(me, kind) {
  return me.match.projectiles.filter(p => p.owner === me && p.kind === kind && !p.dead).length;
}

// GRABS & THROWS - every fighter gets these moves (a fighter can define its
// own "grab", "fthrow"... in its moves to replace them).
//   Grab button        = grab whoever is right in front of you (goes through shields!)
//   then a direction   = throw them that way (forward / back / up / down)
//   Attack (or Grab)   = pummel: a small hit while you keep holding on
//   The grabbed player mashes any button to break free sooner.
// ---------------------------------------------------------------------
function makeThrow(name, pose, hit, back = false) {
  return { hidden: true, name, pose, startup: 9, active: 1, endlag: 16, noDrift: true, holdsGrab: true,
    throwHit: hit,
    onStart(me) { if (back) me.facing = -me.facing; },      // back throw: swing them round behind you
    onFrame(me, f) {
      if (f !== 10) return;
      const t = me.grabbing;
      me.grabbing = null;
      if (t && t.state === 'grabbed') {
        t.grabbedBy = null;
        me.match.applyHit(me, t, me.move.throwHit, { dir: me.facing });
        fx(me, 18, 5, 40, -50);
      }
    } };
}
const COMMON_MOVES = {
  grab: { name: 'Grab', pose: 'grab', startup: 6, active: 3, endlag: 24,
    hitboxes: [{ x: 46, y: -50, w: 58, h: 60, dmg: 0, bkb: 0, kbs: 0, angle: 0, effect: 'grab', grabMove: 'grabHold' }] },
  // Holding someone. Ends with a throw, or lets go when time runs out.
  grabHold: { hidden: true, name: 'Hold', pose: 'grab', startup: 0, active: 1, endlag: 0, duration: 999,
    noDrift: true, holdsGrab: true, sfx: 'grab',
    getPose: (me, f, base) => Object.assign(base, ATTACK_POSES.grab.hit),
    onFrame(me, f, inp) {
      const t = me.grabbing, d = me.moveData;
      if (!t || t.state !== 'grabbed') { me.grabbing = null; me.endMove(); return; }
      if (f === 1) { d.holdLeft = 50 + Math.min(70, t.percent * 0.5); d.pummelWait = 0; }   // harder to escape at high damage
      if (--d.holdLeft <= 0) { me.releaseGrab(); return; }
      if (d.pummelWait > 0) d.pummelWait--;
      if (f < 5) return;                              // a short moment before you can throw
      const dirX = dirOf(inp);
      if (inp.up) me.startMove('uthrow');
      else if (inp.down) me.startMove('dthrow');
      else if (dirX === me.facing) me.startMove('fthrow');
      else if (dirX === -me.facing) me.startMove('bthrow');
      else if ((inp.attackP || inp.grabP) && d.pummelWait <= 0) { me.pummel(t); d.pummelWait = 14; }
    } },
  fthrow: makeThrow('Forward Throw', 'punch', { dmg: 8, bkb: 6, kbs: 0.16, angle: 40 }),

};

const FIGHTER_ORDER = ['pyro', 'tide', 'volt', 'lumen', 'umbra'];

// Fill in defaults so every move is complete (runs once at start-up).
const REQUIRED_MOVES = ['jab1', 'jab2', 'jab3', 'ftilt', 'utilt', 'dtilt', 'nair', 'fair', 'bair', 'uair', 'dair',
  'nspecial', 'sspecial', 'uspecial', 'dspecial', 'chargeSide', 'chargeUp', 'chargeDown'];
const AERIALS = ['nair', 'fair', 'bair', 'uair', 'dair'];
for (const id in FIGHTERS) {
  const def = FIGHTERS[id];
  def.id = id;
  for (const req of REQUIRED_MOVES) if (!def.moves[req]) console.warn('Fighter "' + id + '" is missing move: ' + req);
  for (const name in def.moves) {
    const m = def.moves[name];
    m.id = name;
    m.hitboxes = m.hitboxes || [];
    m.duration = m.duration || (m.startup + m.active + m.endlag);
    m.aerial = AERIALS.includes(name);
    m.charge = name.startsWith('charge');            // damage/knockback get the charge multiplier
    m.swipe = m.charge || /^(jab|ftilt|utilt|dtilt|nair|fair|bair|uair|dair)/.test(name);   // draw a swipe arc
    if (name === 'uspecial') m.canGrabLedge = true;   // recoveries can snap to the ledge
    for (const hb of m.hitboxes) {
      if (hb.start === undefined) hb.start = m.startup + 1;
      if (hb.end === undefined) hb.end = m.startup + m.active;
    }
  }
}

/* =======================================================================
   6. STAGE DATA
   -----------------------------------------------------------------------
   A stage is a list of platforms plus blast zones and drawing functions.
     solid: true   = can't pass through (the main platform). Has ledges.
     solid: false  = jump up through it, hold down to drop through.

// Draws something with a "parallax" effect: far-away layers (small factor)
// move less than the camera, which makes the background feel deep.
function withParallax(c, cam, factor, drawFn) {
  c.save();
  const z = 1 + (cam.zoom - 1) * factor;
  c.translate(W / 2, H / 2);
  c.scale(z, z);
  c.translate(-(640 + (cam.x - 640) * factor), -(360 + (cam.y - 360) * factor));
  drawFn();
  c.restore();
}

// Work out where every stage's ledges are (both ends of solid platforms).
for (const stage of STAGES) {
  stage.ledges = [];
  for (const p of stage.platforms) {
    if (!p.ledges) continue;
    stage.ledges.push({ x: p.x, y: p.y, side: -1, platform: p });          // left edge
    stage.ledges.push({ x: p.x + p.w, y: p.y, side: 1, platform: p });     // right edge
  }
}

// Draws a stage into any rectangle (used for the stage-select previews).
function renderStageView(c, stage, x, y, w, h, t) {
  c.save();
  c.beginPath(); c.rect(x, y, w, h); c.clip();
  c.translate(x, y);
  c.scale(w / W, h / H);
  const cam = { x: 640, y: 420, zoom: 0.8 };
  stage.drawBackground(c, cam, t);
  c.translate(W / 2, H / 2); c.scale(cam.zoom, cam.zoom); c.translate(-cam.x, -cam.y);
  stage.drawStage(c, t);
  c.restore();
}


/* =======================================================================
   7. POSES & DRAWING
   -----------------------------------------------------------------------
   Fighters are drawn as a stick-figure skeleton with thick limbs.
   A "pose" says the angle of each joint (in radians):
     lean     tilt of the body (+ = leaning forward)
     crouch   0..1, how low the hips are
     aF, aB   front / back arm angle at the shoulder (0 = down, 1.57 = forward, 3.14 = up)
     eF, eB   elbow bend
     lF, lB   front / back leg angle at the hip (0 = down, + = forward)
     kF, kB   knee bend
     rot      spin the whole body (flips)
     yOff     move the body up/down
   ======================================================================= */

const POSE_KEYS = ['lean', 'crouch', 'aF', 'eF', 'aB', 'eB', 'lF', 'kF', 'lB', 'kB', 'rot', 'yOff'];
const POSE_DEFAULT = { lean: 0, crouch: 0, aF: 0.2, eF: 0.4, aB: -0.2, eB: 0.4, lF: 0.1, kF: 0.1, lB: -0.1, kB: 0.1, rot: 0, yOff: 0 };
const mkPose = o => Object.assign({}, POSE_DEFAULT, o);

// Blend two poses together (t = 0 gives a, t = 1 gives b).
function blendPose(a, b, t) {
  const out = {};
  for (const k of POSE_KEYS) out[k] = lerp(a[k] !== undefined ? a[k] : POSE_DEFAULT[k], b[k] !== undefined ? b[k] : POSE_DEFAULT[k], t);
  return out;
}

// Poses for normal states. Many are functions of time (t) so they animate.
const POSES = {
  idle: t => mkPose({ lean: 0.06, crouch: 0.06 + Math.sin(t * 0.08) * 0.03, aF: 0.35, eF: 0.9, aB: -0.15, eB: 0.9, lF: 0.18, kF: 0.2, lB: -0.14, kB: 0.15 }),
  // A full run cycle. ph = phase (advances faster at higher speed), s = 0..1 speed.
  // Legs swing opposite to each other, the knee of the leg swinging back folds
  // up, arms pump against the legs, and the body bobs twice per cycle.
  run: (ph, s) => {
    const c = Math.sin(ph), c2 = Math.cos(ph);
    return mkPose({
      lean: 0.12 + 0.25 * s, crouch: 0.1 + 0.06 * s, yOff: -Math.abs(c) * 6 * s,
      lF: c * 1.0 * s, kF: 0.25 + Math.max(0, c2) * 1.5 * s,
      lB: -c * 1.0 * s, kB: 0.25 + Math.max(0, -c2) * 1.5 * s,
      aF: -c * 1.1 * s + 0.25, eF: 1.4, aB: c * 1.1 * s - 0.05, eB: 1.4,
    });
  },
  rise: () => mkPose({ lean: -0.05, aF: 2.5, eF: 0.25, aB: 2.1, eB: 0.35, lF: 0.15, kF: 0.25, lB: -0.15, kB: 0.35 }),   // stretched upward
  tuck: () => mkPose({ lean: 0.15, aF: 1.3, eF: 1.3, aB: 1.0, eB: 1.3, lF: 1.3, kF: 2.1, lB: 0.9, kB: 1.9 }),            // knees up at the peak
  fastfall: () => mkPose({ aF: 3.0, eF: 0, aB: 2.9, eB: 0, lF: 0.05, kF: 0, lB: -0.05, kB: 0 }),                        // dive straight down
  crouch: () => mkPose({ lean: 0.35, crouch: 0.75, aF: 0.6, eF: 1.1, aB: 0.3, eB: 1.0, lF: 0.9, kF: 1.7, lB: 0.3, kB: 1.4 }),
  jump: () => mkPose({ aF: 2.0, eF: 0.4, aB: -0.8, eB: 0.5, lF: 0.8, kF: 1.6, lB: 0.2, kB: 1.2 }),
  fall: t => mkPose({ aF: 2.1 + Math.sin(t * 0.2) * 0.1, eF: 0.3, aB: 1.7, eB: 0.3, lF: 0.3, kF: 0.4, lB: -0.2, kB: 0.5 }),
  helpless: t => mkPose({ lean: -0.2, aF: 2.6 + Math.sin(t * 0.4) * 0.4, eF: 0.2, aB: 2.3 - Math.sin(t * 0.4) * 0.4, eB: 0.2, lF: 0.4, kF: 0.6, lB: -0.3, kB: 0.6 }),
  hurt: t => mkPose({ lean: -0.5, aF: 2.6 + Math.sin(t * 0.5) * 0.3, eF: 0.3, aB: 2.2, eB: 0.4, lF: 0.6, kF: 0.4, lB: -0.5, kB: 0.5 }),
  guard: () => mkPose({ lean: 0.1, crouch: 0.2, aF: 1.9, eF: 1.7, aB: 1.7, eB: 1.9, lF: 0.3, kF: 0.4, lB: -0.3, kB: 0.3 }),
  hang: () => mkPose({ lean: 0.1, aF: 3.05, eF: 0, aB: 2.9, eB: 0, lF: 0.1, kF: 0.3, lB: -0.1, kB: 0.4 }),
  climb: () => mkPose({ lean: 0.5, crouch: 0.5, aF: 1.2, eF: 0.8, aB: 1.0, eB: 0.8, lF: 1.2, kF: 1.6, lB: 0.2, kB: 1.0 }),
  dizzy: t => mkPose({ lean: Math.sin(t * 0.1) * 0.25, crouch: 0.2, aF: 0.2, eF: 0.3, aB: -0.1, eB: 0.3, lF: 0.25, kF: 0.4, lB: -0.25, kB: 0.4 }),
  dodge: () => mkPose({ lean: 0.2, crouch: 0.6, aF: 1.2, eF: 1.6, aB: 1.0, eB: 1.6, lF: 0.8, kF: 1.5, lB: 0.3, kB: 1.3 }),
  victory: t => mkPose({ lean: -0.08, aF: 2.35 + Math.sin(t * 0.15) * 0.12, eF: 0.35, aB: 2.95, eB: 0.2, lF: 0.25, kF: 0.1, lB: -0.25, kB: 0.1, yOff: -Math.abs(Math.sin(t * 0.08)) * 6 }),
};

// Attack poses: "wind" is the wind-up, "hit" is the strike.
// spin: 1 = full forward rotation during the active frames, -1 = backflip.
const ATTACK_POSES = {
  punch:    { wind: { aF: -0.4, eF: 1.6, lean: -0.05 }, hit: { aF: 1.6, eF: 0.05, aB: -0.7, eB: 0.6, lean: 0.25, lF: 0.45, kF: 0.2, lB: -0.4, kB: 0.2 } },
  punch2:   { wind: { aB: -0.5, eB: 1.6, aF: 0.9, eF: 1.2 }, hit: { aB: 1.6, eB: 0.05, aF: -0.4, eF: 0.8, lean: 0.3, lF: 0.45, kF: 0.2, lB: -0.4, kB: 0.2 } },
  uppercut: { wind: { aF: 0.1, eF: 2.0, crouch: 0.35, lean: 0.25 }, hit: { aF: 2.95, eF: 0.15, aB: -0.5, lean: -0.15, yOff: -8, lF: 0.2, lB: -0.2 } },
  kick:     { wind: { lF: -0.3, kF: 1.6, lean: -0.1 }, hit: { lF: 1.55, kF: 0.05, lean: -0.35, aF: -0.5, eF: 0.5, aB: 0.9, eB: 0.4, lB: -0.2, kB: 0.2 } },
  upkick:   { wind: { crouch: 0.3, lF: 0.4, kF: 1.4 }, hit: { lF: 2.7, kF: 0.1, lean: -0.5, aF: -0.9, aB: -0.6, lB: -0.1, kB: 0.1 } },
  armArc:   { wind: { aF: 0.6, eF: 1.0, aB: 0.6, crouch: 0.3 }, hit: { aF: 3.0, eF: 0.2, aB: 2.6, eB: 0.3, lean: -0.1, yOff: -4 } },
  sweep:    { wind: { crouch: 0.7, lean: 0.3, lF: 0.9, kF: 1.7, lB: 0.3, kB: 1.4 }, hit: { crouch: 0.8, lean: 0.35, lF: 1.6, kF: 0.05, lB: 0.4, kB: 1.6, aF: 0.5, aB: -0.3 } },
  spin:     { wind: { lF: 0.8, kF: 1.4, lB: 0.6, kB: 1.4, aF: 1.0, aB: 1.0 }, hit: { aF: 1.6, eF: 0, aB: -1.6, eB: 0, lF: 1.0, kF: 0.1, lB: -1.0, kB: 0.1 }, spin: 1 },
  fairSwing:{ wind: { aF: 2.9, eF: 0.2, aB: 2.6, lean: -0.25 }, hit: { aF: 0.9, eF: 0.1, aB: 0.7, eB: 0.2, lean: 0.45, lF: 0.7, kF: 0.9, lB: 0.1, kB: 1.0 } },
  backkick: { wind: { lB: 0.5, kB: 1.8, lean: 0.2 }, hit: { lB: -1.7, kB: 0.05, lean: 0.55, aF: 0.7, eF: 0.6, aB: 0.2 } },
  flip:     { wind: { lF: 0.9, kF: 1.5, lB: 0.6, kB: 1.4 }, hit: { lF: 2.8, kF: 0.2, lB: 0.3, kB: 1.0, lean: -0.4, aF: -0.6, aB: -0.9 }, spin: -1 },
  stomp:    { wind: { lF: 1.3, kF: 2.0, lB: 1.1, kB: 2.0, aF: 2.4, aB: 2.4, eF: 0.3, eB: 0.3 }, hit: { lF: 0.15, kF: 0, lB: -0.15, kB: 0, aF: 2.9, aB: 3.0, eF: 0.1, eB: 0.1, yOff: 6 } },
  cast:     { wind: { aF: -0.6, eF: 1.7, aB: -0.6, eB: 1.7, lean: -0.15 }, hit: { aF: 1.6, eF: 0, aB: 1.45, eB: 0.1, lean: 0.2, lF: 0.4, kF: 0.2, lB: -0.4, kB: 0.3 } },
  castUp:   { wind: { crouch: 0.5, aF: 0.3, aB: 0.3, eF: 1.2, eB: 1.2 }, hit: { aF: 3.0, aB: 2.9, eF: 0, eB: 0.1, lean: -0.05, lF: 0.15, kF: 0.1, lB: -0.15, kB: 0.1 } },
  castDown: { wind: { aF: 2.7, aB: 2.6, eF: 0.2, eB: 0.2, yOff: -4 }, hit: { aF: 0.5, aB: 0.4, eF: 0.4, eB: 0.4, crouch: 0.55, lean: 0.4, lF: 0.9, kF: 1.5, lB: 0.2, kB: 1.2 } },
  dash:     { wind: { crouch: 0.4, lean: 0.4, aF: -0.5, aB: -0.6 }, hit: { lean: 0.75, aF: -1.3, eF: 0.3, aB: -1.5, eB: 0.3, lF: 0.9, kF: 1.3, lB: -0.7, kB: 0.9 } },
  rocket:   { wind: { crouch: 0.6, aF: 0.6, aB: 0.6, eF: 1.0, eB: 1.0 }, hit: { aF: 3.05, aB: 2.95, eF: 0, eB: 0, lF: 0.1, kF: 0.05, lB: -0.1, kB: 0.1, lean: 0 } },
  guard:    { wind: { crouch: 0.2 }, hit: { aF: 1.9, eF: 1.7, aB: 1.7, eB: 1.9, crouch: 0.25, lean: 0.1 } },
  grab:     { wind: { aF: 0.9, eF: 1.3, aB: 0.8, eB: 1.4, lean: -0.05 }, hit: { aF: 1.6, eF: 0.15, aB: 1.45, eB: 0.25, lean: 0.35, lF: 0.5, kF: 0.3, lB: -0.4, kB: 0.25 } },
  glide:    { wind: {}, hit: { aF: 1.7, eF: 0.1, aB: 1.3, eB: 0.1, lean: 0.9, lF: -0.3, kF: 0.4, lB: -0.6, kB: 0.6 } },
};

// Works out a fighter's pose during an attack in three beats:
//   anticipation: ease into the wind-up during startup
//   strike:       whip to the hit pose in 2 frames, overshooting a little
//   follow-through: drift slowly back to the base pose during endlag
function standardAttackPose(m, poseName, f, base) {
  const def = ATTACK_POSES[poseName] || ATTACK_POSES.punch;
  const wind = Object.assign({}, base, def.wind), hit = Object.assign({}, base, def.hit);
  const activeEnd = m.startup + m.active;
  if (f <= m.startup) return blendPose(base, wind, easeOutCubic(f / Math.max(1, m.startup)));
  if (f <= activeEnd) {
    const pose = blendPose(wind, hit, easeOutBack(Math.min(1, (f - m.startup) / 2)));
    if (def.spin) pose.rot = def.spin * Math.PI * 2 * easeOutCubic((f - m.startup) / Math.max(1, m.active));
    return pose;
  }
  return blendPose(hit, base, easeInOutSine(Math.min(1, (f - activeEnd) / Math.max(1, Math.min(m.endlag, 16)))));
}

// Moves the drawn pose a fraction of the way toward the target pose each
// frame, so changing state never snaps. (Rotation is copied directly so
// flips don't spin backwards.)
function smoothPose(cur, target, rate) {
  const out = {};
  for (const k of POSE_KEYS) out[k] = k === 'rot' ? target.rot : lerp(cur[k], target[k], rate);
  return out;
}

// Draw one two-part limb (upper + lower) from (sx, sy). Returns the hand/foot position.
function drawLimb(c, sx, sy, a1, len1, a2, len2, width, color, outline) {
  const jx = sx + Math.sin(a1) * len1, jy = sy + Math.cos(a1) * len1;      // elbow / knee
  const ex = jx + Math.sin(a2) * len2, ey = jy + Math.cos(a2) * len2;      // hand / foot
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(sx, sy); c.lineTo(jx, jy); c.lineTo(ex, ey);
  c.strokeStyle = outline; c.lineWidth = width + 4; c.stroke();            // dark outline
  c.strokeStyle = color; c.lineWidth = width; c.stroke();                  // the limb itself
  return { x: ex, y: ey };
}

// Element-specific decorations drawn on top of (front) or behind (back) the body.
// "b" holds body positions: sh (shoulder), hip, head, headR, H, pal, t.
const FEATURES = {
  flame: {   // flickering flame hair
    front(c, b) {
      const { head, headR: R, t, pal } = b;
      for (let i = 0; i < 4; i++) {
        const bx = head.x - R * 0.75 + i * R * 0.45, by = head.y - R * 0.55;
        const hgt = R * (1.2 + 0.35 * Math.sin(t * 0.3 + i * 1.7)) * (i === 1 || i === 2 ? 1.25 : 0.85);
        c.beginPath();
        c.moveTo(bx - R * 0.32, by + R * 0.3);
        c.quadraticCurveTo(bx - R * 0.45, by - hgt * 0.5, bx - R * 0.55, by - hgt);
        c.quadraticCurveTo(bx + R * 0.3, by - hgt * 0.45, bx + R * 0.32, by + R * 0.3);
        c.closePath();
        const g = c.createLinearGradient(0, by + R * 0.3, 0, by - hgt);
        g.addColorStop(0, pal.body); g.addColorStop(0.5, pal.glow); g.addColorStop(1, pal.light);
        c.fillStyle = g; c.fill();
      }
    },
  },
  wave: {    // a flowing water cape behind, a curling crest of water over the head
    back(c, b) {
      const { sh, hip, H: Hh, pal, t } = b;
      const w1 = Math.sin(t * 0.15) * Hh * 0.06, w2 = Math.sin(t * 0.15 + 1.5) * Hh * 0.06;
      c.beginPath();
      c.moveTo(sh.x, sh.y);
      c.quadraticCurveTo(sh.x - Hh * 0.3, sh.y + Hh * 0.15 + w1, hip.x - Hh * 0.42 + w2, hip.y + Hh * 0.3);
      c.quadraticCurveTo(hip.x - Hh * 0.28, hip.y + Hh * 0.2 + w1, hip.x - Hh * 0.16 + w1, hip.y + Hh * 0.34);
      c.quadraticCurveTo(hip.x - Hh * 0.05, hip.y, sh.x - Hh * 0.04, sh.y + Hh * 0.05);
      c.closePath();
      const g = c.createLinearGradient(0, sh.y, 0, hip.y + Hh * 0.3);
      g.addColorStop(0, rgba(pal.glow, 0.75)); g.addColorStop(1, rgba(pal.light, 0.15));
      c.fillStyle = g; c.fill();
      c.strokeStyle = rgba(pal.light, 0.6); c.lineWidth = 1.5; c.stroke();
    },
    front(c, b) {
      const { head, headR: R, pal, t } = b;
      const s = Math.sin(t * 0.1) * R * 0.08;
      c.beginPath();
      c.moveTo(head.x + R * 0.6, head.y - R * 0.6);
      c.quadraticCurveTo(head.x + R * 0.2, head.y - R * 1.6, head.x - R * 1.0, head.y - R * 1.3 + s);
      c.quadraticCurveTo(head.x - R * 1.9, head.y - R * 1.0, head.x - R * 1.6, head.y - R * 0.2 + s);
      c.quadraticCurveTo(head.x - R * 1.4, head.y - R * 0.8, head.x - R * 0.8, head.y - R * 0.7);
      c.quadraticCurveTo(head.x - R * 0.2, head.y - R * 0.9, head.x + R * 0.6, head.y - R * 0.6);
      const g = c.createLinearGradient(head.x + R, head.y - R * 1.5, head.x - R * 1.8, head.y);
      g.addColorStop(0, pal.light); g.addColorStop(1, pal.glow);
      c.fillStyle = g; c.fill();
      c.strokeStyle = pal.dark; c.lineWidth = 2; c.stroke();
    },
  },
  spikes: {  // jagged lightning hair
    front(c, b) {
      const { head, headR: R, pal, t } = b;
      c.beginPath();
      c.moveTo(head.x + R * 0.7, head.y - R * 0.45);
      c.lineTo(head.x + R * 0.25, head.y - R * 1.75);
      c.lineTo(head.x - R * 0.05, head.y - R * 0.95);
      c.lineTo(head.x - R * 0.7, head.y - R * 1.8);
      c.lineTo(head.x - R * 0.65, head.y - R * 0.85);
      c.lineTo(head.x - R * 1.75, head.y - R * 0.9);
      c.lineTo(head.x - R * 0.9, head.y - R * 0.2);
      c.lineTo(head.x - R * 0.2, head.y - R * 0.6);
      c.closePath();
      c.fillStyle = pal.body; c.fill();
      c.strokeStyle = pal.dark; c.lineWidth = 2.5; c.stroke();
      if (t % 20 < 3) {                                  // an occasional crackle
        c.strokeStyle = pal.light; c.lineWidth = 2;
        c.beginPath(); c.moveTo(head.x - R * 0.7, head.y - R * 1.8); c.lineTo(head.x - R * 1.1, head.y - R * 2.3); c.lineTo(head.x - R * 0.8, head.y - R * 2.6); c.stroke();
      }
    },
  },
  halo: {    // a glowing ring floating above the head
    front(c, b) {
      const { head, headR: R, pal, t } = b;
      const hy = head.y - R * 1.5 + Math.sin(t * 0.08) * 2;
      c.save(); c.globalCompositeOperation = 'lighter';
      c.strokeStyle = rgba(pal.glow, 0.45); c.lineWidth = 8;
      c.beginPath(); c.ellipse(head.x, hy, R * 0.85, R * 0.28, 0, 0, Math.PI * 2); c.stroke();
      c.strokeStyle = pal.glow; c.lineWidth = 3; c.stroke();
      c.restore();
      c.fillStyle = pal.light;                             // a little crest of hair
      c.beginPath(); c.arc(head.x - R * 0.1, head.y - R * 0.45, R * 0.75, Math.PI, Math.PI * 2); c.fill();
    },
  },
  horns: {   // a tattered cape behind, horns on top
    back(c, b) {
      const { sh, hip, H: Hh, pal, t } = b;
      const wave = Math.sin(t * 0.12) * Hh * 0.05;
      c.beginPath();
      c.moveTo(sh.x + Hh * 0.05, sh.y);
      c.quadraticCurveTo(sh.x - Hh * 0.35, sh.y + Hh * 0.2, hip.x - Hh * 0.38 + wave, hip.y + Hh * 0.3);
      c.lineTo(hip.x - Hh * 0.28 + wave, hip.y + Hh * 0.22);
      c.lineTo(hip.x - Hh * 0.2 + wave, hip.y + Hh * 0.33);
      c.lineTo(hip.x - Hh * 0.1, hip.y + Hh * 0.2);
      c.quadraticCurveTo(hip.x - Hh * 0.02, hip.y, sh.x - Hh * 0.05, sh.y);
      c.closePath();
      const g = c.createLinearGradient(0, sh.y, 0, hip.y + Hh * 0.3);
      g.addColorStop(0, pal.dark); g.addColorStop(1, rgba(pal.glow, 0.6));
      c.fillStyle = g; c.fill();
    },
    front(c, b) {
      const { head, headR: R, pal } = b;
      const horn = (x0, dir, scale) => {
        c.beginPath();
        c.moveTo(x0 - R * 0.2, head.y - R * 0.6);
        c.quadraticCurveTo(x0 + dir * R * 0.2, head.y - R * 1.9 * scale, x0 - dir * R * 0.7, head.y - R * 2.0 * scale);
        c.quadraticCurveTo(x0 - dir * R * 0.05, head.y - R * 1.3 * scale, x0 + R * 0.25, head.y - R * 0.55);
        c.closePath();
        c.fillStyle = '#1b0b12'; c.fill();
        c.strokeStyle = pal.eye; c.lineWidth = 1.5; c.stroke();
      };
      horn(head.x - R * 0.45, 1, 0.9);
      horn(head.x + R * 0.45, 1, 1.05);
      // shadow wisps curling up from the shoulders
      const { sh, H: Hh, t } = b;
      c.save();
      c.strokeStyle = rgba(pal.glow, 0.55); c.lineWidth = 3; c.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const ph = t * 0.08 + i * 2.1, bx = sh.x - Hh * 0.12 + i * Hh * 0.1;
        c.beginPath(); c.moveTo(bx, sh.y);
        c.bezierCurveTo(bx + Math.sin(ph) * 10, sh.y - Hh * 0.12, bx - Math.sin(ph + 1) * 12, sh.y - Hh * 0.22,
          bx + Math.sin(ph + 2) * 8, sh.y - Hh * 0.3 - (i % 2) * 6);
        c.stroke();
      }
      c.restore();
    },
  },
};

// Feathered wings (Lumen's recovery) - drawn behind the body.
function drawWings(c, sh, Hh, pal, t) {
  const flap = Math.sin(t * 0.35) * 0.35;
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const side of [-1, 1]) {
    c.save();
    c.translate(sh.x - Hh * 0.05, sh.y + Hh * 0.04);
    c.rotate(-0.6 + side * 0.35 + flap * side);
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(-Hh * 0.35, -Hh * 0.45, -Hh * 0.75, -Hh * 0.35);
    for (let i = 0; i < 4; i++) c.quadraticCurveTo(-Hh * (0.68 - i * 0.16), -Hh * 0.1, -Hh * (0.6 - i * 0.16), Hh * (0.02 + i * 0.03));
    c.closePath();
    c.fillStyle = rgba(pal.light, 0.7); c.fill();
    c.strokeStyle = rgba(pal.glow, 0.9); c.lineWidth = 2; c.stroke();
    c.restore();
  }
  c.restore();
}

// The main fighter drawing function. Draws at feet position (x, y).
// opt: scale, alpha, time, wings, charge (0..60), glow (strike glow on hand/foot),
//      sx/sy (squash & stretch), ghost (cheap version for afterimages)
function drawFighter(c, def, pal, x, y, facing, p, opt = {}) {
  const Hh = def.height;
  const t = opt.time || 0;
  c.save();
  c.translate(x, y);
  // facing mirrors the drawing (and shrinks toward 0 mid-turn for a quick flip);
  // sx/sy squash and stretch the whole body from the feet
  c.scale((opt.scale || 1) * facing * (opt.sx || 1), (opt.scale || 1) * (opt.sy || 1));
  if (opt.alpha !== undefined) c.globalAlpha = opt.alpha;

  // skeleton positions (local coordinates, feet at 0,0, forward = +x)
  const hipY = -Hh * 0.46 * (1 - 0.38 * p.crouch) + p.yOff;
  if (p.rot) { const pivot = hipY - Hh * 0.1; c.translate(0, pivot); c.rotate(p.rot); c.translate(0, -pivot); }
  const hip = { x: 0, y: hipY };
  const torso = Hh * 0.3;
  const sh = { x: Math.sin(p.lean) * torso, y: hipY - Math.cos(p.lean) * torso };
  const head = { x: sh.x + Math.sin(p.lean) * Hh * 0.13, y: sh.y - Math.cos(p.lean) * Hh * 0.13 };
  const headR = Hh * 0.115;
  const legW = Hh * 0.09, armW = Hh * 0.075;
  const thigh = Hh * 0.24, shin = Hh * 0.23, upper = Hh * 0.17, fore = Hh * 0.16;
  const body = { sh, hip, head, headR, H: Hh, pal, t, pose: p };
  const feat = FEATURES[def.feature] || {};

  // 1. glowing elemental aura
  const chest = { x: (sh.x + hip.x) / 2, y: (sh.y + hip.y) / 2 };
  if (!opt.ghost) {
  c.save();
  c.globalCompositeOperation = 'lighter';
  const pulse = 0.22 + Math.sin(t * 0.1) * 0.07 + (opt.auraBoost || 0);
  const ag = c.createRadialGradient(chest.x, chest.y, 0, chest.x, chest.y, Hh * 0.8);
  ag.addColorStop(0, rgba(pal.glow, pulse)); ag.addColorStop(1, rgba(pal.glow, 0));
  c.fillStyle = ag; c.beginPath(); c.arc(chest.x, chest.y, Hh * 0.8, 0, Math.PI * 2); c.fill();
  c.restore();
  }

  // 2. things behind the body
  if (opt.wings) drawWings(c, sh, Hh, pal, t);
  if (feat.back) feat.back(c, body);

  // 3. back arm and leg (darker so they look further away)
  drawLimb(c, hip.x - 2, hip.y, p.lB, thigh, p.lB - p.kB, shin, legW, pal.dark, 'rgba(0,0,0,0.5)');
  drawLimb(c, sh.x, sh.y, p.aB + p.lean, upper, p.aB + p.lean + p.eB, fore, armW, pal.dark, 'rgba(0,0,0,0.5)');

  // 4. torso: a tapered shape from shoulders to hips
  const nx = Math.cos(p.lean), ny = Math.sin(p.lean);
  const sw = Hh * 0.14, hw = Hh * 0.1;
  c.beginPath();
  c.moveTo(sh.x + nx * sw, sh.y + ny * sw); c.lineTo(sh.x - nx * sw, sh.y - ny * sw);
  c.lineTo(hip.x - nx * hw, hip.y - ny * hw); c.lineTo(hip.x + nx * hw, hip.y + ny * hw);
  c.closePath();
  const tg = c.createLinearGradient(sh.x, sh.y, hip.x, hip.y);
  tg.addColorStop(0, pal.light); tg.addColorStop(0.35, pal.body); tg.addColorStop(1, pal.dark);
  c.fillStyle = tg; c.lineJoin = 'round'; c.lineWidth = 3; c.strokeStyle = pal.dark;
  c.fill(); c.stroke();
  // a glowing core on the chest
  c.save(); c.globalCompositeOperation = 'lighter';
  const cg = c.createRadialGradient(chest.x + nx * 2, chest.y - 4, 0, chest.x, chest.y - 4, Hh * 0.08);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(0.4, pal.glow); cg.addColorStop(1, rgba(pal.glow, 0));
  c.fillStyle = cg; c.beginPath(); c.arc(chest.x, chest.y - 4, Hh * 0.08, 0, Math.PI * 2); c.fill();
  c.restore();

  // 5. head with glowing eyes
  const hg = c.createRadialGradient(head.x + headR * 0.3, head.y - headR * 0.4, 1, head.x, head.y, headR);
  hg.addColorStop(0, pal.light); hg.addColorStop(1, pal.body);
  c.fillStyle = hg; c.strokeStyle = pal.dark; c.lineWidth = 3;
  c.beginPath(); c.arc(head.x, head.y, headR, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = pal.eye;
  c.shadowColor = pal.eye; c.shadowBlur = opt.ghost ? 0 : 8;
  c.beginPath(); c.ellipse(head.x + headR * 0.5, head.y - headR * 0.05, headR * 0.13, headR * 0.27, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(head.x + headR * 0.08, head.y - headR * 0.05, headR * 0.11, headR * 0.24, 0, 0, Math.PI * 2); c.fill();
  c.shadowBlur = 0;

  // 6. front leg and arm
  const foot = drawLimb(c, hip.x + 2, hip.y, p.lF, thigh, p.lF - p.kF, shin, legW, pal.body, pal.dark);
  const hand = drawLimb(c, sh.x, sh.y, p.aF + p.lean, upper, p.aF + p.lean + p.eF, fore, armW, pal.body, pal.dark);

  // 7. element decoration on top
  if (feat.front) feat.front(c, body);

  // 8. glows: charging energy, or the striking hand/foot
  c.save(); c.globalCompositeOperation = 'lighter';
  const glowAt = (gx, gy, r) => {
    const gg = c.createRadialGradient(gx, gy, 0, gx, gy, r);
    gg.addColorStop(0, '#ffffff'); gg.addColorStop(0.35, pal.glow); gg.addColorStop(1, rgba(pal.glow, 0));
    c.fillStyle = gg; c.beginPath(); c.arc(gx, gy, r, 0, Math.PI * 2); c.fill();
  };
  if (opt.charge && !opt.ghost) glowAt(hand.x, hand.y, 8 + opt.charge * 0.45 + Math.sin(t * 0.8) * 2);
  if (opt.glow && !opt.ghost) { glowAt(hand.x, hand.y, Hh * 0.2); glowAt(foot.x, foot.y, Hh * 0.16); }
  c.restore();

  c.restore();
}

// White palette used for the one-frame "flash" when a fighter gets hit.
const FLASH_PALETTE = { body: '#ffffff', dark: '#d8d8e8', light: '#ffffff', glow: '#ffffff', eye: '#ffffff', fx: ['#ffffff'] };

// A fighter portrait: the upper body inside a rounded box (or a circle).
function drawPortrait(c, id, pal, x, y, w, h, t, opts = {}) {
  const def = FIGHTERS[id];
  c.save();
  if (opts.circle) { c.beginPath(); c.arc(x + w / 2, y + h / 2, w / 2, 0, Math.PI * 2); }
  else roundRect(c, x, y, w, h, 12);
  c.clip();
  const g = c.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, rgba(pal.glow, 0.6)); g.addColorStop(1, '#120a22');
  c.fillStyle = g; c.fillRect(x, y, w, h);
  const scale = (h * 1.0) / def.height;
  drawFighter(c, def, pal, x + w / 2, y + h * 1.17, 1, POSES.idle(t), { scale, time: t });
  c.restore();
}

// Umbra's shadow tendril: a wavy dark line with a claw on the end.
function drawTendril(c, x1, y1, x2, y2, pal, t) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + Math.sin(t * 0.4) * 16;
  c.save();
  c.lineCap = 'round';
  c.strokeStyle = rgba(pal.glow, 0.5); c.lineWidth = 16;
  c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo(mx, my, x2, y2); c.stroke();
  c.strokeStyle = pal.dark; c.lineWidth = 8; c.stroke();
  c.fillStyle = pal.eye;
  c.beginPath(); c.arc(x2, y2, 7, 0, Math.PI * 2); c.fill();
  c.restore();
}

// Tide's surfing wave (s = size, ox = how far in front of Tide).
function drawWaveCrest(c, me, s = 1, ox = 0) {
  const f = me.moveFrame;
  if (f < 8 || f > 38) return;
  const d = me.facing, x = me.x + me.facing * ox, y = me.y;
  c.save();
  c.translate(x, y); c.scale(s, s); c.translate(-x, -y);
  const g = c.createLinearGradient(x, y - 80, x, y);
  g.addColorStop(0, rgba(me.palette.light, 0.9)); g.addColorStop(1, rgba(me.palette.glow, 0.5));
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(x - d * 60, y);
  c.quadraticCurveTo(x + d * 10, y - 10, x + d * 50, y - 60 - Math.sin(f * 0.4) * 6);
  c.quadraticCurveTo(x + d * 90, y - 80, x + d * 80, y - 40);
  c.quadraticCurveTo(x + d * 70, y - 55, x + d * 60, y);
  c.closePath(); c.fill();
  c.restore();
}

// The floating disc a fighter stands on after respawning.
function drawRespawnPlatform(c, x, y, pal, t) {
  c.save(); c.globalCompositeOperation = 'lighter';
  const g = c.createRadialGradient(x, y + 4, 2, x, y + 4, 70);
  g.addColorStop(0, rgba(pal.glow, 0.8)); g.addColorStop(1, rgba(pal.glow, 0));
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y + 4, 70, 18, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  c.fillStyle = pal.light; c.beginPath(); c.ellipse(x, y + 3, 44, 8, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = pal.glow; c.lineWidth = 2; c.beginPath(); c.ellipse(x, y + 3, 44 + Math.sin(t * 0.2) * 3, 9, 0, 0, Math.PI * 2); c.stroke();
}

/* =======================================================================
   8. FIGHTER CLASS
   -----------------------------------------------------------------------
   One Fighter object per player. Each frame update() runs:
     1. read input  2. run the current STATE  3. physics  4. ledges/KOs
   A "state machine" keeps things simple: the fighter is always in exactly
   one state, and each state decides what is allowed.
     idle, walk, crouch   on the ground, can do anything
     jumpsquat            the few frames before leaving the ground
     landing              short lag after landing
     air                  airborne and free to act
     attack               doing a move (this.move)
     charging             holding attack to power up a charged attack
     hitstun              just got hit, can't act
     shield, dodge        defending
     helpless             after an up special, can only drift
     ledge, ledgeclimb    hanging on / climbing up the ledge
     shieldbreak          dizzy after the shield breaks
     trapped, grabbed     caught by a bubble or a shadow grab
     respawn, dead, out   lost a stock / out of stocks
   ======================================================================= */

class Fighter {
  constructor(match, index, fighterId, useAltColors) {
    this.match = match;
    this.index = index;                    // 0 = P1, 1 = P2 (also picks the binding map)
    this.id = fighterId;
    this.def = FIGHTERS[fighterId];
    this.palette = useAltColors ? this.def.altColors : this.def.colors;
    // single-colour version used for afterimages
    const pal = this.palette;
    this.ghostPalette = { body: pal.glow, dark: pal.glow, light: pal.light, glow: pal.glow, eye: pal.light, fx: pal.fx };
    this.halfW = this.def.width / 2;
    this.stocks = START_STOCKS;
    this.percent = 0;
    this.stats = { kos: 0, damageDealt: 0, falls: 0 };
    this.x = 0; this.y = 0; this.facing = 1;
    this.resetForSpawn();
  }

  // Clear everything about movement and state (used on spawn/respawn).
  resetForSpawn() {
    this.vx = 0; this.vy = 0;              // own movement speed
    this.kbx = 0; this.kby = 0;            // knockback ("launch") speed, fades over time
    this.grounded = false; this.platform = null;
    this.state = 'air'; this.stateTimer = 0;
    this.move = null; this.moveName = ''; this.moveFrame = 0; this.moveData = {};
    this.hitSet = new Map();               // who this move already hit
    this.airJumps = this.def.airJumps;
    this.fastFalling = false; this.usedSideSpecial = false; this.usedAirDodge = false;
    this.coyote = 0;                       // frames left to still jump after walking off an edge
    this.jumpCutAllowed = false;           // true while rising from a ground jump (short hop check)
    this.hitlag = 0; this.hitstun = 0; this.invuln = 0;
    this.intangible = false; this.invisible = false; this.noGravity = false;
    this.shieldHP = MAX_SHIELD; this.shieldStun = 0;
    this.ledge = null; this.ledgeCooldown = 0; this.dropTimer = 0; this.crouchTimer = 0;
    this.slowTimer = 0; this.slowAcc = 0; this.trapTimer = 0;
    this.grabbedBy = null; this.grabbing = null; this.counterDmg = 0;
    this.attackBuf = 0; this.specialBuf = 0; this.jumpBuf = 0; this.shieldBuf = 0; this.grabBuf = 0;
    this.attackHold = 0;                   // frames the attack button has been held
    this.chargeMove = ''; this.chargeFrames = 0; this.chargeMult = 1; this.chargeFlash = 0;
    this.pendingDI = false;
    this.lastHitBy = null; this.hudShake = 0; this.hudPop = 0; this.hitFlash = 0; this.animTime = 0;
    this.dodgeType = ''; this.dodgeDir = 0;
    // animation-only values (they never change the gameplay)
    this.visFacing = this.facing || 1;     // smoothly turns toward this.facing
    this.squash = 0; this.squashVel = 0;   // squash & stretch spring (+ = squashed, - = stretched)
    this.flipTimer = 0;                    // double jump flip
    this.runPhase = 0; this.tumble = 0;
    this.trail = [];                       // afterimages
    this.animPose = null;                  // the pose actually drawn (eased toward the target pose)
    this.inp = NO_INPUT;
    Sound.stopCharge(this);
  }

  spawnAt(x, y, facing) {
    this.x = x; this.y = y - 1; this.facing = facing; this.visFacing = facing;
    this.state = 'air';
  }

  get opponent() { return this.match.fighters.find(f => f !== this); }

  // Crouching and low attacks make the hurtbox shorter.
  curHeight() {
    const h = this.def.height;
    if (this.state === 'crouch') return h * 0.62;
    if (this.state === 'attack' && this.move && this.move.pose === 'sweep') return h * 0.72;
    return h;
  }
  // The rectangle that can be hit.
  hurtbox() {
    const h = this.curHeight();
    return { x: this.x - this.halfW, y: this.y - h, w: this.def.width, h };
  }
  canBeHit() {
    if (this.intangible || this.invuln > 0) return false;
    return !['dead', 'out', 'respawn', 'ledgeclimb'].includes(this.state);
  }
  isCountering() {
    const m = this.move;
    return this.state === 'attack' && m && m.counter && this.moveFrame >= m.counter.start && this.moveFrame <= m.counter.end;
  }
  // The world rectangle of a reflector (Lumen's mirror), or null.
  reflectorRect() {
    const m = this.move;
    if (this.state !== 'attack' || !m || !m.reflector) return null;
    const r = m.reflector;
    if (this.moveFrame < r.start || this.moveFrame > r.end) return null;
    return { x: this.x + r.x * this.facing - r.w / 2, y: this.y + r.y - r.h / 2, w: r.w, h: r.h };
  }
  // All hitboxes that are active this frame, converted to world rectangles.
  activeHitboxes() {
    if (this.state !== 'attack' || !this.move) return [];
    const out = [], f = this.moveFrame;
    for (const hb of this.move.hitboxes) {
      if (f < hb.start || f > hb.end) continue;
      out.push({ hb, rect: { x: this.x + hb.x * this.facing - hb.w / 2, y: this.y + hb.y - hb.h / 2, w: hb.w, h: hb.h } });
    }
    return out;
  }

  // ---------------------------------------------------------------- UPDATE
  update() {
    // Local games read this player's binding map (CONTROLS). Online games
    // hand the match both players' inputs for this frame (see section 12).
    const inp = this.match.phase === 'countdown' ? NO_INPUT : this.match.inputFor(this.index);
    this.inp = inp;
    this.updateBuffers(inp);
    if (this.hudShake > 0) this.hudShake--;
    if (this.hudPop > 0) this.hudPop--;
    if (this.hitFlash > 0) this.hitFlash--;
    if (this.chargeSound && this.state !== 'charging') Sound.stopCharge(this);   // lost the charge somehow

    if (this.state === 'out') return;
    if (this.state === 'dead') { if (--this.stateTimer <= 0) this.respawn(); return; }
    if (this.hitlag > 0) { this.hitlag--; return; }          // hitstop: frozen on impact
    if (this.pendingDI) this.applyDI(inp);                   // the launch starts now: bend it
    if (this.slowTimer > 0) {                                 // Lumen's flash: skip half the frames
      this.slowTimer--;
      this.slowAcc += 0.5;
      if (this.slowAcc < 1) return;
      this.slowAcc -= 1;
    }

    this.animTime++;
    this.intangible = false; this.invisible = false; this.noGravity = false;   // moves turn these on each frame
    if (this.invuln > 0) this.invuln--;
    if (this.ledgeCooldown > 0) this.ledgeCooldown--;
    if (this.dropTimer > 0) this.dropTimer--;
    if (this.coyote > 0) this.coyote--;
    if (this.state !== 'shield' && this.state !== 'shieldbreak') this.shieldHP = Math.min(MAX_SHIELD, this.shieldHP + 0.1);

    let physics = true;
    switch (this.state) {
      case 'idle': case 'walk': case 'crouch': this.updateGround(inp); break;
      case 'jumpsquat': this.updateJumpsquat(inp); break;
      case 'landing':
        this.vx = approach(this.vx, 0, this.def.walkSpeed / TUNING.groundStopFrames);
        if (--this.stateTimer <= 0) this.state = 'idle';
        break;
      case 'air': this.updateAir(inp); break;
      case 'attack': this.updateAttack(inp); break;
      case 'charging': this.updateCharging(inp); break;
      case 'hitstun': this.updateHitstun(inp); break;
      case 'shield': this.updateShield(inp); break;
      case 'dodge': this.updateDodge(inp); break;
      case 'helpless':
        this.airDrift(inp, 0.7);
        this.checkFastFall(inp);
        break;
      case 'shieldbreak':
        this.vx = approach(this.vx, 0, 0.5);
        if (--this.stateTimer <= 0) this.state = this.grounded ? 'idle' : 'air';
        break;
      case 'trapped': this.updateTrapped(inp); break;
      case 'ledge': this.updateLedge(inp); physics = false; break;     // these states skip physics
      case 'ledgeclimb': this.updateLedgeClimb(); physics = false; break;
      case 'grabbed': this.updateGrabbed(inp); physics = false; break;
      case 'respawn': this.updateRespawn(inp); physics = false; break;
    }
    if (this.state === 'dead' || this.state === 'out') return;
    if (physics) {
      this.physics();
      this.checkLedgeGrab();
      this.checkBlastZones();
      this.emitAura();
    }
    this.animate();
  }

  // Remember presses for a few frames so slightly-early inputs still work.
  updateBuffers(inp) {
    const tick = this.hitlag > 0 ? 0 : 1;          // buffers don't run out during hitstop
    const B = TUNING.inputBufferFrames;
    // While attack is still held we don't know yet if it's a tap or a charge,
    // so the buffered press is kept alive until the button is released.
    if (inp.attackP) this.attackBuf = B;
    else if (!(inp.attack && this.attackBuf > 0)) this.attackBuf = Math.max(0, this.attackBuf - tick);
    this.attackHold = inp.attack ? this.attackHold + 1 : 0;
    this.specialBuf = inp.specialP ? B : Math.max(0, this.specialBuf - tick);
    this.grabBuf = inp.grabP ? B : Math.max(0, this.grabBuf - tick);
    this.shieldBuf = inp.shieldP ? B : Math.max(0, this.shieldBuf - tick);
    this.jumpBuf = inp.jumpP ? TUNING.jumpBufferFrames : Math.max(0, this.jumpBuf - tick);
  }

  // ---------------------------------------------------------- GROUND STATES
  updateGround(inp) {
    // pressing down on a thin platform drops straight through it
    if (inp.downP && this.platform && !this.platform.solid && !this.attackBuf && !this.specialBuf) {
      this.dropThrough();
      return;
    }
    if (this.tryGroundAction(inp)) return;
    const dirX = dirOf(inp);
    const accel = this.def.walkSpeed / TUNING.groundAccelFrames;   // full speed in ~6 frames
    const stop = this.def.walkSpeed / TUNING.groundStopFrames;     // stop in ~4 frames
    if (inp.down) {                                  // crouch
      this.state = 'crouch';
      this.vx = approach(this.vx, 0, stop);
      return;
    }
    if (dirX !== 0) {
      this.facing = dirX;
      const turning = this.vx * dirX < 0;            // braking from the other direction is quicker
      this.vx = approach(this.vx, dirX * this.def.walkSpeed, turning ? stop : accel);
      this.state = 'walk';
    } else {
      this.vx = approach(this.vx, 0, stop);
      this.state = Math.abs(this.vx) > 0.6 ? 'walk' : 'idle';
    }
  }

  // Check buttons while standing. Returns true if something started.
  tryGroundAction(inp) {
    const dirX = dirOf(inp);
    if (this.grabBuf) { this.grabBuf = 0; this.startMove('grab'); return true; }
    if (this.attackBuf) {
      // Tap (released before CHARGE_HOLD_FRAMES) = normal attack; hold = charge.
      const stillDeciding = inp.attack && this.attackHold < CHARGE_HOLD_FRAMES;
      if (!stillDeciding) {
        this.attackBuf = 0;
        if (inp.attack) this.startCharge(inp); else this.groundAttack(inp, dirX);
        return true;
      }
    }
    if (this.specialBuf) {
      this.specialBuf = 0;
      if (this.doSpecial(inp, dirX)) return true;
    }
    if ((inp.shield || this.shieldBuf) && this.shieldHP > 0) {
      const tapped = this.shieldBuf > 0;
      this.shieldBuf = 0;
      if (tapped && dirX) { this.startDodge('roll', dirX); return true; }          // shield + direction = roll
      if (tapped && (inp.down || !inp.shield)) { this.startDodge('spot', 0); return true; }   // down, or a super-quick tap
      this.state = 'shield'; this.stateTimer = 0;
      return true;
    }
    if (this.jumpBuf) { this.jumpBuf = 0; this.state = 'jumpsquat'; this.stateTimer = 0; return true; }
    return false;
  }

  groundAttack(inp, dirX) {
    if (inp.up) this.startMove('utilt');
    else if (inp.down) this.startMove('dtilt');
    else if (dirX) { this.facing = dirX; this.startMove('ftilt'); }
    else this.startMove('jab1');
  }

  airAttack(inp, dirX) {
    if (inp.up) this.startMove('uair');
    else if (inp.down) this.startMove('dair');
    else if (dirX === this.facing) this.startMove('fair');
    else if (dirX === -this.facing) this.startMove('bair');
    else this.startMove('nair');
  }

  // Specials work the same on the ground and in the air.
  doSpecial(inp, dirX) {
    let name = 'nspecial';
    if (inp.up) name = 'uspecial';
    else if (inp.down) name = 'dspecial';
    else if (dirX) name = 'sspecial';
    const m = this.def.moves[name];
    if (name === 'sspecial') {
      if (!this.grounded && m.oncePerAir && this.usedSideSpecial) return false;   // only once per trip in the air
      this.facing = dirX;
      if (!this.grounded) this.usedSideSpecial = true;
    }
    if (name === 'uspecial' && dirX) this.facing = dirX;
    this.startMove(name);
    return true;
  }

  // A short crouch before leaving the ground (attacks pressed now stay buffered
  // and come out as aerials right after take-off).
  updateJumpsquat(inp) {
    this.stateTimer++;
    this.vx = approach(this.vx, 0, 0.3);
    if (this.stateTimer >= TUNING.jumpSquatFrames) this.groundJump(inp);
  }

  // Leave the ground. Releasing jump while still rising cuts the jump short.
  groundJump(inp) {
    this.vy = -this.def.jumpPower;
    this.vx = clamp(this.vx + dirOf(inp) * 1.5, -this.def.airSpeed, this.def.airSpeed);
    this.grounded = false; this.platform = null;
    this.state = 'air';
    this.coyote = 0;
    this.jumpCutAllowed = true;
    this.squash = -0.28;                           // stretch on take-off
    Sound.play('jump');
    spawnDust(this.x, this.y, 5);
  }

  dropThrough() {
    this.grounded = false; this.platform = null;
    this.dropTimer = 14;                             // ignore thin platforms for a moment
    this.y += 2; this.vy = 1.5;
    this.state = 'air'; this.crouchTimer = 0; this.coyote = 0;
  }

  // ------------------------------------------------------------- AIR STATES
  updateAir(inp) {
    const dirX = dirOf(inp);
    if (this.attackBuf) { this.attackBuf = 0; this.airAttack(inp, dirX); return; }   // aerials come out instantly
    if (this.grabBuf) { this.grabBuf = 0; this.airAttack(inp, dirX); return; }       // no grabs in the air: Grab = aerial
    if (this.specialBuf) {
      this.specialBuf = 0;
      if (this.doSpecial(inp, dirX)) return;
    }
    if (this.shieldBuf && !this.usedAirDodge) {
      this.shieldBuf = 0;
      this.startDodge('air', dirX, inp.up ? -1 : inp.down ? 1 : 0);
      return;
    }
    if (this.jumpBuf) {
      if (this.coyote > 0) { this.jumpBuf = 0; this.groundJump(inp); return; }    // coyote time: still a ground jump
      if (this.airJumps > 0) { this.jumpBuf = 0; this.doubleJump(dirX); return; }
    }
    this.airDrift(inp, 1);
    this.checkFastFall(inp);
  }

  doubleJump(dirX) {
    this.airJumps--;
    this.vy = -this.def.doubleJumpPower;           // always a full reset of vertical speed
    this.vx = dirX * this.def.airSpeed;
    this.kbx *= 0.5; this.kby = 0;
    this.fastFalling = false; this.jumpCutAllowed = false;
    this.flipTimer = 22;                           // play the flip animation
    this.squash = -0.22;
    Sound.play('djump');
    fx(this, 16, 4, 0, 0, { angle: Math.PI / 2, spread: 1.2 });     // element burst under the feet
    spawnParticle({ x: this.x, y: this.y, life: 18, size: 10, grow: 34, color: this.palette.light, shape: 'ring', drag: 1 });
  }

  // Steer in the air toward the held direction.
  airDrift(inp, mult) {
    const dirX = dirOf(inp), max = this.def.airSpeed * mult;
    const accel = this.def.airSpeed / TUNING.airAccelFrames;
    if (dirX) this.vx = approach(this.vx, dirX * max, this.vx * dirX < 0 ? accel * 1.5 : accel);
    else this.vx = approach(this.vx, 0, this.def.airSpeed / TUNING.airStopFrames);
  }

  // Tap down at the peak of a jump or while falling to fall much faster.
  checkFastFall(inp) {
    if (inp.downP && !this.fastFalling && !this.grounded && this.vy > -3) {
      this.fastFalling = true;
      this.vy = this.def.fastFall;
      this.squash = -0.18;
      spawnParticle({ x: this.x, y: this.y - this.def.height / 2, life: 10, size: 6, grow: 20, color: '#ffffff', shape: 'ring', drag: 1 });
    }
  }

  // ---------------------------------------------------------------- ATTACKS
  startMove(name) {
    const m = this.def.moves[name];
    if (!m) { console.warn('Missing move ' + name + ' on ' + this.id); return; }
    this.move = m; this.moveName = name; this.moveFrame = 0;
    this.moveData = {};                   // scratch space for move scripts
    this.hitSet.clear();
    this.state = 'attack';
    this.crouchTimer = 0;
    this.visFacing = this.facing;         // attacks always face the right way instantly
    if (m.onStart) m.onStart(this);
  }

  updateAttack(inp) {
    const m = this.move;
    this.moveFrame++;
    const f = this.moveFrame;
    // default movement: slide to a stop on the ground, steering in the air
    if (this.grounded) this.vx = approach(this.vx, 0, this.def.walkSpeed / TUNING.groundStopFrames * 0.5);
