// A menu of buttons that works with both the keyboard and the mouse.
class Menu {
  constructor(items, opts = {}) {
    this.items = items;                  // [{ label, x, y, w, h, action }]
    this.index = 0;
    this.horizontal = !!opts.horizontal;
  }
  update() {
    const n = this.items.length;
    const prev = this.horizontal ? menuPressed('left') : menuPressed('up');
    const next = this.horizontal ? menuPressed('right') : menuPressed('down');
    if (prev) { this.index = (this.index - 1 + n) % n; Sound.play('menuMove'); }
    if (next) { this.index = (this.index + 1) % n; Sound.play('menuMove'); }
    for (let i = 0; i < n; i++) {
      if (!pointInRect(Mouse, this.items[i])) continue;
      if (Mouse.moved && this.index !== i) { this.index = i; Sound.play('menuMove'); }
      if (Mouse.clicked) { this.index = i; this.activate(); return; }
    }
    if (menuPressed('confirm')) this.activate();
  }
  activate() { Sound.play('menuSelect'); this.items[this.index].action(); }
  draw(c) { this.items.forEach((it, i) => drawButton(c, it, i === this.index)); }
}

function drawButton(c, b, selected) {
  c.save();
  roundRect(c, b.x, b.y, b.w, b.h, 14);
  const g = c.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  g.addColorStop(0, selected ? '#ffb347' : '#3a2f5c');
  g.addColorStop(1, selected ? '#ff5e3a' : '#221a3a');
  c.fillStyle = g; c.fill();
  if (selected) { c.shadowColor = '#ffb347'; c.shadowBlur = 18 + Math.sin(Game.time * 0.15) * 8; }
  c.lineWidth = 3; c.strokeStyle = selected ? '#ffffff' : 'rgba(255,255,255,0.25)'; c.stroke();
  c.shadowBlur = 0;
  drawText(c, b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, { size: b.size || 24, color: selected ? '#2a0f1a' : '#e8e0ff' });
  c.restore();
}

// The mute button lives in the top-right corner of every screen.
const MUTE_BUTTON = { x: 1222, y: 14, w: 44, h: 44 };
function drawMuteButton(c) {
  const b = MUTE_BUTTON, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const hover = pointInRect(Mouse, b);
  c.save();
  c.fillStyle = hover ? 'rgba(255,255,255,0.25)' : 'rgba(0,0,0,0.45)';
  c.beginPath(); c.arc(cx, cy, 22, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = '#ffffff';
  c.beginPath();                                     // speaker shape
  c.moveTo(cx - 11, cy - 5); c.lineTo(cx - 5, cy - 5); c.lineTo(cx + 2, cy - 11);
  c.lineTo(cx + 2, cy + 11); c.lineTo(cx - 5, cy + 5); c.lineTo(cx - 11, cy + 5);
  c.closePath(); c.fill();
  c.strokeStyle = '#ffffff'; c.lineWidth = 2.5; c.lineCap = 'round';
  if (Sound.muted) {
    c.strokeStyle = '#ff5b5b';
    c.beginPath(); c.moveTo(cx + 6, cy - 6); c.lineTo(cx + 14, cy + 6); c.moveTo(cx + 14, cy - 6); c.lineTo(cx + 6, cy + 6); c.stroke();
  } else {
    c.beginPath(); c.arc(cx + 3, cy, 6, -0.9, 0.9); c.stroke();
    c.beginPath(); c.arc(cx + 3, cy, 11, -0.9, 0.9); c.stroke();
  }
  c.restore();
}

// Shared animated background for the menu screens.
function updateMenuParticles() {
  if (Game.time % 2 === 0) {
    const el = ELEMENT_LIST[Math.floor(Math.random() * 5)];
    emitElement(el, ELEMENT_COLORS[el], rand(0, W), H + 10, 1, 1.2, { angle: -Math.PI / 2, spread: 0.4, vy: -1.4, lifeMul: 5, sizeMul: 1.4 });
  }
  updateParticles();
}
function drawMenuBackground(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0620'); g.addColorStop(0.6, '#1f0d3a'); g.addColorStop(1, '#3d1446');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // slowly rotating rings of elemental light
  c.save(); c.globalCompositeOperation = 'lighter';
  ELEMENT_LIST.forEach((el, i) => {
    const a = Game.time * 0.003 + i * (Math.PI * 2 / 5);
    const x = W / 2 + Math.cos(a) * 420, y = H / 2 + Math.sin(a) * 220;
    const rg = c.createRadialGradient(x, y, 0, x, y, 260);
    rg.addColorStop(0, rgba(ELEMENT_COLORS[el][2], 0.18)); rg.addColorStop(1, rgba(ELEMENT_COLORS[el][2], 0));
    c.fillStyle = rg; c.fillRect(x - 260, y - 260, 520, 520);
  });
  c.restore();
  drawParticles(c);
}

function drawTitle(c, y, size) {
  const t = Game.time;
  c.save();
  c.font = 'normal ' + size + 'px ' + TITLE_FONT;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  const text = 'ELEMENTAL CLASH';
  const w = c.measureText(text).width;
  const off = Math.sin(t * 0.01) * 120;
  const g = c.createLinearGradient(W / 2 - w / 2 + off, 0, W / 2 + w / 2 + off, 0);
  ['#ff7b00', '#3fd8ff', '#ffd60a', '#fff2b0', '#b44dff'].forEach((col, i) => g.addColorStop(i / 4, col));
  c.lineJoin = 'round';
  c.lineWidth = 14; c.strokeStyle = '#140826'; c.strokeText(text, W / 2, y);
  c.shadowColor = '#ffb347'; c.shadowBlur = 30 + Math.sin(t * 0.05) * 10;
  c.fillStyle = g; c.fillText(text, W / 2, y);
  c.shadowBlur = 0;
  c.restore();
}

// The game object: which screen is showing, and the players' choices.
const Game = {
  screen: 'home',
  time: 0,
  sel: { p1: 'pyro', p2: 'tide', stage: 0 },
  match: null,
  lastResult: null,
  toastText: '', toastTimer: 0,
  // A short message that floats at the bottom of the screen for a few seconds.
  toast(text) { this.toastText = text; this.toastTimer = 300; },
  setScreen(name, opts) {
    this.screen = name;
    clearParticles();
    const s = SCREENS[name];
    if (s.enter) s.enter(opts);
  },
};

const SCREENS = {};

// ------------------------------------------------------------------ HOME
SCREENS.home = {
  enter() {
    this.menu = new Menu([
      { label: 'PLAY', x: 490, y: 296, w: 300, h: 60, size: 28, action: () => Game.setScreen('charSelect') },
      { label: 'PLAY ONLINE', x: 490, y: 368, w: 300, h: 60, size: 28, action: () => Game.setScreen('online') },
      { label: 'CONTROLS', x: 490, y: 440, w: 300, h: 60, size: 28, action: () => Game.setScreen('controls') },
      { label: 'CREDITS', x: 490, y: 512, w: 300, h: 60, size: 28, action: () => Game.setScreen('credits') },
    ]);
  },
  update() { updateMenuParticles(); this.menu.update(); },
  draw(c) {
    drawMenuBackground(c);
    // the five fighters line up along the bottom
    FIGHTER_ORDER.forEach((id, i) => {
      const def = FIGHTERS[id];
      const x = [140, 330, 950, 1140, 640][i], y = 712, facing = x < 640 ? 1 : -1;
      if (i === 4) return;
      drawFighter(c, def, def.colors, x, y, facing, POSES.idle(Game.time + i * 20), { scale: 1.6, time: Game.time + i * 20 });
    });
    const u = FIGHTERS[FIGHTER_ORDER[4]];
    drawFighter(c, u, u.colors, 1040, 712, -1, POSES.idle(Game.time + 90), { scale: 1.25, time: Game.time + 90, alpha: 0.9 });
    drawTitle(c, 150, 104);
    drawText(c, 'FIVE ELEMENTS  ·  ONE SHRINE  ·  NO MERCY', W / 2, 232, { size: 22, color: '#d8c8ff', weight: 'bold' });
    this.menu.draw(c);
    drawText(c, 'W/S or ↑/↓ to choose  ·  Enter / Space or click to select  ·  M to mute', W / 2, 600, { size: 16, weight: 'normal', color: '#b7a8dc' });
  },
};

// -------------------------------------------------------------- CONTROLS
// Shows every action for both players. Click (or select + Enter) an action,
// then press any key or mouse button to bind it. Esc cancels.
SCREENS.controls = {
  enter(opts = {}) {
    this.from = opts.from || 'home';     // the screen to go back to ('pause' = the paused match)
    if (this.from === 'onlineLobby') Net.setReady(false);   // can't be "ready" while rebinding
    this.listening = null;               // { p, action } while waiting for a key
    this.msg = ''; this.msgTimer = 0; this.msgWarn = false;
    this.sel = { col: 0, row: 0 };       // keyboard cursor: rows 0-7 actions, 8 reset, 9 back
  },
  rowRect(p, i) { return { x: p === 0 ? 150 : 670, y: 136 + i * 40, w: 460, h: 35 }; },
  resetRect(p) { return { x: (p === 0 ? 150 : 670) + 120, y: 502, w: 220, h: 40 }; },
  backRect: { x: 520, y: 642, w: 240, h: 50 },
  setMsg(text) { this.msg = text; this.msgTimer = 240; this.msgWarn = text.startsWith('Warning'); },
  leave() {
    Sound.play('back');
    if (this.from === 'pause' && Game.match) Game.setScreen('fight', { resume: true });
    else Game.setScreen(this.from === 'pause' ? 'home' : this.from);
  },
  activate(col, row) {
    if (row < ACTIONS.length) { this.listening = { p: col, action: ACTIONS[row] }; Sound.play('menuSelect'); }
    else if (row === ACTIONS.length) { resetControls(col); Sound.play('menuSelect'); this.setMsg('Player ' + (col + 1) + ' controls reset to default'); }
    else this.leave();
  },
  update() {
    updateMenuParticles();
    if (this.msgTimer > 0) this.msgTimer--;
    if (this.listening) {
      // the next key or mouse button pressed becomes the new binding
      const code = Object.keys(Input.pressed)[0];
      if (!code) return;
      if (code === 'Escape') { this.listening = null; this.setMsg('Cancelled'); Sound.play('back'); return; }
      this.setMsg(rebind(this.listening.p, this.listening.action, code));
      this.listening = null;
      Mouse.clicked = false;             // this click was a binding, not a button press
      Sound.play('lock');
      return;
    }
    if (menuPressed('back')) { this.leave(); return; }
    const rows = ACTIONS.length + 2;
    if (menuPressed('up')) { this.sel.row = (this.sel.row - 1 + rows) % rows; Sound.play('menuMove'); }
    if (menuPressed('down')) { this.sel.row = (this.sel.row + 1) % rows; Sound.play('menuMove'); }
    if (menuPressed('left') || menuPressed('right')) { this.sel.col = 1 - this.sel.col; Sound.play('menuMove'); }
    // mouse
    for (let p = 0; p < 2; p++) {
      for (let i = 0; i <= ACTIONS.length; i++) {
        const r = i < ACTIONS.length ? this.rowRect(p, i) : this.resetRect(p);
        if (!pointInRect(Mouse, r)) continue;
        if (Mouse.moved) this.sel = { col: p, row: i };
        if (Mouse.clicked) { this.sel = { col: p, row: i }; this.activate(p, i); return; }
      }
    }
    if (pointInRect(Mouse, this.backRect)) {
      if (Mouse.moved) this.sel.row = ACTIONS.length + 1;
      if (Mouse.clicked) { this.leave(); return; }
    }
    if (menuPressed('confirm')) this.activate(this.sel.col, this.sel.row);
  },
  draw(c) {
    drawMenuBackground(c);
    drawText(c, 'CONTROLS', W / 2, 52, { size: 60, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    drawText(c, 'Click an action (or select it and press Enter), then press any key or mouse button. Esc cancels.',
      W / 2, 92, { size: 16, weight: 'normal', color: '#d8c8ff' });
    for (let p = 0; p < 2; p++) {
      const col = PLAYER_COLORS[p], hx = p === 0 ? 380 : 900;
      drawText(c, 'PLAYER ' + (p + 1), hx, 118, { size: 22, color: col });
      ACTIONS.forEach((a, i) => {
        const r = this.rowRect(p, i);
        const selected = this.sel.row === i && this.sel.col === p;
        const listening = this.listening && this.listening.p === p && this.listening.action === a;
        c.save();
        roundRect(c, r.x, r.y, r.w, r.h, 10);
        c.fillStyle = listening ? rgba(col, 0.45) : selected ? 'rgba(255,255,255,0.16)' : 'rgba(10,6,25,0.72)';
        c.fill();
        c.lineWidth = selected || listening ? 3 : 1.5;
        c.strokeStyle = selected || listening ? col : 'rgba(255,255,255,0.18)';
        c.stroke();
        c.restore();
        drawText(c, ACTION_LABELS[a], r.x + 16, r.y + r.h / 2, { size: 18, align: 'left', weight: 'normal', color: '#e8e0ff' });
        const label = listening ? (Math.floor(Game.time / 20) % 2 ? 'Press any key...' : '') : keyName(CONTROLS[p][a]);
        drawText(c, label, r.x + r.w - 16, r.y + r.h / 2, { size: 19, align: 'right', color: listening ? '#ffffff' : (p === 0 ? '#ffd3d3' : '#d3e6ff') });
      });
      drawButton(c, Object.assign({ label: 'RESET TO DEFAULT', size: 17 }, this.resetRect(p)), this.sel.row === ACTIONS.length && this.sel.col === p);
    }
    if (this.from.startsWith('online') && this.msgTimer <= 0) {
      drawText(c, 'Online matches use your PLAYER 1 controls (left column).', W / 2, 566, { size: 18, color: PLAYER_COLORS[0], stroke: 3 });
    }
    if (this.msgTimer > 0) {
      c.globalAlpha = Math.min(1, this.msgTimer / 30);
      drawText(c, this.msg, W / 2, 566, { size: 18, color: this.msgWarn ? '#ffb347' : '#7dff9a', stroke: 3 });
      c.globalAlpha = 1;
    }
    drawText(c, 'Up + Attack = up attack  ·  Up + Special = recovery  ·  Grab, then a direction = throw (Attack = pummel)',
      W / 2, 596, { size: 15, weight: 'normal', color: '#c9bde6' });
    drawText(c, 'Hold Attack to charge   ·   Tap Shield to dodge (direction = movement keys), hold it to shield   ·   Esc = pause   ·   M = mute',
      W / 2, 618, { size: 15, weight: 'normal', color: '#c9bde6' });
    drawButton(c, Object.assign({ label: this.from === 'pause' ? '◀ BACK TO FIGHT' : '◀ BACK', size: 20 }, this.backRect),
      this.sel.row === ACTIONS.length + 1);
  },
};

// ------------------------------------------------------ CHARACTER SELECT
// Grid slots 0-4 are fighters, slot 5 is the BACK tile.
const CS = { boxW: 150, boxH: 150, gap: 20, top: 104 };
CS.left = W / 2 - (FIGHTER_ORDER.length * CS.boxW + (FIGHTER_ORDER.length - 1) * CS.gap) / 2;
const BACK_SLOT = FIGHTER_ORDER.length;
const backTileRect = () => ({ x: 40, y: 30, w: 130, h: 46 });
const slotRect = i => ({ x: CS.left + i * (CS.boxW + CS.gap), y: CS.top, w: CS.boxW, h: CS.boxH });
const readyRect = { x: 340, y: 470, w: 600, h: 90 };
const controlsTileRect = { x: 1040, y: 30, w: 170, h: 46 };

SCREENS.charSelect = {
  enter() {
    this.cursor = [Math.max(0, FIGHTER_ORDER.indexOf(Game.sel.p1)), Math.max(0, FIGHTER_ORDER.indexOf(Game.sel.p2))];
    this.lastCol = this.cursor.slice();
    this.locked = [false, false];
    this.readyTimer = 0;
  },
  // Which fighter is player p looking at (Back tile shows the last fighter)?
  hovered(p) { return FIGHTER_ORDER[this.cursor[p] === BACK_SLOT ? this.lastCol[p] : this.cursor[p]]; },
  paletteFor(p) {
    const def = FIGHTERS[this.hovered(p)];
    return p === 1 && this.hovered(0) === this.hovered(1) ? def.altColors : def.colors;
  },
  goBack() { Sound.play('back'); Game.setScreen('home'); },
  lock(p) {
    this.locked[p] = true;
    Sound.play('lock');
    const def = FIGHTERS[this.hovered(p)];
    const r = slotRect(this.cursor[p]);
    emitElement(def.element, def.colors.fx, r.x + r.w / 2, r.y + r.h / 2, 40, 7);
  },
  update() {
    updateMenuParticles();
    if (Input.wasPressed('Escape')) { this.goBack(); return; }
    const n = FIGHTER_ORDER.length;
    // keyboard presses from the player's own bindings (mouse buttons are handled below)
    const key = code => !isMouseCode(code) && Input.wasPressed(code);
    for (let p = 0; p < 2; p++) {
      const k = CONTROLS[p];
      if (this.locked[p]) {
        if (Input.wasPressed(k.special) || Input.wasPressed(k.shield)) { this.locked[p] = false; this.readyTimer = 0; Sound.play('back'); }
        continue;
      }
      const cur = this.cursor[p];
      if (cur !== BACK_SLOT) {
        if (key(k.left)) { this.cursor[p] = (cur - 1 + n) % n; Sound.play('menuMove'); }
        if (key(k.right)) { this.cursor[p] = (cur + 1) % n; Sound.play('menuMove'); }
        if (key(k.up)) { this.lastCol[p] = this.cursor[p]; this.cursor[p] = BACK_SLOT; Sound.play('menuMove'); }
      } else if (key(k.down) || key(k.left) || key(k.right)) {
        this.cursor[p] = this.lastCol[p]; Sound.play('menuMove');
      }
      if (this.cursor[p] !== BACK_SLOT) this.lastCol[p] = this.cursor[p];
      if (key(k.attack) || key(k.jump)) {               // lock in with attack or jump
        if (this.cursor[p] === BACK_SLOT) { this.goBack(); return; }
        this.lock(p);
      }
    }
    // mouse: click a portrait to lock in the first player who hasn't chosen yet
    if (Mouse.clicked) {
      if (pointInRect(Mouse, backTileRect())) { this.goBack(); return; }
      if (pointInRect(Mouse, controlsTileRect)) { Sound.play('menuSelect'); Game.setScreen('controls', { from: 'charSelect' }); return; }
      for (let i = 0; i < n; i++) {
        if (!pointInRect(Mouse, slotRect(i))) continue;
        const p = !this.locked[0] ? 0 : !this.locked[1] ? 1 : -1;
        if (p >= 0) { this.cursor[p] = i; this.lastCol[p] = i; this.lock(p); }
      }
    }
    if (this.locked[0] && this.locked[1]) {
      this.readyTimer++;
      const go = this.readyTimer > 10 && (Input.anyPressed(['Enter', 'NumpadEnter', 'Space']) ||
        CONTROLS.some(k => key(k.attack) || key(k.jump)) || (Mouse.clicked && pointInRect(Mouse, readyRect)));
      if (go) {
        Game.sel.p1 = this.hovered(0);
        Game.sel.p2 = this.hovered(1);
        Sound.play('menuSelect');
        Game.setScreen('stageSelect');
      }
    }
  },
  draw(c) {
    drawMenuBackground(c);
    drawText(c, 'CHOOSE YOUR FIGHTERS', W / 2, 60, { size: 54, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    // back tile
    const br = backTileRect();
    const backHover = this.cursor.includes(BACK_SLOT) || pointInRect(Mouse, br);
    drawButton(c, Object.assign({ label: '◀ BACK', size: 20 }, br), backHover);
    if (this.cursor[0] === BACK_SLOT) drawText(c, 'P1', br.x + br.w + 18, br.y + 14, { size: 14, color: PLAYER_COLORS[0], stroke: 3 });
    if (this.cursor[1] === BACK_SLOT) drawText(c, 'P2', br.x + br.w + 18, br.y + 34, { size: 14, color: PLAYER_COLORS[1], stroke: 3 });
    drawButton(c, Object.assign({ label: '⚙ CONTROLS', size: 18 }, controlsTileRect), pointInRect(Mouse, controlsTileRect));

    // the grid of portraits
    FIGHTER_ORDER.forEach((id, i) => {
      const r = slotRect(i), def = FIGHTERS[id];
      const hover = pointInRect(Mouse, r);
      drawPortrait(c, id, def.colors, r.x, r.y, r.w, r.h, Game.time + i * 17);
      c.save();
      roundRect(c, r.x, r.y, r.w, r.h, 12);
      c.lineWidth = hover ? 4 : 2; c.strokeStyle = hover ? '#ffffff' : 'rgba(255,255,255,0.3)'; c.stroke();
      c.restore();
      c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(r.x + 4, r.y + r.h - 30, r.w - 8, 26);
      drawText(c, def.name, r.x + r.w / 2, r.y + r.h - 17, { size: 18, color: def.colors.light });
    });
    // the two player cursors
    for (let p = 0; p < 2; p++) {
      if (this.cursor[p] === BACK_SLOT) continue;
      const r = slotRect(this.cursor[p]), inset = p === 0 ? -6 : 3, col = PLAYER_COLORS[p];
      c.save();
      roundRect(c, r.x + inset, r.y + inset, r.w - inset * 2, r.h - inset * 2, 14);
      c.lineWidth = 5; c.strokeStyle = col;
      c.shadowColor = col; c.shadowBlur = 14 + Math.sin(Game.time * 0.2) * 6;
      c.stroke();
      c.restore();
      const tagX = p === 0 ? r.x + 4 : r.x + r.w - 40;
      roundRect(c, tagX, r.y - 16, 36, 24, 6); c.fillStyle = col; c.fill();
      drawText(c, 'P' + (p + 1), tagX + 18, r.y - 4, { size: 15, color: '#fff' });
      if (this.locked[p]) {
        c.fillStyle = rgba(col, 0.82);
        c.fillRect(r.x + 4, r.y + (p === 0 ? 46 : 82), r.w - 8, 28);
        drawText(c, 'P' + (p + 1) + ' READY', r.x + r.w / 2, r.y + (p === 0 ? 60 : 96), { size: 16, color: '#fff' });
      }
    }
    // the two preview panels
    for (let p = 0; p < 2; p++) this.drawPanel(c, p, p === 0 ? 30 : 650, 290);

    const hint = p => { const k = CONTROLS[p]; return 'P' + (p + 1) + ': ' + keyName(k.left) + '/' + keyName(k.right) + ' choose · ' + keyName(k.attack) + ' or ' + keyName(k.jump) + ' lock in · ' + keyName(k.special) + ' cancel'; };
    drawText(c, hint(0) + '      ' + hint(1) + '      ' + keyName(CONTROLS[0].up) + ' / ' + keyName(CONTROLS[1].up) + ' = Back · Esc = Home',
      W / 2, 704, { size: 14, weight: 'normal', color: '#b7a8dc' });

    if (this.locked[0] && this.locked[1]) {           // both ready: big banner
      const r = readyRect;
      c.save();
      roundRect(c, r.x, r.y, r.w, r.h, 18);
      const g = c.createLinearGradient(r.x, 0, r.x + r.w, 0);
      g.addColorStop(0, PLAYER_COLORS[0]); g.addColorStop(1, PLAYER_COLORS[1]);
      c.fillStyle = g; c.shadowColor = '#fff'; c.shadowBlur = 20 + Math.sin(Game.time * 0.15) * 10; c.fill();
      c.restore();
      drawText(c, 'READY TO FIGHT!', W / 2, r.y + 34, { size: 40, font: TITLE_FONT, weight: 'normal', color: '#fff', stroke: 6, strokeColor: '#2a0f40' });
      drawText(c, 'Press Enter / Space (or click) to continue', W / 2, r.y + 70, { size: 18, color: '#fff' });
    }
  },
  drawPanel(c, p, x, y) {
    const id = this.hovered(p), def = FIGHTERS[id], pal = this.paletteFor(p), col = PLAYER_COLORS[p];
    const w = 600, h = 400;
    c.save();
    roundRect(c, x, y, w, h, 18);
    const g = c.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, rgba(pal.glow, 0.28)); g.addColorStop(1, 'rgba(10,6,25,0.85)');
    c.fillStyle = g; c.fill();
    c.lineWidth = 3; c.strokeStyle = col; c.stroke();
    c.restore();
    drawText(c, 'PLAYER ' + (p + 1), x + 20, y + 24, { size: 16, align: 'left', color: col });
    // the fighter, animated (victory pose once locked in)
    const t = Game.time + p * 40;
    const pose = this.locked[p] ? POSES.victory(t) : POSES.idle(t);
    drawFighter(c, def, pal, x + 130, y + 340, 1, pose, { scale: 2.3, time: t, auraBoost: this.locked[p] ? 0.15 : 0 });
    if (this.locked[p] && !this.noSparks && Game.time % 3 === 0) emitElement(def.element, pal.fx, x + 130 + rand(-60, 60), y + 340 - rand(0, 200), 1, 1.5);
    // name, element and description
    drawText(c, def.name, x + 260, y + 70, { size: 52, align: 'left', font: TITLE_FONT, weight: 'normal', color: pal.light, stroke: 6, strokeColor: '#140826' });
    c.font = 'bold 16px ' + FONT;
    const tag = def.elementName.toUpperCase() + ' ELEMENT';
    const tw = c.measureText(tag).width + 24;
    roundRect(c, x + 262, y + 98, tw, 26, 13); c.fillStyle = pal.glow; c.fill();
    drawText(c, tag, x + 262 + tw / 2, y + 112, { size: 16, color: '#1a0b2a' });
    c.font = 'normal 17px ' + FONT;
    wrapText(c, def.desc, 310).forEach((line, i) => drawText(c, line, x + 262, y + 152 + i * 22, { size: 17, align: 'left', weight: 'normal', color: '#e8e0ff' }));
    // stat bars
    const statNames = [['SPEED', 'speed'], ['POWER', 'power'], ['WEIGHT', 'weight'], ['JUMP', 'jump']];
    statNames.forEach(([label, key], i) => {
      const sy = y + 240 + i * 34;
      drawText(c, label, x + 262, sy, { size: 15, align: 'left', color: '#b7a8dc' });
      for (let s = 0; s < 10; s++) {
        const filled = s < def.stats[key];
        c.fillStyle = filled ? pal.glow : 'rgba(255,255,255,0.12)';
        roundRect(c, x + 350 + s * 22, sy - 8, 18, 16, 4); c.fill();
      }
    });
    if (this.locked[p]) drawText(c, 'LOCKED IN!', x + w - 20, y + 24, { size: 18, align: 'right', color: '#7dff9a' });
  },
};

// ---------------------------------------------------------- STAGE SELECT
// Cards are built from STAGES, so new stages show up automatically.
SCREENS.stageSelect = {
  enter() {
    this.index = clamp(Game.sel.stage || 0, 0, STAGES.length - 1);
    const gap = 30, n = STAGES.length;
    const cardW = Math.min(440, (W - 80 - (n - 1) * gap) / n), total = n * cardW + (n - 1) * gap;
    this.cards = STAGES.map((s, i) => ({ x: W / 2 - total / 2 + i * (cardW + gap), y: 160, w: cardW, h: Math.round(cardW * 0.59) }));
    this.backBtn = { label: '◀ BACK', x: 540, y: 620, w: 200, h: 56 };
  },
  start() { Game.sel.stage = this.index; Sound.play('menuSelect'); Game.setScreen('fight'); },
  back() { Sound.play('back'); Game.setScreen('charSelect'); },
  update() {
    updateMenuParticles();
    if (menuPressed('back')) { this.back(); return; }
    const n = STAGES.length;                        // index n = the Back button
    if (menuPressed('left') && this.index < n) { this.index = (this.index - 1 + n) % n; Sound.play('menuMove'); }
    if (menuPressed('right') && this.index < n) { this.index = (this.index + 1) % n; Sound.play('menuMove'); }
    if (menuPressed('down') && this.index < n) { this.lastIndex = this.index; this.index = n; Sound.play('menuMove'); }
    if (menuPressed('up') && this.index === n) { this.index = this.lastIndex || 0; Sound.play('menuMove'); }
    this.cards.forEach((r, i) => {
      if (!pointInRect(Mouse, r)) return;
      if (Mouse.moved) this.index = i;
      if (Mouse.clicked) { this.index = i; this.start(); }
    });
    if (Game.screen !== 'stageSelect') return;
    if (pointInRect(Mouse, this.backBtn)) { if (Mouse.moved) this.index = n; if (Mouse.clicked) { this.back(); return; } }
    if (menuPressed('confirm')) { if (this.index === n) this.back(); else this.start(); }
  },
  draw(c) {
    drawMenuBackground(c);
    drawText(c, 'SELECT A STAGE', W / 2, 70, { size: 58, font: TITLE_FONT, weight: 'normal', color: '#ffe27a', stroke: 8, strokeColor: '#2a0f40' });
    STAGES.forEach((s, i) => {
      const r = this.cards[i], sel = i === this.index;
      renderStageView(c, s, r.x, r.y, r.w, r.h, Game.time);
      c.save();
      roundRect(c, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 14);
      c.lineWidth = sel ? 5 : 2; c.strokeStyle = sel ? '#ffb347' : 'rgba(255,255,255,0.3)';
      if (sel) { c.shadowColor = '#ffb347'; c.shadowBlur = 20; }
      c.stroke();
      c.restore();
      drawText(c, s.name.toUpperCase(), r.x + r.w / 2, r.y + r.h + 36, { size: 28, color: sel ? '#ffe27a' : '#ffffff', font: TITLE_FONT, weight: 'normal' });
      c.font = 'normal 17px ' + FONT;
      wrapText(c, s.desc, r.w).forEach((line, k) => drawText(c, line, r.x + r.w / 2, r.y + r.h + 70 + k * 22, { size: 17, weight: 'normal', color: '#d8c8ff' }));
    });
    const sf = Game.sel;
    drawText(c, FIGHTERS[sf.p1].name + '  vs  ' + FIGHTERS[sf.p2].name, W / 2, 124, { size: 22, color: '#ffffff' });
    drawButton(c, this.backBtn, this.index === STAGES.length);
    drawText(c, 'A/D or ←/→ to choose  ·  Enter / Space or click to fight  ·  Esc = back', W / 2, 700, { size: 16, weight: 'normal', color: '#b7a8dc' });
  },
};

// ----------------------------------------------------------------- FIGHT

      drawPortrait(c, pl.id, pl.palette, cx - 40, ty + 70, 80, 80, this.t, { circle: true });
      c.beginPath(); c.arc(cx, ty + 110, 40, 0, Math.PI * 2); c.lineWidth = 3; c.strokeStyle = PLAYER_COLORS[i]; c.stroke();
      drawText(c, 'P' + (i + 1) + '  ' + pl.name, cx, ty + 176, { size: 18, color: PLAYER_COLORS[i] });
      const vals = [pl.stats.kos, Math.round(pl.stats.damageDealt) + '%', pl.stats.falls, pl.stocks];

/* =======================================================================
   12. ONLINE MULTIPLAYER
   -----------------------------------------------------------------------
   ROOMS: PeerJS (a small library loaded at the top of the page) connects
   two browsers directly with WebRTC. The host's "peer ID" is made from
   the room code, so a friend can find the host just by typing the code.
   PeerJS's free public server only introduces the two browsers - after
   that, game messages go straight from one computer to the other.

   ROLLBACK: both computers run the SAME match code with the SAME button
   presses, so both games stay identical. Every frame you send your
   buttons to your rival. Your own buttons work straight away; for the
   rival's buttons that haven't arrived yet, the game GUESSES (they're
   probably still holding what they held last) and keeps going, so it
   never has to freeze and wait. Before each frame it saves a copy of
   the whole match. When the rival's real buttons arrive and the guess
   was wrong, it jumps back ("rolls back") to the saved copy and quickly
   re-plays the frames since then with the right buttons - usually only
   1-3 frames, so you barely notice.

   The host is always Player 1 (red), the friend who joins is Player 2.
   Online, both players use their own PLAYER 1 controls.
   ======================================================================= */

const NET_ROOM_PREFIX = 'elemental-clash-room-';            // + the room code = the host's peer ID
const NET_VERSION = 2;                                      // both players need the same game version
const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';    // no O/0 or I/1 - they look alike
const CODE_LENGTH = 5;
const NET_TIMEOUT_MS = 10000;                               // nothing heard for this long = connection lost
const NET_CONNECT_TIMEOUT_MS = 15000;                       // give up joining after this long
const MAX_PREDICT = 12;           // never guess more than this many frames ahead (then wait for the rival)

function makeRoomCode() {
  let code = '';
  for (let i = 0; i < CODE_LENGTH; i++) code += CODE_LETTERS[Math.floor(Math.random() * CODE_LETTERS.length)];
  return code;
}

// Your buttons are packed into ONE number to send over the network:
// bits 0-15 = held (one bit per action in ACTIONS), bits 16-31 = pressed this frame.
const HELD_BITS = 0xffff;
function readLocalBits() {
  const k = CONTROLS[0];
  let bits = 0;
  ACTIONS.forEach((a, i) => {
    if (Input.isDown(k[a])) bits |= 1 << i;
    if (Input.wasPressed(k[a])) bits |= 1 << (i + 16);
  });
  return bits;
}
// ...and unpacked into the same kind of object readPlayerInput() makes.
function decodeInput(bits) {
  const inp = {};
  ACTIONS.forEach((a, i) => {
    inp[a] = (bits & (1 << i)) !== 0;
    inp[a + 'P'] = (bits & (1 << (i + 16))) !== 0;
  });
  return inp;
}

// ---------------------------------------------------------------------
// SAVING A COPY OF THE MATCH (for rollback)
// cloneMatch() copies the match, its fighters, projectiles, effects and
// everything inside them. Things that never change during a fight -
// fighter data, moves, stages - are shared, not copied (that's STATIC).
// ---------------------------------------------------------------------
const STATIC = new WeakSet();
(function markStatic(v) {
  if (v === null || typeof v !== 'object' || STATIC.has(v)) return;
  STATIC.add(v);
  for (const k of Object.keys(v)) markStatic(v[k]);
})([FIGHTERS, STAGES, PROJECTILE_KINDS, NO_INPUT]);
const CLONE_CLASSES = new Set([Object.getPrototypeOf({}), Match.prototype, Fighter.prototype, Projectile.prototype]);   // {} = plain objects

function cloneMatch(match) {
  const copies = new Map();                          // original -> copy (keeps links between objects right)
  function copy(v) {
    if (v === null || typeof v !== 'object' || STATIC.has(v)) return v;   // numbers, text, functions, data
    if (copies.has(v)) return copies.get(v);
    let out;
    if (Array.isArray(v)) {
      out = new Array(v.length); copies.set(v, out);
      for (let i = 0; i < v.length; i++) out[i] = copy(v[i]);
      return out;
    }
    if (v instanceof Map) {
      out = new Map(); copies.set(v, out);
      for (const [k, x] of v) out.set(copy(k), copy(x));
      return out;
    }
    const proto = Object.getPrototypeOf(v);
    if (!CLONE_CLASSES.has(proto)) return v;          // sounds, menus...: share
    out = Object.create(proto); copies.set(v, out);
    for (const k of Object.keys(v)) out[k] = copy(v[k]);
    return out;
  }
  return copy(match);
}

// A short summary of a match, compared between the two computers.
function matchChecksum(match) {
  const fs = match.fighters.map(f => [f.x, f.y, f.vx, f.vy, f.kbx, f.kby, f.percent, f.stocks, f.state, f.moveName, f.moveFrame].join(','));
  const ps = match.projectiles.map(p => [p.kind, p.x, p.y].join(','));
  return fs.join('|') + '#' + ps.join('|') + '#' + match.timer;
}

const Net = {
  peer: null, conn: null, inputConn: null,
  isHost: false,
  code: '',
  peerOpen: false,          // true once the room exists on the PeerJS server
  connected: false,         // true once the two players are linked
  status: '',               // message shown on the create/join screens
  connectStart: 0, lastHeard: 0, timer: null,
  rtt: 0,                   // ping: time for a message to go there and back (ms)
  rttSamples: [],           // the last few pings
  me: { fighter: 'pyro', ready: false },
  them: { fighter: 'tide', ready: false },
  stage: 0,
  matchId: 0, delay: 2,
  // rollback state (see tick)
  frame: 0,                 // the next frame to run
  confirmed: 0,             // every frame before this one used the rival's REAL buttons
  sendFrame: 0,             // the next frame we send our buttons for
  localInputs: {}, remoteInputs: {}, usedRemote: {}, snapshots: {}, sumAt: {}, early: {},
  remoteMax: 0, lastRemoteBits: 0, remoteFrame: 0, remoteAhead: 0, aheadAvg: 0, rollbackFrom: Infinity,
  latch: 0, stall: 0, tickCount: 0, rollbacks: 0,
  sums: {}, sumEvery: 60, desync: false, menuOpen: false,

  get localIndex() { return this.isHost ? 0 : 1; },
  available() { return typeof Peer !== 'undefined'; },

  // ------------------------------------------------ CREATE / JOIN A ROOM
  // Two connections are opened between the players:
  //   'control' - lobby messages, in order (reliable)
  //   'input'   - button presses. Delivered even if a packet is lost, but
  //               NOT held back waiting for an older lost one, so a hiccup
  //               doesn't hold up newer button presses.
  host() {
    this.shutdown();
    this.isHost = true;
    this.code = makeRoomCode();
    this.status = 'Creating room...';
    const peer = this.peer = new Peer(NET_ROOM_PREFIX + this.code);
    peer.on('open', () => { if (peer === this.peer) { this.peerOpen = true; this.status = 'Waiting for your friend to join...'; } });
    peer.on('connection', conn => {
      if (peer !== this.peer) return;
      const full = conn.label === 'input' ? (this.inputConn || !this.conn || this.conn.peer !== conn.peer) : this.conn;
      if (full) { conn.on('open', () => conn.close()); return; }   // room is full
      if (conn.label === 'input') this.setupInputConnection(conn);
      else this.setupConnection(conn);
    });
    peer.on('error', err => { if (peer === this.peer) this.onPeerError(err); });
  },

  join(code) {
    this.shutdown();
    this.isHost = false;
    this.code = code;
    this.status = 'Connecting to room ' + code + '...';
    this.connectStart = performance.now();
    const peer = this.peer = new Peer();
    peer.on('open', () => {
      if (peer !== this.peer) return;
      this.peerOpen = true;
      this.setupConnection(peer.connect(NET_ROOM_PREFIX + code, { label: 'control', reliable: true, serialization: 'json' }));
    });
    peer.on('error', err => { if (peer === this.peer) this.onPeerError(err); });
    this.startTimer();
  },

  setupConnection(conn) {
    this.conn = conn;
    conn.on('open', () => {
      if (conn !== this.conn) return;
      this.connected = true;
      this.lastHeard = performance.now();
      this.me.ready = this.them.ready = false;
      this.rttSamples = [];
      this.send({ t: 'hello', v: NET_VERSION });
      this.send({ t: 'ping', ts: performance.now() });   // measure the ping straight away
      // the guest opens the second (button presses) connection once the first one works
      if (!this.isHost && this.peer) {
        this.setupInputConnection(this.peer.connect(NET_ROOM_PREFIX + this.code, { label: 'input', reliable: false, serialization: 'json' }));
      }
      this.startTimer();
      Sound.play('lock');
      Game.setScreen('onlineLobby');
    });
    conn.on('data', msg => { if (conn === this.conn) this.receive(msg); });
    conn.on('iceStateChanged', state => {           // the two computers couldn't reach each other
      if (conn === this.conn && !this.connected && state === 'failed') {
        this.fail("Couldn't connect to your friend's computer. Try again, or try another network.");
      }
    });
    conn.on('close', () => { if (conn === this.conn) this.lost('Your rival left the room.'); });
    conn.on('error', () => { if (conn === this.conn) this.lost('The connection to your rival broke.'); });
  },
  // If the input connection fails, button presses just go through 'control' instead.
  setupInputConnection(conn) {
    this.inputConn = conn;
    conn.on('data', msg => { if (conn === this.inputConn) this.receive(msg); });
    conn.on('close', () => { if (conn === this.inputConn) this.inputConn = null; });
    conn.on('error', () => { if (conn === this.inputConn) this.inputConn = null; });
  },

  onPeerError(err) {
    if (err.type === 'unavailable-id' && this.isHost && !this.connected) { this.host(); return; }   // code taken: pick another
    if (this.connected) return;      // we already talk directly, so a server hiccup doesn't matter now
    const messages = {
      'peer-unavailable': 'No room with that code. Check it and try again.',
      'network': "Can't reach the online server. Check your internet connection.",
      'server-error': "Can't reach the online server. Try again in a moment.",
      'socket-error': "Can't reach the online server. Check your internet connection.",
      'socket-closed': 'Lost contact with the online server.',
      'browser-incompatible': 'This browser does not support online play. Try Chrome, Edge or Firefox.',
    };
    this.fail(messages[err.type] || 'Connection error (' + err.type + ').');
  },

  // Pings once a second, and notices when the other side has gone quiet.
  // (A timer, not the game loop, so it keeps running if this tab is in the background.)
  startTimer() {
    if (this.timer) return;
    this.timer = setInterval(() => {
      const now = performance.now();
      if (this.connected) {
        this.sendFast({ t: 'ping', ts: now });
        if (now - this.lastHeard > NET_TIMEOUT_MS) this.lost('Lost the connection to your rival.');
      } else if (!this.isHost && this.peer && now - this.connectStart > NET_CONNECT_TIMEOUT_MS) {
        this.fail("Couldn't connect to that room. Check the code and try again.");
      }
    }, 1000);
  },

  send(msg) {
    if (this.conn && this.conn.open) {
      try { this.conn.send(msg); } catch (err) { /* the connection is closing */ }
    }
  },
  // Button presses, pings and checksums use the faster 'input' connection when it's open.
  sendFast(msg) {
    if (this.inputConn && this.inputConn.open) {
      try { this.inputConn.send(msg); return; } catch (err) { /* fall back to control */ }
    }
    this.send(msg);
  },

  // Close everything and forget the room.
  shutdown() {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    const conns = [this.conn, this.inputConn], peer = this.peer;
    this.conn = null; this.inputConn = null; this.peer = null;   // set first, so their 'close' events are ignored
    this.connected = false; this.peerOpen = false;
    this.me.ready = this.them.ready = false;
    this.menuOpen = false;
    for (const c of conns) { try { if (c) c.close(); } catch (err) { /* already closed */ } }
    try { if (peer) peer.destroy(); } catch (err) { /* already gone */ }
  },
  // Couldn't create or join: stay on the same screen and say why.
  fail(message) { this.shutdown(); this.status = message; Sound.play('back'); },
  // Lost the rival after connecting: back to the online menu.
  lost(message) {
    if (!this.peer) return;
    this.shutdown();
    Game.setScreen('online');
    Game.toast(message);
    Sound.play('back');
  },
  // We chose to leave.
  leave() {
    this.send({ t: 'bye' });
    this.shutdown();
    Game.setScreen('online');
  },

  // ------------------------------------------------------- MESSAGES
  receive(msg) {
    if (!msg || typeof msg !== 'object') return;
    this.lastHeard = performance.now();
    switch (msg.t) {
      case 'hello':
        if (msg.v !== NET_VERSION) {
          this.lost('You and your rival have different versions (you: v' + NET_VERSION + ', rival: v' + (msg.v || 1) + '). Both press Ctrl+F5 to reload.');
          return;
        }
        this.sendLobby();
        break;
      case 'lobby':                                   // the rival changed fighter / readiness (host: also stage)
        if (FIGHTERS[msg.fighter]) this.them.fighter = msg.fighter;
        this.them.ready = !!msg.ready;
        if (!this.isHost && STAGES[msg.stage]) this.stage = msg.stage;
        this.tryStart();
        break;
      case 'start': if (!this.isHost) this.beginMatch(msg); break;
      case 'in':                                      // the rival's buttons for frame msg.f
        if (msg.m === this.matchId) this.takeRemoteInput(msg);
        else if (msg.m > this.matchId) (this.early[msg.m] = this.early[msg.m] || []).push(msg);   // arrived before 'start'
        break;
      case 'sum': if (msg.m === this.matchId) this.recordSum(msg.f, msg.s, 'theirs'); break;
      case 'ping': this.sendFast({ t: 'pong', ts: msg.ts }); break;
      case 'pong':
        this.rtt = performance.now() - msg.ts;
        this.rttSamples.push(this.rtt);
        if (this.rttSamples.length > 5) this.rttSamples.shift();
        break;
      case 'bye': this.lost('Your rival left the room.'); break;
    }
  },

  // ---------------------------------------------------------- LOBBY
  sendLobby() { this.send({ t: 'lobby', fighter: this.me.fighter, ready: this.me.ready, stage: this.stage }); },
  setReady(ready) {
    if (this.me.ready === ready) return;
    this.me.ready = ready;
    this.sendLobby();
    this.tryStart();
  },
  // The host starts the match as soon as both players are ready.
  tryStart() {
    if (!this.isHost || !this.connected || !this.me.ready || !this.them.ready || Game.screen !== 'onlineLobby') return;
    // A small input delay (1-4 frames) means fewer, smaller rollbacks;
    // rollback hides the rest of the travel time.
    const ping = this.rttSamples.length ? this.rttSamples.reduce((a, b) => a + b) / this.rttSamples.length : this.rtt;
    const delay = clamp(Math.ceil(ping / 2 / STEP) - 1, 1, 4);
    const msg = { t: 'start', m: this.matchId + 1, p1: this.me.fighter, p2: this.them.fighter, stage: this.stage, delay };
    this.send(msg);
    this.beginMatch(msg);
  },
  beginMatch(msg) {
    this.matchId = msg.m;
    this.delay = msg.delay;
    this.me.ready = this.them.ready = false;
    Game.sel = { p1: msg.p1, p2: msg.p2, stage: msg.stage };
    // the first "delay" frames have no buttons pressed on either side
    this.localInputs = {}; this.remoteInputs = {}; this.usedRemote = {}; this.snapshots = {}; this.sumAt = {};
    for (let f = 0; f < this.delay; f++) this.localInputs[f] = this.remoteInputs[f] = 0;
    this.frame = 0; this.confirmed = 0; this.sendFrame = this.delay;
    this.remoteMax = this.delay - 1; this.lastRemoteBits = 0; this.remoteFrame = 0; this.remoteAhead = 0; this.aheadAvg = 0; this.rollbackFrom = Infinity;
    this.latch = 0; this.stall = 0; this.tickCount = 0; this.rollbacks = 0;
    this.sums = {}; this.desync = false; this.menuOpen = false;
    Game.setScreen('onlineFight');
    const early = this.early[msg.m] || [];
    this.early = {};
    for (const m of early) this.takeRemoteInput(m);
  },

  // The rival's buttons for one frame arrived.
  takeRemoteInput(msg) {
    const f = msg.f;
    this.remoteFrame = Math.max(this.remoteFrame, msg.cf);          // where their game was when they sent it
    if (f < this.confirmed || this.remoteInputs[f] !== undefined) return;
    this.remoteInputs[f] = msg.b;
    if (f > this.remoteMax) { this.remoteMax = f; this.lastRemoteBits = msg.b; this.remoteAhead = msg.ahead || 0; }
    // Did we already run that frame with a wrong guess? Then roll back to it.
    const used = this.usedRemote[f];
    if (used !== undefined && used !== msg.b) this.rollbackFrom = Math.min(this.rollbackFrom, f);
  },

  // ------------------------------------------------------- ROLLBACK
  // Run frame f: save a copy first, then update with the best buttons we have.
  // "quiet" = re-playing an old frame (no sounds or particles again).
  runFrame(quiet) {
    const f = this.frame;
    this.snapshots[f] = cloneMatch(Game.match);
    const mine = this.localInputs[f];
    // the rival's real buttons if we have them, otherwise guess: still holding
    // what they held last time (but not pressing anything new)
    const theirs = this.remoteInputs[f] !== undefined ? this.remoteInputs[f] : this.lastRemoteBits & HELD_BITS;
    this.usedRemote[f] = theirs;
    const p1 = this.isHost ? mine : theirs, p2 = this.isHost ? theirs : mine;
    Game.match.inputs = [decodeInput(p1), decodeInput(p2)];
    replaying = quiet;
    Game.match.update();
    replaying = false;
    this.frame++;
    if (this.frame % this.sumEvery === 0) this.sumAt[this.frame] = matchChecksum(Game.match);
  },

  // A guess was wrong: go back to the copy saved before that frame and re-play.
  rollback() {
    const from = this.rollbackFrom, to = this.frame;
    this.rollbackFrom = Infinity;
    if (from >= to || !this.snapshots[from]) return;
    for (const f of Game.match.fighters) Sound.stopCharge(f);
    Game.match = this.snapshots[from];
    for (const f of Game.match.fighters) f.chargeSound = null;
    this.frame = from;
    while (this.frame < to) this.runFrame(true);
    for (const f of Game.match.fighters) if (f.state === 'charging') Sound.startCharge(f);
    this.rollbacks++;
  },

  // Frames where we now know both players' real buttons are final: forget their copies.
  confirmFrames() {
    while (this.confirmed < this.frame && this.remoteInputs[this.confirmed] !== undefined) {
      const f = this.confirmed;
      delete this.snapshots[f]; delete this.localInputs[f]; delete this.remoteInputs[f]; delete this.usedRemote[f];
      this.confirmed++;
      const s = this.sumAt[this.confirmed];
      if (s !== undefined) {
        delete this.sumAt[this.confirmed];
        this.sendFast({ t: 'sum', m: this.matchId, f: this.confirmed, s });
        this.recordSum(this.confirmed, s, 'mine');
      }
    }
  },

  // Send my buttons for every frame up to "delay" frames ahead.
  sendInputs() {
    while (this.sendFrame <= this.frame + this.delay) {
      const bits = this.menuOpen ? 0 : (readLocalBits() & HELD_BITS) | this.latch;
      this.latch = 0;
      this.localInputs[this.sendFrame] = bits;
      this.sendFast({ t: 'in', m: this.matchId, f: this.sendFrame, b: bits, cf: this.frame, ahead: this.frame - this.remoteFrame });
      this.sendFrame++;
    }
  },

  // Called once per game update while an online match is on screen.
  tick() {
    this.tickCount++;
    // remember presses until they are sent, so a quick tap is never lost
    if (!this.menuOpen) this.latch |= readLocalBits() & ~HELD_BITS;
    if (this.rollbackFrom < this.frame) this.rollback();
    this.confirmFrames();
    const match = Game.match;
    if (match.over) {                                 // match finished: show results once it's final
      if (this.confirmed >= this.frame) { Game.lastResult = match.result; Game.setScreen('results'); }
      return;
    }
    // Stay in step: both games say how far ahead of the other they seem to be
    // (message travel time makes both numbers too big by the same amount, so
    // half the difference is the real gap). The one that's ahead skips a frame
    // now and then so the other can catch up.
    const ahead = ((this.frame - this.remoteFrame) - this.remoteAhead) / 2;
    this.aheadAvg += (ahead - this.aheadAvg) * 0.05;  // smoothed, so random message wobble doesn't count
    if (this.aheadAvg > 1 && this.tickCount % 4 === 0) return;
    if (this.frame - this.confirmed >= MAX_PREDICT) { this.stall++; return; }   // too far ahead of what we know
    this.sendInputs();
    this.runFrame(false);
    this.stall = 0;
  },

  // Once a second (of confirmed frames) both games compare a summary of the
  // match. They should always match; if not, the two games drifted apart.
  recordSum(frame, s, whose) {
    const entry = this.sums[frame] || (this.sums[frame] = {});
    entry[whose] = s;
    if (entry.mine === undefined || entry.theirs === undefined) return;
    if (entry.mine !== entry.theirs && !this.desync) {
      this.desync = true;
      console.warn('Online match out of sync at frame ' + frame, entry);
    }
    delete this.sums[frame];
  },
};

/* =======================================================================
   13. MAIN LOOP  - fixed time step
   -----------------------------------------------------------------------
   The browser calls frame() about 60 times a second (or more on fast
   monitors). We add up the real time that passed and run update() once
   for every 1/60th of a second, so the game runs at the same speed on
   every computer. Drawing happens once per browser frame.
   ======================================================================= */

function update() {
  Game.time++;
  // global hotkeys (skipped while rebinding, or if a player bound that key)
  const rebinding = (Game.screen === 'controls' && SCREENS.controls.listening) || Game.screen === 'onlineJoin';
  if (!rebinding) {
    if (Input.wasPressed('Backquote') && !isBound('Backquote')) DEBUG = !DEBUG;
    if (Input.wasPressed('KeyM') && !isBound('KeyM')) Sound.toggleMute();
    if (Mouse.clicked && pointInRect(Mouse, MUTE_BUTTON)) { Sound.toggleMute(); Mouse.clicked = false; delete Input.pressed.Mouse0; }
  }
  SCREENS[Game.screen].update();
  if (Game.toastTimer > 0) Game.toastTimer--;
  Input.endFrame();
  Mouse.clicked = false;
  Mouse.moved = false;
}

let fps = 60, fpsFrames = 0, fpsTime = 0;
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  SCREENS[Game.screen].draw(ctx);
  drawMuteButton(ctx);
  if (Game.toastTimer > 0) {                       // toast message at the bottom
    ctx.globalAlpha = Math.min(1, Game.toastTimer / 30);
    ctx.font = 'bold 20px ' + FONT;
    const tw = ctx.measureText(Game.toastText).width + 48;
    roundRect(ctx, W / 2 - tw / 2, 640, tw, 44, 22);
    ctx.fillStyle = 'rgba(12,8,28,0.92)'; ctx.fill();
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = 2; ctx.stroke();
    drawText(ctx, Game.toastText, W / 2, 663, { size: 20, color: '#ffe27a' });
    ctx.globalAlpha = 1;
  }
  if (DEBUG) drawText(ctx, 'DEBUG  ·  ' + fps + ' FPS  ·  particles: ' + particles.length, 12, 20, { size: 14, align: 'left', color: '#7dff9a', stroke: 3 });
}

let lastTime = null, accumulator = 0;
function frame(now) {
  if (lastTime === null) lastTime = now;
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 250) dt = 250;                // after a hiccup (tab switch), don't try to catch up forever
  accumulator += dt;
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 1000) { fps = fpsFrames; fpsFrames = 0; fpsTime = 0; }
  try {
    let steps = 0;
    while (accumulator >= STEP) {
      update();
      accumulator -= STEP;
      if (++steps >= 5) { accumulator = 0; break; }
    }
    render();
  } catch (err) {
    console.error(err);                  // log it, but keep the game running
  }
  requestAnimationFrame(frame);
}

Game.setScreen('home');
requestAnimationFrame(frame);
</script>
